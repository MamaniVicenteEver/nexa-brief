<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas · instalaciones, economía y archivo</title><link rel="icon" href="data:,">
<style>@font-face{font-family:AtlasEditorial;src:url('../../assets/fonts/AtlasEditorial.ttf')}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#081e2c;color:#e9e3ba;font-family:AtlasEditorial,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}#controls{position:fixed;bottom:15px;left:3%;right:3%;display:flex;gap:10px;align-items:center;padding:12px;background:#081e2ce8;border:1px solid #47595c}input{flex:1;min-width:50px}select,button{background:#e9e3ba;color:#081e2c;padding:8px;border:0;font:inherit;max-width:42vw}#status{position:fixed;top:2%;left:3%;font-size:13px;max-width:94%;white-space:pre-wrap}body.shot #controls,body.shot #status{display:none}</style></head>
<body><canvas id="map"></canvas><div id="status">Cargando medios locales…</div><div id="controls"><button id="play">Reproducir</button><select id="component"></select><input id="time" type="range" min="0" max="104" step="0.01" value="0"><span id="clock">0.00 s</span></div>
<script type="module">
import {create,Tactico} from '../../../_tactico/core.js';
import {createView} from '../../../_atlas/plano/view.js';
import {createTiles} from '../../../_atlas/plano/tiles.js';
import {createTerritories} from '../../../_atlas/plano/territories.js';
import {atlasURL} from '../../../_atlas/plano/paths.js';
const qs=new URLSearchParams(location.search);if(qs.has('shot'))document.body.classList.add('shot');
const canvas=document.querySelector('canvas'),g=canvas.getContext('2d',{willReadFrequently:true}),status=document.querySelector('#status');
const get=async url=>{const r=await fetch(url);if(!r.ok)throw Error(`${r.status}: ${url}`);return r.json();};
try{
 await document.fonts.load('24px AtlasEditorial');
 const scene=await get(qs.get('items')??'scene-editorial.json');
 const [look,providers,collection,inventory]=await Promise.all([get('../../../_atlas/looks/tactico.json'),get(atlasURL('providers.json')),get(atlasURL('data/geo/admin0.geojson')),get('../bench/cache-inventory.json')]);
 const territories=createTerritories(collection),provider=providers.find(x=>x.id==='gibs-bluemarble');
 const tiles=createTiles(provider,look,territories,inventory);const st={W:innerWidth,H:innerHeight,U:innerWidth/1080};
 canvas.width=st.W;canvas.height=st.H;
 const view=createView({lon:51.5,lat:28,zoom:5,bearing:0},st.W,st.H);tiles.plan(view);await tiles.preload();
 const background=new OffscreenCanvas(st.W,st.H),bg=background.getContext('2d');bg.fillStyle=look.background;bg.fillRect(0,0,st.W,st.H);tiles.draw(bg,view);territories.draw(bg,view,[],0,look);
 const shade=bg.createRadialGradient(st.W*.5,st.H*.45,st.W*.1,st.W*.5,st.H*.5,st.H*.75);shade.addColorStop(0,'#081e2c00');shade.addColorStop(1,'#081e2cc0');bg.fillStyle=shade;bg.fillRect(0,0,st.W,st.H);
 const c={st,look,scene,T:(x,f=0)=>typeof x==='number'?x:f};
 const runtime=await create(c,scene);let t=Number(qs.get('t')??0),playing=false,last=0;
 const slider=document.querySelector('#time');slider.max=scene.duration;
 const select=document.querySelector('#component');for(const item of scene.items){const option=document.createElement('option');option.value=item.t;option.textContent=item.type;select.append(option);}
 function draw(time){t=time;g.globalAlpha=1;g.resetTransform();g.drawImage(background,0,0);runtime.draw(g,view,time);g.fillStyle=scene.defs.palette.paper;g.textAlign='center';g.font=`800 ${24*st.U}px AtlasEditorial`;const item=scene.items.find(x=>time>=x.t&&time<x.out+.35);g.fillText(item?.type??'Galería D · F',st.W/2,st.H*.065);g.font=`${14*st.U}px AtlasEditorial`;g.fillText('Mapa: NASA GIBS / Blue Marble · Natural Earth',st.W/2,st.H*.91);slider.value=time;document.querySelector('#clock').textContent=time.toFixed(2)+' s';return runtime.key(time);}
 slider.oninput=()=>draw(Number(slider.value));select.onchange=()=>draw(Number(select.value)+4.5);document.querySelector('#play').onclick=()=>{playing=!playing;last=0;document.querySelector('#play').textContent=playing?'Pausar':'Reproducir';if(playing)requestAnimationFrame(tick);};
 function tick(now){if(!playing)return;const dt=last?(now-last)/1000:0;last=now;draw((t+dt)%scene.duration);requestAnimationFrame(tick);}
 window.__editorial={ready:true,scene,view,runtime,c,draw,canvas,background,Tactico,missing:()=>({tiles:tiles.missingTiles(),assets:runtime.missing()})};draw(t);status.textContent='Galería D · F · '+scene.items.length+' demostraciones';
}catch(error){status.textContent=error.stack;console.error(error);window.__editorialError=String(error);}
</script></body></html>
