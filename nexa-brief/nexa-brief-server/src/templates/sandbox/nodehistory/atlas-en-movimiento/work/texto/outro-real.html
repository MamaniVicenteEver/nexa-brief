<!doctype html><html lang="es"><meta charset="utf-8"><title>Cierre aplicado · Atlas</title><style>body{font:16px system-ui;background:#fff;color:#222;margin:25px}main{display:flex;flex-wrap:wrap;gap:20px;align-items:start}canvas{max-width:100%;height:auto;background:#20252b}#h{width:min(780px,100%)}#v{width:min(270px,100%)}</style><h1>Cierre aplicado en el motor</h1><p>Vista de los formatos horizontal y vertical. La animación se repite cada ocho segundos.</p><button id="restart">Repetir</button><main><canvas id="h" width="960" height="540"></canvas><canvas id="v" width="540" height="960"></canvas></main><p id="status">Cargando…</p><script type="module">
import {create} from '../../engine/tactico/core.js';
const item={id:'cierre',type:'outro.channel',t:0,dur:8,out:8,fade:0,channel:'NODEHISTORY',handle:'youtube.com/@nodehistory'};
const palette={background:'#081e2c',paper:'#e9e3ba',accent:'#f6edb4'};
try { const runtime=await create({st:{W:960,H:540,U:1},look:{palette},geo:{place:p=>p}},{duration:8,end:8,items:[item]});let start=performance.now();document.querySelector('#restart').onclick=()=>start=performance.now();document.querySelector('#status').textContent='Componente original actualizado';function frame(){let t=(performance.now()-start)/1000%8;for(const canvas of document.querySelectorAll('canvas')){const g=canvas.getContext('2d');g.clearRect(0,0,canvas.width,canvas.height);runtime.draw(g,{W:canvas.width,H:canvas.height,zoom:1,project:()=>({x:0,y:0,k:1})},t)}requestAnimationFrame(frame)}frame();}catch(e){document.querySelector('#status').textContent=e.message;console.error(e)}
</script></html>
