<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vista de componente</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=DM+Sans:wght@700;800;900&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#fff;overflow:hidden}#stage,canvas{position:fixed;inset:0;display:block}</style></head><body><audio id="audio" preload="none"></audio><div id="stage"></div>
<script>
// El Showcase suministra ejemplos en memoria; no modifica los datos del episodio.
const galleryQuery = new URLSearchParams(location.search);
const galleryFetch = window.fetch.bind(window);
const jsonResponse = data => new Response(JSON.stringify(data), {headers:{'Content-Type':'application/json'}});
window.fetch = async (...args) => {
  const request = typeof args[0] === 'string' ? args[0] : args[0] instanceof URL ? args[0].href : args[0].url;
  const url = new URL(request, location.href);
  const pose = galleryQuery.get('pose');
  const sample = galleryQuery.get('sample');
  if (sample === 'card-images') {
    // La demostración usa el mismo motor, pero no carga el config, voz ni letra del video.
    if (url.pathname.endsWith('/config.json'))
      return jsonResponse({configs:[{sceneUrl:'assets/scene.json',overlaysUrl:'assets/overlays.json'}]});
    if (url.pathname.endsWith('/assets/overlays.json')) return jsonResponse({items:[]});
    if (url.pathname.endsWith('/assets/scene.json')) {
      const catalogResponse = await galleryFetch('showcase/components.json');
      if (!catalogResponse.ok) throw new Error('No se pudo cargar el ejemplo de tarjetas.');
      const catalog = await catalogResponse.json();
      const example = catalog.components.find(item => item.name === 'comparacion.dos-tarjetas')?.demo;
      if (!example || !Array.isArray(example.subjects) || !Array.isArray(example.shots)) throw new Error('Ejemplo de tarjetas inválido.');
      return jsonResponse(example);
    }
  }
  const response = await galleryFetch(...args);
  if (!pose || !url.pathname.endsWith('/assets/scene.json') || !response.ok) return response;
  const scene = await response.json();
  scene.shots = [{t:0, mode:'duo', focus:'both', headline:'¿QUIÉN GANÓ LA CARRERA ESPACIAL?', pose}];
  scene.avatar = {...scene.avatar, timeline:[]};
  return jsonResponse(scene);
};
</script><script src="../../_proto/proto.js"></script><script src="../_pizarra/comparacion.js"></script></body></html>
