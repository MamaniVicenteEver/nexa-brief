<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inés · modelo articulado 2.5D</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #efefef; }
    #stage { position: fixed; inset: 0; display: grid; place-items: center; perspective: 1200px; }
    #character { height: 94vh; max-width: 96vw; aspect-ratio: 2 / 3; transform-style: preserve-3d; }
    #character svg { width: 100%; height: 100%; display: block; transform-origin: 50% 50%; }
  </style>
</head>
<body>
  <main id="stage"><div id="character"></div></main>
  <script type="module" src="./demo.js"></script>
</body>
</html>
