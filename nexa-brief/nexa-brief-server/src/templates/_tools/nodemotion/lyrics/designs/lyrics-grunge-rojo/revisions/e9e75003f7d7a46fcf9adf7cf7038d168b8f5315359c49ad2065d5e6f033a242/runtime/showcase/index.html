<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grunge Rojo · componentes</title>
<!-- Galería de componentes de lyrics-grunge-rojo. Muestra SOLO el componente pedido:
     ?only=<nombre> (ver components.json)  ?aspect=16:9|9:16  ?p=<JSON de parámetros>
     ?t=<s> congela  ?loop=0 no repite. Sin audio: reloj propio; el metraje va en bucle. -->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
  #frame { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; }
  #grain { position: absolute; inset: -50px; }
</style>
<link rel="stylesheet" href="../components/grunge.css">
<script src="../components/core.js"></script>
<script src="../components/fondo.js"></script>
<script src="../components/garabatos.js"></script>
<script src="../components/escenas.js"></script>
<script src="../components/transiciones.js"></script>
<script src="../components/intro.js"></script>
<script src="../components/outro-v1.js"></script>
<script src="../components/outro-v2.js"></script>
<script>window.__GRUNGE_NO_BOOT = true;</script>
<script src="../player.js"></script>
</head>
<body>
<div id="frame"><div id="stage"></div><div id="grain"></div></div>
<script>
(async function () {
  "use strict";
  const G = window.GrungeRojo, K = G.core, R = G.registry, P = G.player;
  const q = new URLSearchParams(location.search);
  const only = q.get("only") || "grunge.escena";
  let p = {}; try { p = JSON.parse(q.get("p") || "{}") || {}; } catch (e) { console.warn("p inválido"); }
  let raw = null;
  try { const r = await fetch("../assets/config.json"); if (r.ok) { const db = await r.json(); raw = (db.configs || [db]).find(c => c.id === db.activeId) || (db.configs || [db])[0]; } } catch (e) {}
  const C = P.validate(raw || P.DEFAULTS);
  const rel = s => (s && !/^(https?:|\/|data:)/.test(s) ? "../" + s : s);
  for (const k in C.fonts) C.fonts[k].src = rel(C.fonts[k].src);
  C.media = C.media.map(m => ({ ...m, src: rel(m.src), poster: rel(m.poster) }));
  for (const k of ["title", "artist"]) if (typeof p[k] === "string" && only === "grunge.intro") C.intro[k] = p[k];
  for (const k of ["title", "sub", "feats"]) if (typeof p[k] === "string" && only.startsWith("grunge.outro")) C.outro[k] = p[k];
  if (!C.intro.title) C.intro.title = "Grunge Rojo";
  await P.loadFonts(C);
  K.measureCache.clear();
  const [aw, ah] = (q.get("aspect") || "9:16").split(":").map(Number);
  const frame = document.getElementById("frame"), stage = document.getElementById("stage");
  const s0 = Math.min(innerWidth / aw, innerHeight / ah), W = Math.round(aw * s0), H = Math.round(ah * s0);
  frame.style.width = W + "px"; frame.style.height = H + "px";
  const tex = P.textures(C), ctx = P.makeCtx(C, W, H, tex);
  P.applyLook(C, ctx);
  const grain = document.getElementById("grain"); grain.style.backgroundImage = `url(${tex.grain})`; grain.style.opacity = String(C.motion.grain);
  const text = p.text || "Like whoa put us on the map";
  const words = text.split(/\s+/).map((w, i) => ({ text: w, t: 0.1 + i * 0.16 }));
  const key = words.reduce((b, w, i) => (w.text.length > words[b].text.length ? i : b), 0);
  const prev = ["Roll up 20 deep", "low homie belt is snapped", "Like whoa put a hundred down", "and put us on the map", "the place I had to go", "lose control"];
  const clip = Number(p.clip ?? 0) % Math.max(1, C.media.length);
  const lyric = type => ({ kind: "scene", type, text, words, key, t0: 0, t1: p.duration ?? 2, bg: p.bg || "footage", clip, clipOff: 0, prev: prev.slice(0, 2),
    v: { color: p.color || "red", strip: p.strip || "none", doodle: p.doodle || null, high: false }, transition: p.transition || "cut", seed: Number(p.seed ?? 7) });
  const specs = {
    "grunge.intro": () => ({ kind: "intro", t0: 0, t1: p.duration ?? 2.6, bg: "footage", clip, clipOff: 0, v: {}, seed: 7 }),
    "grunge.outrov1": () => ({ kind: "outro", id: "grunge.outrov1", t0: 0, t1: p.duration ?? 3.6, bg: "footage", clip, clipOff: 0, v: {}, seed: 7 }),
    "grunge.outrov2": () => ({ kind: "outro", id: "grunge.outrov2", t0: 0, t1: p.duration ?? 3.6, prev, v: {}, seed: 7 }),
    "grunge.escena": () => lyric(R.scenes[p.scene] ? p.scene : "linea"),
    "grunge.transiciones": () => ({ ...lyric("linea"), transition: R.transitions[p.type] ? p.type : "tear", t1: p.duration ?? 1.2 }),
    "grunge.interludios": () => ({ kind: "interlude", type: R.interludes[p.type] ? p.type : "metraje", text: p.text || "lose control", t0: 0, t1: p.duration ?? 2, bg: "footage", clip, clipOff: 0, v: { strip: "bottom" }, seed: 7 }),
    "grunge.garabatos": () => ({ ...lyric("linea"), v: { color: "white", strip: "none", doodle: R.doodles[p.doodle] ? p.doodle : "circle" } }),
    "grunge.papel": () => ({ ...lyric("linea"), v: { color: "red", strip: "bottom", doodle: null } }),
    "grunge.repaso": () => ({ kind: "interlude", type: "rejilla", text: p.text || "but now I won't", t0: 0, t1: 2, bg: "footage", clip, clipOff: 0, v: {}, seed: 7 })
  };
  if (!specs[only]) console.warn(`componente desconocido: ${only}`);
  const sc = (specs[only] || specs["grunge.escena"])();
  const b = P.buildScene(sc, ctx);
  stage.appendChild(b.root);
  const slot = b.root.querySelector(".gr-slot");
  const m = C.media[sc.clip];
  let video = null;
  if (slot && m && m.type === "video") {
    video = document.createElement("video"); video.muted = true; video.playsInline = true; video.loop = true; video.src = encodeURI(m.src);
    slot.appendChild(video);
  }
  const L = sc.t1 - sc.t0, loop = q.get("loop") !== "0";
  const frozen = q.has("t") ? parseFloat(q.get("t")) || 0 : null;
  const draw = t => { b.update(Math.min(t, L)); grain.style.transform = `translate(${(Math.floor(t * 24) * 37) % 50}px, ${(Math.floor(t * 24) * 53) % 50}px)`; };
  let t0 = null;
  function tick(now) { if (t0 === null) t0 = now; let t = (now - t0) / 1000; if (loop) t = t % (L + 0.8); draw(t); requestAnimationFrame(tick); }
  window.__grungeShowcase = { only, spec: sc, seek: draw };
  if (frozen != null) { if (video) { try { video.currentTime = Math.min(frozen, 9); } catch (e) {} } draw(frozen); }
  else { if (video) video.play().catch(() => {}); requestAnimationFrame(tick); }
})();
</script>
</body>
</html>
