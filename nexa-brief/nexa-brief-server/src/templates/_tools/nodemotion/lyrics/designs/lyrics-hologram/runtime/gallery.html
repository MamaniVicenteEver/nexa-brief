<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>lyrics-hologram · galería de componentes</title><style>body{margin:0;background:#09090f;color:#ddd;font:14px/1.4 system-ui,sans-serif}main{padding:20px 16px}h1{font-size:18px;margin:0 0 4px}p{color:#999;margin:0 0 14px}button{background:#1b1a2a;color:#eee;border:1px solid #3a3860;border-radius:6px;padding:6px 12px;cursor:pointer}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-top:14px}body.v .g{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}figure{margin:0}.f{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}body.v .f{aspect-ratio:9/16}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}figcaption{margin-top:6px;color:#aaa}body.only{background:#000}body.only main{padding:0}body.only .solo{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}body.only .solo .f{width:min(100vw,100vh*16/9);border-radius:0}body.only.v .solo .f{width:min(100vw,100vh*9/16)}</style></head><body>
<main><h1>lyrics-hologram · galería de componentes</h1>
<p>Cada vista es el documento real congelado (<code>?t=</code>) en una escena de ese tipo con la canción y el config por defecto. <code>?only=&lt;nombre&gt;</code> muestra solo un componente; <code>aspect=9:16</code> cambia el formato.</p>
<button onclick="document.body.classList.toggle('v')">Cambiar 16:9 / 9:16</button>
<div class="g"></div></main>
<script>const C = [{"name": "intro", "label": "Intro · emblema holográfico + título", "t": 2.59, "q": ""}, {"name": "holoWord", "label": "Palabra holográfica con ecos", "t": 4.71, "q": ""}, {"name": "outlineBack", "label": "Gigante en contorno + banda", "t": 11.2, "q": ""}, {"name": "slice", "label": "Frase cortada por barras", "t": 20.05, "q": ""}, {"name": "assemble", "label": "Letras que se ensamblan", "t": 7.91, "q": ""}, {"name": "repeatStack", "label": "Frase repetida en columna", "t": 20.98, "q": ""}, {"name": "verse", "label": "Verso espaciado + fantasma", "t": 26.28, "q": ""}, {"name": "band", "label": "Frase con barra holográfica", "t": 13.5, "q": ""}, {"name": "panel", "label": "Ventanas de medio + frase", "t": 18.07, "q": ""}, {"name": "silhouette", "label": "Silueta holográfica + palabra", "t": 9.55, "q": ""}, {"name": "trio", "label": "Palabra ×3 con rótulo", "t": 29.8, "q": ""}, {"name": "chrome", "label": "Palabra holográfica a sangre", "t": 10.38, "q": ""}, {"name": "vertical", "label": "Palabra en columna + laterales", "t": 8.73, "q": ""}, {"name": "giantOutline", "label": "Contorno gigante + frase", "t": 42.03, "q": ""}, {"name": "rows", "label": "Filas inclinadas que corren", "t": 6.75, "q": ""}, {"name": "outroV1", "label": "Outro v1 · tarjeta holográfica", "t": 134.2, "q": "&outro=v1"}, {"name": "outroV2", "label": "Outro v2 · seda holográfica", "t": 134.2, "q": "&outro=v2"}];
const qs = new URLSearchParams(location.search), only = qs.get("only"), aspect = qs.get("aspect");
if (aspect === "9:16") document.body.classList.add("v");
const src = c => "index.html?headless=1&t=" + c.t + c.q;
const fig = c => `<figure><div class="f"><iframe loading="lazy" src="${src(c)}" title="${c.name}"></iframe></div><figcaption><b>${c.name}</b> · ${c.label} · t = ${c.t} s</figcaption></figure>`;
const pick = only && C.find(c => c.name === only);
if (pick) { document.body.classList.add("only"); document.querySelector("main").innerHTML = `<div class="solo"><div class="f"><iframe src="${src(pick)}" title="${pick.name}"></iframe></div></div>`; }
else document.querySelector(".g").innerHTML = C.map(fig).join("");</script></body></html>
