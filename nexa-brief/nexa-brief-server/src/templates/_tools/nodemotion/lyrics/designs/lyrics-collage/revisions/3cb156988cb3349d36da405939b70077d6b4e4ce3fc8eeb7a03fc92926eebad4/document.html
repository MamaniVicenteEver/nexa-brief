<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COLLAGE CALLEJERO — Recortes urbanos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Stardos+Stencil:wght@400;700&family=Permanent+Marker&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

<body>
<!-- filtro de tinta rugosa para los sellos stencil -->
<svg width="0" height="0" style="position:fixed">
  <filter id="rough">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
  </filter>
</svg>
<div id="paper"></div>
<img id="bg" alt="">
<div id="rays"></div>
<div id="decoTL" class="deco"></div>
<div id="decoBR" class="deco"></div>
<div id="decoStar" class="deco"></div>
<div id="viewport"><div id="stage"><div id="caption"></div></div></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="intro" class="cardScreen"><div class="flyer"><div class="tape"></div>
  <div class="artist"></div>
  <div class="title"></div>
  <div class="sub"></div>
  <div class="feats"></div>
</div></div>
<div id="outro" class="cardScreen"><div class="flyer"><div class="tape"></div>
  <div class="artist"></div>
  <div class="title"></div>
  <div class="sub"></div>
  <div class="feats"></div>
</div></div>
<div id="hint" aria-hidden="true"></div>
<audio id="audio" preload="auto"></audio>

<script type="module"><!-- nodemotion-fragment:scripts/02-runtime.js --></script>
</body>
