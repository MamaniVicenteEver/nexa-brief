<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NODETECH · outro v1 · HTML</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #stage canvas, #stage svg, #stage > div { box-sizing: border-box; }
</style>
</head>
<body>
<div id="stage"></div>
<audio id="audio" preload="auto"></audio>
<script src="../../../engine/loader.js" data-design="binary" data-noboot></script>
<script>
  document.addEventListener("pointerdown", () => {
    const audio = document.getElementById("audio");
    if (audio.paused) audio.play().catch(() => {});
  }, { once: true });
  (async () => {
    try {
      const design = await window.KitReady;
      const raw = await fetch("assets/config.json").then(r => r.json());
      const config = raw.configs ? raw.configs[0] : raw;
      await window.Kit.boot({
        design,
        config,
        total: config.preview?.total ?? 12,
        startAt: config.preview?.startAt ?? 8.4,
      });
    } catch (error) {
      console.error("No se pudo iniciar el outro HTML", error);
    }
  })();
</script>
</body>
</html>
