<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promo Dynamic — Neón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; cursor: pointer; }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  .scene { position: absolute; left: 0; top: 0; overflow: hidden; }
  .lay { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .grp { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .mbox { position: absolute; overflow: hidden; }
  .media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .patch { position: absolute; pointer-events: none; }
  .grain { position: absolute; inset: 0; pointer-events: none; }
  .bx { position: absolute; left: 0; top: 0; white-space: nowrap; }
  .tx { display: inline-block; white-space: nowrap; line-height: 0.92; }
  .ch, .wd { display: inline-block; white-space: pre; }
  #hud { position: fixed; left: 8px; top: 8px; z-index: 50; display: none; padding: 6px 8px;
         font: 11px/1.4 ui-monospace, monospace; color: #0f0; background: rgba(0,0,0,0.7); pointer-events: none; }
  #hint { position: fixed; bottom: 6vh; width: 100vw; text-align: center; z-index: 8; font: 700 1.6vh system-ui, sans-serif;
          letter-spacing: 0.4em; color: #fff; opacity: 0.55; pointer-events: none; }
  :root { --fEx: "Archivo", sans-serif; }
  .ex { font-family: var(--fEx); font-weight: 900; font-stretch: 125%; text-transform: uppercase; }
  .lb { font-family: var(--fEx); font-weight: 800; font-stretch: 125%; text-transform: uppercase; letter-spacing: 0.02em; }

  /* ── Recording UI ─────────────────────────────────────────────────────── */
  #rec-btn {
    position: fixed; bottom: 24px; right: 24px; z-index: 9999;
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(10,10,10,0.85); border: 2px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(8px); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, border-color .15s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #rec-btn:hover { transform: scale(1.1); border-color: rgba(255,60,60,0.7); }
  #rec-btn svg { width: 18px; height: 18px; }
  #rec-btn.recording { border-color: #ff3c3c; animation: rec-pulse 1.2s ease-in-out infinite; }
  @keyframes rec-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,60,60,.5)} 50%{box-shadow:0 0 0 8px rgba(255,60,60,0)} }
  #rec-panel {
    position: fixed; bottom: 84px; right: 24px; z-index: 9999;
    width: 280px; background: rgba(10,10,12,0.96);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 16px;
    padding: 18px; backdrop-filter: blur(20px);
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    display: none; flex-direction: column; gap: 10px;
    font-family: system-ui, -apple-system, sans-serif;

  #rec-panel h3 {
    color: rgba(255,255,255,0.9); font-size: 11px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    margin: 0 0 4px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);

    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 10px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.03);

  .rec-engine.active { border-color: rgba(255,60,60,0.5); background: rgba(255,40,40,0.08); }

    font-size: 16px; flex-shrink: 0;
  }
  .rec-engine-info { flex: 1; min-width: 0; }
  .rec-engine-name { color: #fff; font-size: 13px; font-weight: 600; margin: 0 0 2px; }
  .rec-engine-desc { color: rgba(255,255,255,0.45); font-size: 10px; line-height: 1.3; margin: 0; }
  .rec-engine-badge {

    margin-top: 4px; padding: 11px; border-radius: 10px; border: none; cursor: pointer;
    background: #e03030; color: #fff; font-size: 13px; font-weight: 700;
    letter-spacing: .04em; transition: background .12s, opacity .12s; font-family: inherit;
  }
  #rec-go:hover { background: #c52020; }
  #rec-go:disabled { opacity: .35; cursor: not-allowed; }
  #rec-status {
    font-size: 10px; color: rgba(255,255,255,0.4); text-align: center;
    min-height: 14px; font-family: inherit;
  }
  body.headless #rec-btn, body.headless #rec-panel, body.headless #hint { display: none !important; }

</head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<div id="hint">CLICK PARA EMPEZAR</div>
<audio id="audio" preload="auto"></audio>
<!-- ── Recording panel ────────────────────────────────────────────────── -->
<button id="rec-btn" title="Motor de grabación (R)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" style="color:#fff">
    <circle cx="12" cy="12" r="7" fill="rgba(255,60,60,0.85)" stroke="none"/>
    <circle cx="12" cy="12" r="11" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>
  </svg>
</button>
<div id="rec-panel">
  <h3>Motor de grabación</h3>
  <div class="rec-engine" data-engine="hyperframes">
    <div class="rec-engine-icon" style="background:rgba(255,160,30,0.15)">⚡</div>
    <div class="rec-engine-info">
      <p class="rec-engine-name">HyperFrames</p>
      <p class="rec-engine-desc">Rápido, nativo del pipeline Nexa.</p>
    </div>
    <span class="rec-engine-badge badge-fast">RÁPIDO</span>
  </div>
  <div class="rec-engine" data-engine="remotion">
    <div class="rec-engine-icon" style="background:rgba(100,60,255,0.15)">🎬</div>
    <div class="rec-engine-info">
      <p class="rec-engine-name">Remotion</p>
      <p class="rec-engine-desc">Mejor calidad, render más lento.</p>
    </div>
    <span class="rec-engine-badge badge-quality">CALIDAD</span>
  </div>
  <div class="rec-engine" data-engine="playwright">
    <div class="rec-engine-icon" style="background:rgba(60,180,255,0.15)">🎭</div>
    <div class="rec-engine-info">
      <p class="rec-engine-name">Playwright</p>
      <p class="rec-engine-desc">Captura real del navegador.</p>
    </div>
    <span class="rec-engine-badge badge-dev">BROWSER</span>
  </div>
  <button id="rec-go" disabled>● Grabar</button>
  <p id="rec-status"></p>
</div>
<!-- ──────────────────────────────────────────────────────────────────────── -->


<script type="module">
/* Promo Dynamic — Neón — opener sobre fondo neón: letra negra extendida, palabras gigantes en contorno, letras que barren la pantalla, fotos recortadas con estela y HUD técnico. */
const NAME = "promo-dynamic";
const ACTIVE_ID = null;   /* <-- forzar un id · null = usa "activeId" del JSON */
const DEFAULT_CONFIG = {"activeId": "default", "configs": [{"id": "default", "description": "Opener deportivo 'Dynamic' sobre verde neón: tipografía negra extendida, palabras gigantes en contorno que se desplazan, letras enormes que barren la pantalla como transición, fotos de atletas recortadas con borde pixelado y estela de copias, y logo final con foto dentro de la letra. — metadata para marketing/SEO, la plantilla no la usa todavía.", "audio": {"src": "assets/promo-dynamic.mp3"}, "lyricsUrl": "assets/promo-dynamic.lyrics.json", "fonts": {"googleUrl": "https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"}, "palette": {"neon": "#C9FF1F", "ink": "#1E1E1E"}, "brand": {"tag": "NEXA BRIEF\nSPORT SERIES", "url": "@NEXABRIEF · SUSCRÍBETE", "vertical": "NEXA BRIEF"}, "texture": {"grain": 0.05}, "scenes": [{"type": "word", "flyer": "DE", "flyerAt": 0.05}, {"type": "word"}, {"type": "photo", "media": ["basket"], "side": "right", "flyer": "FUE", "flyerAt": 0.3}, {"type": "stack", "media": ["basket-2"], "rows": 4}, {"type": "photo", "media": ["sprint"], "side": "right", "shape": "square", "flyer": "DIN", "flyerAt": 0.2}, {"type": "photo", "media": ["boxing-1"], "side": "left", "shape": "square"}, {"type": "collage", "media": ["basket-1", "skate", "soccer-2", "ropes-1"]}, {"type": "word", "stretch": true}, {"type": "word"}, {"type": "collage", "media": ["boxing-2", "sprint-1", "skate-1", "basket"]}, {"type": "banner", "media": ["soccer"], "flyer": "20", "flyerAt": 1.3}, {"type": "photo", "media": ["skate"], "side": "right", "shape": "landscape", "flyer": "RA", "flyerAt": 1.6}, {"type": "photo", "media": ["ropes"], "side": "left", "flyer": "NUE", "flyerAt": 1.7}, {"type": "duo", "media": ["basket", "sprint"], "flyer": "EST", "flyerAt": 1.9}, {"type": "full", "media": ["soccer-1"]}, {"type": "full", "media": ["boxing"], "shape": "landscape"}, {"type": "full", "media": ["skate-2"]}, {"type": "full", "media": ["ropes-2"], "shape": "landscape"}, {"type": "logo", "media": ["basket-1"]}], "debug": {"enabled": false}, "seed": 11, "media": [{"id": "basket", "type": "video", "src": "assets/media/basketball.mp4", "poster": "assets/media/basketball-1.jpg"}, {"id": "sprint", "type": "video", "src": "assets/media/sprinter.mp4", "poster": "assets/media/sprinter-1.jpg"}, {"id": "boxing", "type": "video", "src": "assets/media/boxing.mp4", "poster": "assets/media/boxing-1.jpg"}, {"id": "skate", "type": "video", "src": "assets/media/skate.mp4", "poster": "assets/media/skate-1.jpg"}, {"id": "ropes", "type": "video", "src": "assets/media/battle-ropes.mp4", "poster": "assets/media/battle-ropes-1.jpg"}, {"id": "soccer", "type": "video", "src": "assets/media/soccer.mp4", "poster": "assets/media/soccer-1.jpg"}, {"id": "basket-1", "type": "image", "src": "assets/media/basketball-1.jpg"}, {"id": "basket-2", "type": "image", "src": "assets/media/basketball-2.jpg"}, {"id": "sprint-1", "type": "image", "src": "assets/media/sprinter-1.jpg"}, {"id": "sprint-2", "type": "image", "src": "assets/media/sprinter-2.jpg"}, {"id": "boxing-1", "type": "image", "src": "assets/media/boxing-1.jpg"}, {"id": "boxing-2", "type": "image", "src": "assets/media/boxing-2.jpg"}, {"id": "skate-1", "type": "image", "src": "assets/media/skate-1.jpg"}, {"id": "skate-2", "type": "image", "src": "assets/media/skate-2.jpg"}, {"id": "ropes-1", "type": "image", "src": "assets/media/battle-ropes-1.jpg"}, {"id": "ropes-2", "type": "image", "src": "assets/media/battle-ropes-2.jpg"}, {"id": "soccer-1", "type": "image", "src": "assets/media/soccer-1.jpg"}, {"id": "soccer-2", "type": "image", "src": "assets/media/soccer-2.jpg"}]}]};
const FONT_LOADS = ["900 100px Archivo", "800 100px Archivo"];

/* ======================= NÚCLEO COMÚN (promo-*) =========================
   Idéntico en las 4 plantillas de LYRICS-comercial (promo-trendy,
   promo-dynamic, promo-urban, promo-sports). Contrato:
   · config.json  = colección { activeId, configs: [ CASO ] } (como neon /
     caution): audio, lyricsUrl, paleta, fuentes, MEDIA (videos / imágenes)
     y la coreografía `scenes` (tipo de escena + media por escena).
   · lyricsUrl   = guion en formato Whisper { segments: [ { start, end, text,
     words: [ { word, start, end } ] } ] }. UN segmento = UNA escena (corte en
     segment.start, palabras que aparecen en word.start). Campos extra
     opcionales por segmento: "lines" (cómo partir el texto en renglones) y
     "sub" (texto chico de acompañamiento). Una transcripción real de Whisper
     también sirve tal cual.
   · Todo se anima con Tracks propios (interpolan y escriben style solo si
     cambia; sin Web Animations → nada se promueve a capa y el headless no se
     hunde) posicionados con el reloj del audio: ?t=SEG congela un cuadro y
     los videos se buscan a ese instante exacto.
   Servir por HTTP (python3 -m http.server): por file:// el fetch se bloquea. */
const doc = document, $ = id => doc.getElementById(id);
const QS = new URLSearchParams(location.search);
const FROZEN = QS.has("t") ? parseFloat(QS.get("t")) : null;

async function loadDB() {
  for (const u of ["config.json", `assets/${NAME}.config.json`]) {
    try { const r = await fetch(u); if (r.ok) return await r.json(); } catch (e) {}
  }
  console.warn(`[${NAME}] config.json no disponible — usando DEFAULT_CONFIG embebido`);
  return DEFAULT_CONFIG;
}
/* merge profundo de objetos; los arrays (media, scenes…) se reemplazan enteros */
function deepMerge(a, b) {
  if (Array.isArray(b) || typeof b !== "object" || b === null) return b === undefined ? a : b;
  const out = { ...(typeof a === "object" && a && !Array.isArray(a) ? a : {}) };
  for (const k of Object.keys(b)) out[k] = deepMerge(out[k], b[k]);
  return out;
}
const DB = await loadDB();
const RAW = DB.configs.find(c => c.id === ACTIVE_ID) || DB.configs.find(c => c.id === DB.activeId) || DB.configs[0];
const C = deepMerge(DEFAULT_CONFIG.configs[0], RAW);
const DEBUG = C.debug?.enabled || QS.get("debug") === "1";
if (C.fonts?.googleUrl) {
  const link = doc.querySelector('link[href^="https://fonts.googleapis.com/css2"]');
  if (link && link.href !== C.fonts.googleUrl) link.href = C.fonts.googleUrl;
}
for (const [k, v] of Object.entries(C.palette || {})) doc.documentElement.style.setProperty("--" + k, v);

function mulberry32(a) { return function() {
  a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const EASE_OUT = "cubic-bezier(.16,.84,.24,1)", EASE_IN = "cubic-bezier(.6,0,.9,.4)", EASE_IO = "cubic-bezier(.65,0,.3,1)";
const EASE_BACK = "cubic-bezier(.3,1.5,.5,1)";

/* ---------------- Tracks: interpolación propia, seek determinista ---------------- */
const NUM = /-?\d*\.?\d+(?:e-?\d+)?/g;
function lerpStr(a, b, p) {
  if (p <= 0 || a === b) return a;
  if (p >= 1) return b;
  const na = a.match(NUM), nb = b.match(NUM);
  if (!na || !nb || na.length !== nb.length) return p < 0.5 ? a : b;
  let i = 0;
  return b.replace(NUM, () => { const v = +na[i] + (+nb[i] - +na[i]) * p; i++; return String(Math.round(v * 1000) / 1000); });
}
const easeCache = new Map();
function easeFn(spec) {
  let f = easeCache.get(spec);
  if (f) return f;
  const m = /cubic-bezier\(([^)]+)\)/.exec(spec);
  if (!m) f = spec.startsWith("steps") ? () => 0 : p => p;
  else {
    const [x1, y1, x2, y2] = m[1].split(",").map(Number);
    const bz = (t, a, b) => 3 * a * t * (1 - t) * (1 - t) + 3 * b * t * t * (1 - t) + t * t * t;
    const dbz = (t, a, b) => 3 * a * (1 - t) * (1 - t) + 6 * (b - a) * t * (1 - t) + 3 * (1 - b) * t * t;
    f = x => {
      let t = x;
      for (let i = 0; i < 6; i++) { const d = dbz(t, x1, x2); if (Math.abs(d) < 1e-6) break; t -= (bz(t, x1, x2) - x) / d; t = clamp(t, 0, 1); }
      return bz(t, y1, y2);
    };
  }
  easeCache.set(spec, f);
  return f;
}
class Track {
  constructor(el, prop, init, discrete = false) { this.el = el; this.prop = prop; this.discrete = discrete; this.keys = [[0, init, "linear"]]; }
  get last() { return this.keys[this.keys.length - 1][1]; }
  set(t, v) { this.keys.push([t, v, "linear"]); return this; }
  to(t0, d, v, ease = "linear") { this.keys.push([t0, this.last, ease]); this.keys.push([t0 + Math.max(0.001, d), v, "linear"]); return this; }
  compile() {
    this.ks = this.keys.slice().sort((a, b) => a[0] - b[0]).map(([t, v, e]) => [t, v, easeFn(this.discrete ? "steps" : e)]);
    this.a = Infinity; this.b = -Infinity;
    for (let i = 1; i < this.ks.length; i++)
      if (this.ks[i][1] !== this.ks[i - 1][1]) { this.a = Math.min(this.a, this.ks[i - 1][0]); this.b = Math.max(this.b, this.ks[i][0]); }

  }
  value(t) {
    const ks = this.ks;
    if (t <= ks[0][0]) return ks[0][1];
    for (let i = ks.length - 1; i >= 0; i--) {
      if (t < ks[i][0]) continue;
      const nx = ks[i + 1];
      if (!nx) return ks[i][1];
      const span = nx[0] - ks[i][0];
      return span <= 0 ? nx[1] : lerpStr(ks[i][1], nx[1], ks[i][2]((t - ks[i][0]) / span));
    }
    return ks[0][1];
  }
  seek(t) {
    const side = t < this.a ? -1 : t > this.b ? 1 : 0;
    if (side !== 0 && side === this.side) return;
    this.side = side;
    const v = this.value(t);
    if (v !== this.cur) {
      if (this.prop[0] === "@") this.el[this.prop.slice(1)] = v;   /* "@textContent" → propiedad directa */
      else this.el.style[this.prop] = v;
      this.cur = v;
    }
  }
}

/* ---------------- DOM, texto, medición ---------------- */
function div(parent, cls, css) {
  const d = doc.createElement("div");
  if (cls) d.className = cls;
  if (css) Object.assign(d.style, css);
  if (parent) parent.appendChild(d);
  return d;
}
const meas = (() => { const m = doc.createElement("span"); m.style.cssText = "position:absolute;left:-99999px;top:0;visibility:hidden;white-space:pre;font-size:100px;line-height:1"; doc.body.appendChild(m); return m; })();
const measCache = new Map();
function measure(text, cls, ls = 0) {
  const key = cls + "|" + ls + "|" + text;
  let m = measCache.get(key);
  if (!m) {
    meas.className = "tx " + cls; meas.style.letterSpacing = ls + "em"; meas.textContent = text;
    const r = meas.getBoundingClientRect();
    m = { w: Math.max(1, r.width), h: Math.max(1, r.height) };
    measCache.set(key, m);

}
const fit = (text, cls, ls, maxW, maxH) => { const m = measure(text, cls, ls); return 100 * Math.min(maxW / m.w, maxH / m.h); };
const textW = (text, cls, ls, fs) => measure(text, cls, ls).w * fs / 100;
/* texto decorativo enorme → <canvas> rasterizado UNA vez (mover un texto de
   1000+ px re-rasteriza cada cuadro en headless: 27 → 7 fps). Respeta fuente,
   peso, itálica, font-stretch, mayúsculas, espaciado, contorno y textura. */
const STRETCH = { "50%": "ultra-condensed", "62.5%": "extra-condensed", "75%": "condensed", "87.5%": "semi-condensed", "112.5%": "semi-expanded", "125%": "expanded", "150%": "extra-expanded", "200%": "ultra-expanded" };
function canvasText(text, o) {
  meas.className = "tx " + (o.cls || ""); meas.style.letterSpacing = "0em";
  const cs = getComputedStyle(meas), fs = o.fs;
  const t = cs.textTransform === "uppercase" ? text.toUpperCase() : text;
  const cv = doc.createElement("canvas"), cx = cv.getContext("2d");
  const setFont = () => {
    cx.font = `${cs.fontStyle} ${cs.fontWeight} ${fs}px ${cs.fontFamily}`;
    cx.fontStretch = STRETCH[cs.fontStretch] || "normal";
    cx.letterSpacing = `${(o.ls || 0) * fs}px`;
  };
  setFont();
  const sw = o.stroke ? (o.swPx ?? Math.max(1, fs * (o.sw || 0.012))) : 0;
  const padL = fs * 0.06 + sw, padR = fs * 0.22 + sw;
  const w = Math.ceil(cx.measureText(t).width + padL + padR), h = Math.ceil(fs * 1.3);
  cv.width = Math.min(16000, w); cv.height = h;
  setFont();
  cx.textBaseline = "middle";
  const y = h / 2 + fs * 0.04;
  if (o.stroke) { cx.lineWidth = sw; cx.strokeStyle = o.color; cx.lineJoin = "round"; cx.strokeText(t, padL, y); }
  else { cx.fillStyle = o.color; cx.fillText(t, padL, y); }
  if (o.texture) {            /* textura de piedra: motas oscuras solo sobre la letra */
    cx.globalCompositeOperation = "source-atop";
    const n = Math.floor(cv.width * cv.height / 220);
    for (let i = 0; i < n; i++) { cx.fillStyle = `rgba(0,0,0,${0.08 + texRng() * 0.3})`; const s = 1 + texRng() * 3; cx.fillRect(texRng() * cv.width, texRng() * cv.height, s, s); }
    cx.globalCompositeOperation = "source-over";
  }
  cv.className = "tx"; cv.style.width = cv.width + "px"; cv.style.height = h + "px"; cv.style.display = "block";
  return cv;

  X.T(o.el, "transform", "translateX(0px)").to(t0, d, `translateX(${-(W + w)}px)`, "cubic-bezier(.45,.05,.4,1)");
  blurPass(X.T(o.el, "filter", "none", true), t0, d, "x");
  X.T(o.box, "visibility", "hidden", true).set(t0, "visible").set(t0 + d, "hidden");
}
/* palabra gigante en contorno desplazándose detrás */
function bgWord(X, L, text, y = 0.5, speed = 0.18) {
  const { W, H, u } = X, fs = 0.58 * H;
  const o = tx(L, text, { cls: "ex", fs, x: 0, y: y * H, ax: 0, color: P.ink, stroke: true, sw: 0.003 });
  o.el.style.webkitTextStroke = `${Math.max(1, 1.3 * u)}px ${P.ink}`;
  const w = textW(text, "ex", 0, fs);
  X.T(o.el, "transform", `translateX(${0.15 * W}px)`).to(0, X.dur, `translateX(${0.15 * W - speed * W * X.dur}px)`);
  return w;
}
/* palabra sólida que aparece tecleada (orden aleatorio) y se estira al salir */
function mainWord(X, L, text, x, y, fs, o = {}) {
  const w = tx(L, text, { cls: "ex", fs, x, y, ax: o.ax ?? 0, color: o.color || P.ink, split: "chars", stroke: o.stroke, sw: 0.012 });
  if (o.stroke) w.el.style.webkitTextStroke = `${Math.max(1, 1.2 * X.u)}px ${P.ink}`;
  const t0 = o.t0 ?? 0.1, ord = w.chars.map((_, i) => i).sort(() => X.r() - 0.5);
  ord.forEach((ci, k) => { const t = t0 + k * 0.025; if (t > 0.001) X.T(w.chars[ci], "visibility", "hidden", true).set(t, "visible"); });
  if (o.stretch) {
    const te = X.dur - 0.28, pick = Math.floor(w.chars.length * 0.35);
    w.chars.forEach((ch, i) => {
      if (i === pick) { ch.style.transformOrigin = "0% 50%"; X.T(ch, "transform", "scaleX(1)").to(te, 0.2, "scaleX(9)", EASE_IN); }
      else if (i > pick) X.T(ch, "transform", "translateX(0px)").to(te, 0.2, `translateX(${fs * 5.4}px)`, EASE_IN);
    });
  }
  return w;
}
const L0 = X => (X.lines[0]?.text || X.sc.seg.text || "").toUpperCase();
const L1 = X => (X.lines[1]?.text || "").toUpperCase();
const rt0 = (X, i = 0) => Math.max(0.08, X.lines[i]?.rt ?? 0.15);
function base(X) { const L = div(X.root, "lay", { background: P.neon }); hudDecor(X, L); return L; }

const B = {};

B.word = (sc, X) => {
  const { W, H } = X, L = base(X), word = L0(X);
  bgWord(X, L, word, 0.5);
  const fs = fit(word, "ex", 0, 0.34 * W, 0.075 * H);
  mainWord(X, L, word, 0.5 * W, 0.5 * H, fs, { ax: 0.5, t0: rt0(X), stretch: sc.slot.stretch !== false && X.dur > 1 });
  flyer(X, L, sc.slot.flyer, sc.slot.flyerAt ?? 0, 0.45);
  const sub = sc.seg.sub;
  if (sub) tx(L, sub.toUpperCase(), { cls: "lb", fs: 8.5 * X.u, x: 0.76 * W, y: 0.78 * H, ax: 0, color: P.ink });
};

B.photo = (sc, X) => {
  const { W, H, u } = X, L = base(X), word = L0(X), sub = L1(X);
  const right = (sc.slot.side || (sc.idx % 2 ? "left" : "right")) === "right";
  const shape = sc.slot.shape || "portrait";
  const pw = shape === "square" ? 0.28 * W : shape === "landscape" ? 0.36 * W : 0.22 * W;
  const ph = shape === "square" ? 0.44 * H : shape === "landscape" ? 0.48 * H : 0.56 * H;
  bgWord(X, L, word, 0.52);
  const px = right ? 0.56 * W : 0.14 * W, py = 0.5 * H - ph / 2;
  cut(X, L, 0, { x: px, y: py, w: pw, h: ph }, { dir: right ? "right" : "left", out: true });
  const fs = fit(word, "ex", 0, 0.3 * W, 0.085 * H);
  const tx0 = right ? px - 0.03 * W : px + pw + 0.03 * W;
  mainWord(X, L, word, tx0, 0.47 * H, fs, { ax: right ? 1 : 0, t0: rt0(X), stretch: X.dur > 1.2 });
  if (sub) mainWord(X, L, sub, tx0, 0.47 * H + fs * 1.02, fs, { ax: right ? 1 : 0, t0: rt0(X, 1), stroke: true });
  if (BR.tag) tx(L, BR.tag.toUpperCase(), { cls: "lb", fs: 8.5 * u, x: right ? px + pw + 0.012 * W : px - 0.012 * W, y: py + ph * 0.93, ax: right ? 0 : 1, color: P.ink });
  flyer(X, L, sc.slot.flyer, sc.slot.flyerAt ?? 0.3, 0.5);
};

B.stack = (sc, X) => {
  const { W, H } = X, L = base(X), word = L0(X), n = sc.slot.rows || 4;
  const pw = 0.18 * W, ph = 0.52 * H, px = 0.6 * W, py = 0.26 * H;
  cut(X, L, 0, { x: px, y: py, w: pw, h: ph }, { dir: "right", echo: 6, d: 0.45 });
  const fs = fit(word, "ex", 0, 0.28 * W, 0.08 * H), lh = fs * 0.98;
  for (let i = 0; i < n; i++) {
    const solid = i === n - 2;
    mainWord(X, L, word, 0.56 * W, 0.5 * H + (i - (n - 1) / 2) * lh, fs, { ax: 1, t0: rt0(X) + i * 0.05, stroke: !solid });
  }
};

B.collage = (sc, X) => {
  const { W, H, u } = X, L = base(X), a = L0(X), b = L1(X);
  const rects = [
    { x: 0.04 * W, y: 0.05 * H, w: 0.22 * W, h: 0.3 * H, dir: "left" },
    { x: 0.3 * W, y: 0.02 * H, w: 0.2 * W, h: 0.64 * H, dir: "up" },
    { x: 0.6 * W, y: 0.55 * H, w: 0.2 * W, h: 0.34 * H, dir: "right" },
    { x: 0.2 * W, y: 0.62 * H, w: 0.12 * W, h: 0.2 * H, dir: "down" }
  ];
  rects.forEach((rc, i) => cut(X, L, i, rc, { dir: rc.dir, t0: 0.05 + i * 0.12, echo: 4, stretch: i === 1 }));
  bgWord(X, L, a, 0.6, 0.12);
  const fs = fit(a, "ex", 0, 0.24 * W, 0.08 * H);
  mainWord(X, L, a, 0.03 * W, 0.47 * H, fs, { t0: rt0(X) });
  if (b) mainWord(X, L, b, 0.56 * W, 0.22 * H, fit(b, "ex", 0, 0.28 * W, 0.09 * H), { t0: rt0(X, 1), stretch: X.dur > 2 });
  if (sc.seg.sub) {
    const s = tx(L, sc.seg.sub.toUpperCase(), { cls: "lb", fs: 8.5 * u, x: 0.03 * W, y: 0.55 * H, ax: 0, color: P.ink });
    s.el.style.whiteSpace = "pre"; s.el.style.lineHeight = "1.2";
  }
};

B.banner = (sc, X) => {
  const { W, H, u } = X, L = base(X), word = L0(X);
  bgWord(X, L, word, 0.2, 0.06);
  cut(X, L, 0, { x: 0.18 * W, y: 0.31 * H, w: 0.64 * W, h: 0.3 * H }, { dir: "up", t0: 0.05, out: true });
  const fs = fit(word, "ex", 0, 0.24 * W, 0.1 * H);
  mainWord(X, L, word, 0.64 * W, 0.2 * H, fs, { ax: 0.5, t0: rt0(X) });
  if (BR.tag) tx(L, BR.tag.toUpperCase(), { cls: "lb", fs: 8.5 * u, x: 0.8 * W, y: 0.66 * H, ax: 1, color: P.ink });
  flyer(X, L, sc.slot.flyer, sc.slot.flyerAt ?? 1.2, 0.55, 0.3);
};

B.duo = (sc, X) => {
  const { W, H } = X, L = base(X), word = L0(X);
  bgWord(X, L, word, 0.5, 0.1);
  cut(X, L, 0, { x: 0.42 * W, y: 0.02 * H, w: 0.52 * W, h: 0.3 * H }, { dir: "right" });
  cut(X, L, 1, { x: 0.02 * W, y: 0.6 * H, w: 0.55 * W, h: 0.33 * H }, { dir: "left", t0: 0.15 });
  const fs = fit(word, "ex", 0, 0.26 * W, 0.09 * H);
  mainWord(X, L, word, 0.5 * W, 0.47 * H, fs, { ax: 0.5, t0: rt0(X) });
  flyer(X, L, sc.slot.flyer, sc.slot.flyerAt ?? X.dur * 0.5, 0.5);
};

B.full = (sc, X) => {
  const { W, H } = X, L = base(X), word = L0(X);
  bgWord(X, L, word, 0.5, 0.2);
  const land = (sc.slot.shape || "portrait") === "landscape";
  const pw = land ? 0.62 * W : 0.34 * W, ph = land ? 0.9 * H : 0.96 * H;
  cut(X, L, 0, { x: (W - pw) / 2, y: (H - ph) / 2, w: pw, h: ph }, { dir: "up", d: 0.22, echo: 3, stretch: false });
  const fs = fit(word, "ex", 0, 0.3 * W, 0.1 * H);
  [-2, -1, 1, 2].forEach(k => mainWord(X, L, word, 0.5 * W, 0.5 * H + k * fs * 0.95, fs, { ax: 0.5, t0: rt0(X) + Math.abs(k) * 0.04, stroke: true, color: "#FFFFFF" }));
  mainWord(X, L, word, 0.5 * W, 0.5 * H, fs, { ax: 0.5, t0: rt0(X) });
};

B.logo = (sc, X) => {
  const { W, H, u } = X, L = base(X), word = L0(X), url = (L1(X) || BR.url || "").toUpperCase();
  const grp = div(L, "lay");
  bgWord(X, grp, word.replace(/ /g, ""), 0.28, 0.05);
  const gap = 0.1 * W, sp = word.indexOf(" ");
  const fs = fit(word, "ex", 0, W * 0.8 - (sp >= 0 ? gap : 0), 0.17 * H);
  const w = mainWord(X, grp, word, 0.5 * W, 0.44 * H, fs, { ax: 0.5, t0: rt0(X) });
  /* la foto va en el hueco entre palabras (o sobre la letra central si es una sola) */
  let cx;
  if (sp >= 0) {
    w.chars[sp].style.width = gap + "px";
    const full = textW(word, "ex", 0, fs) - textW(" ", "ex", 0, fs) + gap;
    cx = 0.5 * W - full / 2 + textW(word.slice(0, sp), "ex", 0, fs) + gap / 2;
  } else {
    const tw = textW(word, "ex", 0, fs), mid = Math.floor(word.length / 2);
    cx = 0.5 * W - tw / 2 + textW(word.slice(0, mid), "ex", 0, fs) + textW(word[mid] || "O", "ex", 0, fs) / 2;
  }
  cut(X, grp, 0, { x: cx - gap * 0.42, y: 0.44 * H - 0.13 * H, w: gap * 0.84, h: 0.26 * H }, { dir: "up", t0: rt0(X) + 0.2, echo: 3, stretch: false });
  const fu = fit(url, "ex", 0, 0.42 * W, 0.04 * H);
  const rows = [];
  for (let i = 0; i < 3; i++) rows.push(mainWord(X, L, url, 0.5 * W, 0.63 * H + i * fu * 1.05, fu, { ax: 0.5, t0: rt0(X, 1) + i * 0.08, stroke: i !== 1 }));
  /* al final queda solo la URL, centrada (las letras tienen visibility propia → se oculta con opacity) */
  const tf = Math.max(1.2, X.dur * 0.3);
  X.T(grp, "opacity", "1", true).set(tf, "0");
  rows.forEach((o, i) => {
    if (i !== 1) X.T(o.box, "opacity", "1", true).set(tf + 0.1, "0");
    else X.T(o.el, "transform", "translateY(0px)").to(tf, 0.3, `translateY(${0.5 * H - (0.63 * H + fu * 1.05)}px)`, EASE_IO);
  });
};

boot();

/* ── Recording UI ──────────────────────────────────────────────────────── */
(function initRecUI() {
  if (new URLSearchParams(location.search).get('headless') === '1') {
    document.body.classList.add('headless'); return;
  }
  const btn    = document.getElementById('rec-btn');
  const panel  = document.getElementById('rec-panel');
  const goBtn  = document.getElementById('rec-go');
  const status = document.getElementById('rec-status');
  if (!btn) return;
  let selectedEngine = null, recording = false;

  function togglePanel() { panel.classList.toggle('open'); }
  btn.addEventListener('click', e => { e.stopPropagation(); togglePanel(); });
  document.addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') togglePanel(); });
  document.addEventListener('click', e => {
    if (!panel.contains(e.target) && e.target !== btn) panel.classList.remove('open');
  });
  document.querySelectorAll('.rec-engine').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.rec-engine').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      selectedEngine = el.dataset.engine;
      goBtn.disabled = false;
      status.textContent = '';
    });
  });
  goBtn.addEventListener('click', async () => {
    if (!selectedEngine || recording) return;
    recording = true;
    btn.classList.add('recording');
    goBtn.disabled = true;
    panel.classList.remove('open');
    status.textContent = 'Iniciando ' + selectedEngine + '…';
    const templateName = location.pathname.split('/').filter(Boolean).slice(-2, -1)[0]
                         || document.title || 'unknown';
    const payload = { engine: selectedEngine, template: templateName, timestamp: Date.now() };
    window.postMessage({ type: 'nexa:record', ...payload }, '*');
    document.dispatchEvent(new CustomEvent('nexa:record', { detail: payload }));
    try {
      const res = await fetch('/api/v1/record', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      status.textContent = res.ok ? (await res.json()).message || ('Grabando con ' + selectedEngine + '…')
                                  : 'API ' + res.status + ' — evento emitido';
    } catch { status.textContent = 'Sin servidor — evento emitido (' + selectedEngine + ')'; }
    setTimeout(() => { recording = false; btn.classList.remove('recording'); goBtn.disabled = false; status.textContent = ''; }, 8000);
  });
})();
/* ─────────────────────────────────────────────────────────────────────────── */
</script>
