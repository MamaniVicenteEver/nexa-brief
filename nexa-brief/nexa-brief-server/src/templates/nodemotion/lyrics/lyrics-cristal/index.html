<title>CRISTAL ROTO — Letras que rompen el vidrio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* tema — defaults idénticos a config.json; applyTheme() los pisa */
  :root { --night: #07040F; --glass: #DDF3FF; --mono: "JetBrains Mono", monospace; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--night); cursor: pointer; }

  /* cámara: el "rig" lleva el mundo y la lámina de vidrio juntos (mismo
     encuadre → la foto congelada de los fragmentos coincide al píxel). Mide

<script type="module">

   recortada a contraluz). Cada frase de la letra es una composición

    "golpe": "\"Big Shoulders Display\", Impact, sans-serif",

/* sprite de texto pre-renderizado (el glow con shadowBlur es caro: se paga
   UNA vez por palabra, no por cuadro) */
function textSprite(text, voice, fs, fill, glow, blur) {
  const V = VOICE[voice], m = measure(text, voice, fs);
  const pad = Math.ceil(glow ? fs * 0.3 : fs * 0.06 + (blur || 0) * 2) + 2;
  const w = Math.ceil(m.w + pad * 2), h = Math.ceil(m.asc + m.desc + pad * 2);
  const cv = newCanvas(w * DPR, h * DPR), x = cv.getContext("2d");
  x.scale(DPR, DPR);
  x.font = V.font(fs); x.letterSpacing = (V.spacing ? V.spacing * fs : 0) + "px";
  x.textBaseline = "alphabetic"; x.fillStyle = fill;
  if (blur) x.filter = `blur(${blur}px)`;

  if (glow) {

    x.fillText(text, bx, by);
    x.shadowColor = hexA(glow, 0.5); x.shadowBlur = fs * 0.12 * DPR; x.shadowOffsetY = 0;
    x.fillText(text, bx, by);
    x.shadowColor = "transparent"; x.shadowBlur = 0;

  x.fillText(text, bx, by);
  return { cv, w, h, pad, asc: m.asc, desc: m.desc, mw: m.w };
}
/* bisel del vidrio esmerilado: filo de luz arriba-izquierda, sombra abajo-derecha */
function rimSprite(text, voice, fs) {
  const off = Math.max(1, fs * 0.014);
  const light = textSprite(text, voice, fs, hexA(P.glass, 0.95));
  const lx = light.cv.getContext("2d");
  lx.globalCompositeOperation = "destination-out"; lx.fillStyle = "#000";
  lx.fillText(text, light.pad + off, light.pad + light.asc + off);
  const dark = textSprite(text, voice, fs, "rgba(0,0,0,0.55)");
  const dx = dark.cv.getContext("2d");
  dx.globalCompositeOperation = "destination-out"; dx.fillStyle = "#000";
  dx.fillText(text, dark.pad - off, dark.pad + dark.asc - off);
  lx.globalCompositeOperation = "source-over"; lx.setTransform(1, 0, 0, 1, 0, 0);
  lx.drawImage(dark.cv, 0, 0);
  return light;
}

/* ---- texturas estáticas: disco de bokeh, estela, ruido, reflejos, vaho ---- */
const spriteCache = {};
function discSprite(color, kind) {

  const s = kind === "bokeh" ? 256 : 128, cv = newCanvas(s, s), x = cv.getContext("2d");
  const g = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  if (kind === "bokeh") {   /* disco plano con el borde más brillante, como un bokeh real */
    g.addColorStop(0, hexA(color, 0.42)); g.addColorStop(0.7, hexA(color, 0.5));
    g.addColorStop(0.86, hexA(color, 0.85)); g.addColorStop(0.95, hexA(color, 0.22)); g.addColorStop(1, hexA(color, 0));
  } else {
    g.addColorStop(0, hexA(color, 1)); g.addColorStop(0.35, hexA(color, 0.5)); g.addColorStop(1, hexA(color, 0));
  }

}

  x.scale(1, 32 / 512);

  g.addColorStop(0, "rgba(255,255,255,0.95)"); g.addColorStop(0.12, hexA(color, 0.8)); g.addColorStop(1, hexA(color, 0));

function buildStatics() {
  /* reflejos del vidrio: bandas diagonales + brillo de esquina + manchas de dedos */

  g.addColorStop(0, "rgba(255,255,255,0.07)"); g.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = g; x.fillRect(0, 0, RW, RH);

    const cx = r() * RW, cy = r() * RH, rr = (0.02 + r() * 0.07) * RW;
    g = x.createRadialGradient(cx, cy, 0, cx, cy, rr);
    g.addColorStop(0, `rgba(255,255,255,${0.012 + r() * 0.025})`); g.addColorStop(1, "rgba(255,255,255,0)");

/* ================================ MUNDOS ================================
   Lo que se ve A TRAVÉS del vidrio. Cambia en cada estallido. Tipos:
   bokeh / aurora / rayos (100% generativos) · video / image (media real) —
   cualquiera acepta "figure" (PNG recortado a contraluz) y los de media
   aceptan "lights" (bokeh encima). */
let camPar = { x: 0, y: 0 };   /* deriva de cámara → parallax interno del mundo */

function drawBg(x, bg) {

  g.addColorStop(0, bg[1] || bg[0]); g.addColorStop(1, bg[0]);
  x.fillStyle = g; x.fillRect(0, 0, GW, GH);

function drawCover(x, media, mw, mh, zoom, ox, oy, mirror) {
  const s = Math.max(GW / mw, GH / mh) * zoom, w = mw * s, h = mh * s;
  const dx = (GW - w) / 2 + ox, dy = (GH - h) / 2 + oy;
  if (mirror) { x.save(); x.translate(GW, 0); x.scale(-1, 1); x.drawImage(media, dx, dy, w, h); x.restore(); }
  else x.drawImage(media, dx, dy, w, h);
}

function makeBokeh(def, r) {
  const cols = def.colors?.length ? def.colors : [P.hot, P.cool, "#FFB347", "#8A5CFF"];
  const bg = def.bg || [P.night, "#1A0B2E"];
  const sprites = cols.map(c => discSprite(c, "bokeh"));
  const lights = Array.from({ length: Math.round(46 * (def.density ?? 1)) }, () => ({
    x: r(), y: r(), z: Math.pow(r(), 0.8), c: Math.floor(r() * cols.length),
    vx: (r() - 0.5) * 0.012, vy: (r() - 0.5) * 0.005, ph: r() * TAU, fl: 0.4 + r() * 1.6,
  }));
  const streaks = def.overlay ? [] : Array.from({ length: def.streaks ?? 5 }, () => ({
    y: 0.3 + r() * 0.55, sp: (0.03 + r() * 0.07) * (r() < 0.5 ? -1 : 1), x0: r(), len: 0.2 + r() * 0.35,
    c: r() < 0.5 ? "#FFB347" : (r() < 0.5 ? "#FF3B3B" : "#FFFFFF"), a: 0.16 + r() * 0.18,
  }));
  return { draw(x, t, e) {
    if (!def.overlay) drawBg(x, bg);
    x.globalCompositeOperation = "lighter";
    const kA = def.overlay ? 0.55 : 1;
    for (const l of lights) {
      const px = ((((l.x + l.vx * t) % 1) + 1) % 1) * GW * 1.2 - GW * 0.1 - camPar.x * (0.2 + 0.6 * l.z);
      const py = ((((l.y + l.vy * t) % 1) + 1) % 1) * GH * 1.1 - GH * 0.05 - camPar.y * (0.2 + 0.6 * l.z);
      const rad = vmin * (0.02 + 0.13 * l.z * l.z) * (1 + e * 0.22 * l.z);
      x.globalAlpha = clamp((0.16 + 0.5 * l.z) * (0.72 + 0.28 * Math.sin(t * l.fl + l.ph)) * (0.75 + e * 0.5) * kA, 0, 1);
      x.drawImage(sprites[l.c], px - rad, py - rad, rad * 2, rad * 2);
    }
    for (const s of streaks) {   /* estelas de faros cruzando la calle */
      const px = ((((s.x0 + s.sp * t) % 1) + 1) % 1) * GW * 1.6 - GW * 0.3, len = s.len * GW;
      x.globalAlpha = clamp(s.a * (0.8 + 0.4 * e), 0, 1);

}

function makeAurora(def, r) {
  const cols = def.colors?.length ? def.colors : [P.hot, "#FF7A18", "#6A00FF", P.cool];
  const bg = def.bg || [P.night, "#140620"];
  const blobs = Array.from({ length: def.blobs ?? 7 }, (_, i) => ({
    c: cols[i % cols.length], ax: 0.18 + r() * 0.3, ay: 0.16 + r() * 0.28,
    sx: 0.05 + r() * 0.1, sy: 0.04 + r() * 0.09, px: r() * TAU, py: r() * TAU, s: 0.45 + r() * 0.45,
  }));
  const motes = Array.from({ length: 80 }, () => ({ x: r(), y: r(), s: 0.6 + r() * 1.8, v: 0.006 + r() * 0.02, ph: r() * TAU }));
  return { draw(x, t, e) {
    drawBg(x, bg);
    x.globalCompositeOperation = "lighter";
    for (const b of blobs) {
      const cx = GW * (0.5 + b.ax * Math.sin(t * b.sx * 2 + b.px)) - camPar.x * 0.25;
      const cy = GH * (0.5 + b.ay * Math.cos(t * b.sy * 2 + b.py)) - camPar.y * 0.25;

      x.drawImage(discSprite(b.c, "soft"), cx - rad, cy - rad, rad * 2, rad * 2);

      const px = m.x * GW - camPar.x * 0.5, py = ((((m.y - m.v * t) % 1) + 1) % 1) * GH - camPar.y * 0.5;
      x.globalAlpha = 0.25 + 0.35 * Math.sin(t * 2 + m.ph) ** 2;

}

function makeRayos(def, r) {

  const bg = def.bg || ["#03040C", "#0B1030"];
  const n = def.beams ?? 7;
  const beams = Array.from({ length: n }, (_, i) => ({
    fx: 0.06 + (i / Math.max(1, n - 1)) * 0.88 + (r() - 0.5) * 0.04, c: cols[i % cols.length],
    sw: 0.3 + r() * 0.4, sp: 0.3 + r() * 0.5, ph: r() * TAU, wid: 0.05 + r() * 0.07, base: (r() - 0.5) * 0.6,
  }));
  return { draw(x, t, e) {
    drawBg(x, bg);
    x.globalCompositeOperation = "lighter";
    let g = x.createRadialGradient(GW / 2, GH * 0.95, 0, GW / 2, GH * 0.95, GW * 0.6);
    g.addColorStop(0, hexA(cols[0], 0.16 + e * 0.1)); g.addColorStop(1, hexA(cols[0], 0));
    x.fillStyle = g; x.fillRect(0, 0, GW, GH);
    const len = GH * 1.45;
    for (const b of beams) {
      const ang = Math.PI / 2 + b.base + Math.sin(t * b.sp + b.ph) * b.sw;
      const sx = b.fx * GW - camPar.x * 0.3, sy = -GH * 0.04 - camPar.y * 0.3;
      const ex = sx + Math.cos(ang) * len, ey = sy + Math.sin(ang) * len;
      const k = 0.55 + 0.6 * e;
      for (const [wm, am] of [[1, 0.35], [0.35, 0.6]]) {   /* haz ancho y suave + núcleo */
        const half = b.wid * GW * 0.5 * wm * (1 + e * 0.25);
        const nx = -Math.sin(ang) * half, ny = Math.cos(ang) * half;
        g = x.createLinearGradient(sx, sy, ex, ey);
        g.addColorStop(0, hexA(b.c, clamp(am * k, 0, 1))); g.addColorStop(0.55, hexA(b.c, am * k * 0.25)); g.addColorStop(1, hexA(b.c, 0));
        x.fillStyle = g;
        x.beginPath(); x.moveTo(sx, sy); x.lineTo(ex + nx, ey + ny); x.lineTo(ex - nx, ey - ny); x.closePath(); x.fill();
      }
      const gr = vmin * 0.06 * (1 + e * 0.6);
      x.globalAlpha = 0.8; x.drawImage(discSprite("#FFFFFF", "soft"), sx - gr, sy - gr, gr * 2, gr * 2); x.globalAlpha = 1;
    }
    x.globalCompositeOperation = "source-over";
  } };
}

function makeMedia(def, r) {
  const isVideo = def.type === "video";
  let el, failed = false;
  if (isVideo) {
    el = doc.createElement("video");
    el.muted = true; el.loop = true; el.playsInline = true; el.preload = "auto";
    el.addEventListener("loadedmetadata", () => { el.playbackRate = def.rate ?? 1; });
  } else el = new Image();
  el.addEventListener("error", () => { failed = true; console.warn("[cristal-roto] no cargó el mundo", def.src, "— cae a bokeh"); });
  el.src = def.src;
  const lights = def.lights ? makeBokeh({ colors: def.lightColors, density: 0.4, overlay: true }, r) : null;
  const w = {
    enterT: 0, mirror: !!def.mirror,
    get ok() { return !failed; },
    enter(t) { w.enterT = t; if (isVideo && !MANUAL) el.play().catch(() => {}); },
    leave() { if (isVideo) el.pause(); },
    draw(x, t, e) {
      x.fillStyle = P.night; x.fillRect(0, 0, GW, GH);
      const ready = isVideo ? el.readyState >= 2 : (el.complete && el.naturalWidth > 0);
      if (isVideo && MANUAL && el.duration) {   /* modo manual: el video sigue al reloj */
        const want = (t * (def.rate ?? 1)) % el.duration;
        if (Math.abs(el.currentTime - want) > 0.25) el.currentTime = want;
      }
      if (ready) {
        const mw = isVideo ? el.videoWidth : el.naturalWidth, mh = isVideo ? el.videoHeight : el.naturalHeight;
        /* foto: Ken Burns lento desde que entra; video: zoom fijo */
        const kb = isVideo ? 0 : smooth((t - w.enterT) / 16) * 0.07;
        x.filter = def.filter || "none";
        drawCover(x, el, mw, mh, (def.zoom ?? 1.08) + kb + e * 0.015, -camPar.x * 0.3, -camPar.y * 0.3, w.mirror);
        x.filter = "none";
      }
      if (def.tint) {   /* colorea la toma conservando su luz */
        x.globalCompositeOperation = "color"; x.globalAlpha = def.tintAlpha ?? 0.6;
        x.fillStyle = def.tint; x.fillRect(0, 0, GW, GH);
        x.globalCompositeOperation = "lighter"; x.globalAlpha = 0.04 + e * 0.1; x.fillRect(0, 0, GW, GH);
      }
      x.globalCompositeOperation = "source-over"; x.globalAlpha = def.darken ?? 0.15;
      x.fillStyle = "#000"; x.fillRect(0, 0, GW, GH); x.globalAlpha = 1;
      if (lights) lights.draw(x, t, e);
    },
  };
  return w;
}

/* figura recortada a contraluz, parada detrás del vidrio */
function makeFigure(def, r) {
  const img = new Image();
  let ok = false, cache = null, cacheKey = "";
  const ph = r() * TAU;
  img.onload = () => { ok = true; cache = null; };
  img.onerror = () => console.warn("[cristal-roto] no cargó la figura", def.src);
  img.src = def.src;
  function build() {
    const portrait = vw < vh;
    const h = vh * (def.height ?? 0.86) * (portrait ? 0.72 : 1), w = h * img.naturalWidth / img.naturalHeight;
    const cv = newCanvas(w * DPR, h * DPR), c = cv.getContext("2d");
    c.filter = def.filter || "brightness(0.6) contrast(1.12) saturate(0.9)";
    c.drawImage(img, 0, 0, cv.width, cv.height);
    cache = { cv, w, h }; cacheKey = vw + "x" + vh;
  }
  return {
    get ok() { return ok; }, side: def.side || "right",
    draw(x, t, e) {
      if (!ok) return;
      if (!cache || cacheKey !== vw + "x" + vh) build();
      const { cv, w, h } = cache, side = def.side || "right", portrait = vw < vh;
      let cx = side === "left" ? OX + vw * 0.05 + w / 2 : side === "right" ? OX + vw * 0.95 - w / 2 : OX + vw / 2;
      if (portrait) cx = OX + vw / 2 + (side === "left" ? -1 : side === "right" ? 1 : 0) * vw * 0.14;
      cx -= camPar.x * 0.12;
      const yb = OY + vh * 1.02 - camPar.y * 0.1;
      const gr = h * 0.62;
      x.globalCompositeOperation = "lighter"; x.globalAlpha = clamp(0.5 * (0.7 + e * 0.5), 0, 1);
      x.drawImage(discSprite(def.glow || P.hot, "soft"), cx - gr, yb - h * 0.55 - gr, gr * 2, gr * 2);
      x.globalCompositeOperation = "source-over"; x.globalAlpha = 1;
      x.save(); x.translate(cx, yb); x.rotate(Math.sin(t * 0.8 + ph) * 0.012);
      const s = 1 + e * 0.012; x.scale(s, s);
      x.drawImage(cv, -w / 2, -h, w, h);
      x.restore();
    },
  };
}

function resolveWorldDefs() {
  let list = (Array.isArray(C.worlds) ? C.worlds : []).filter(w => w && w.type);
  /* media que inyecta el pipeline (bg.jpg / bg.mp4): se intercala con los
     mundos generativos, así cada estallido alterna foto real ↔ generativo */
  if (C.bg && C.bg.src) {
    const isVid = C.bg.type === "video" || /\.(mp4|webm|mov|m4v)$/i.test(C.bg.src);
    const base = { type: isVid ? "video" : "image", src: C.bg.src, filter: C.bg.filter, tint: C.bg.tint,
                   tintAlpha: C.bg.tintAlpha ?? 0.35, darken: C.bg.darken ?? 0.25, lights: true };
    const gen = list.filter(w => !["video", "image"].includes(w.type));
    const src = gen.length ? gen : [{ type: "bokeh" }, { type: "rayos" }, { type: "aurora" }];
    list = [];
    src.forEach((w, i) => { list.push({ ...base, mirror: i % 2 === 1 }); list.push(w); });
  }
  if (!list.length) list = [{ type: "bokeh" }, { type: "rayos" }, { type: "aurora" }];
  return list;
}
const WORLDS = resolveWorldDefs().map((def, i) => {
  const r = rngFor(600 + i);
  const make = { bokeh: makeBokeh, aurora: makeAurora, rayos: makeRayos, video: makeMedia, image: makeMedia }[def.type] || makeBokeh;
  const w = make(def, r);
  if (def.figure?.src) w.fig = makeFigure(def.figure, r);
  return w;
});
const FALLBACK_WORLD = makeBokeh({}, rngFor(999));
let worldIdx = 0;
WORLDS[0].enter?.(0);
function currentFigSide() { const w = WORLDS[worldIdx]; return w.fig && w.fig.ok ? w.fig.side : null; }
function switchWorld(t) {
  WORLDS[worldIdx].leave?.();
  worldIdx = (worldIdx + 1) % WORLDS.length;
  WORLDS[worldIdx].enter?.(t);
}
function drawWorld(t, e) {
  const w = WORLDS[worldIdx], x = wctx;
  x.setTransform(DPR * WQ, 0, 0, DPR * WQ, 0, 0);
  x.globalCompositeOperation = "source-over"; x.globalAlpha = 1; x.filter = "none";
  ((w.ok === false) ? FALLBACK_WORLD : w).draw(x, t, e);
  if (w.fig) w.fig.draw(x, t, e);
}
function updateFrost() {
  /* versión chica, desenfocada y aclarada del mundo — es lo que se ve a
     través del vidrio esmerilado y del vaho */
  const f = frctx;
  f.setTransform(1, 0, 0, 1, 0, 0); f.globalCompositeOperation = "source-over"; f.globalAlpha = 1;
  f.filter = "blur(2px) brightness(1.3) saturate(1.25)";
  f.clearRect(0, 0, frostCv.width, frostCv.height);
  f.drawImage(worldCv, 0, 0, frostCv.width, frostCv.height);
  f.filter = "none";
}

/* ================================ LETRA ================================ */
async function loadLyrics() {
  try {
    const r = await fetch(C.lyricsUrl);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const out = [];
    (j.segments || []).forEach((seg, si) => {
      for (const w of seg.words || []) {
        const text = String(w.word || "").trim()
          .replace(/^[^\p{L}\p{N}]+/u, "").replace(/[^\p{L}\p{N}']+$/u, "");
        if (!text) continue;
        out.push({ text, t: +w.start || 0, end: Math.max(+w.end || 0, (+w.start || 0) + 0.12), seg: si });
      }
    });
    if (!out.length) throw new Error("lyrics.json sin palabras");
    out.sort((a, b) => a.t - b.t);
    return out;
  } catch (e) {
    console.warn("[cristal-roto] No se pudo cargar", C.lyricsUrl, "— sirve el HTML por HTTP (Live Server), no por file://.", e);
    return [];
  }
}

/* segmentos de Whisper → frases de ≤ maxWordsPerPhrase palabras, cortando
   en el hueco más grande cerca del medio */
function buildPhrases(words) {
  const segs = [];
  let cur = null;
  for (const w of words) {
    if (!cur || cur.seg !== w.seg) { cur = { seg: w.seg, words: [] }; segs.push(cur); }
    cur.words.push(w);
  }
  const out = [];
  const split = ws => {
    if (ws.length <= L.maxWordsPerPhrase) { out.push(ws); return; }
    let best = 2, bestScore = -Infinity;
    for (let i = 2; i <= ws.length - 2; i++) {
      const score = (ws[i].t - ws[i - 1].end) - Math.abs(i - ws.length / 2) * 0.03;
      if (score > bestScore) { bestScore = score; best = i; }
    }
    split(ws.slice(0, best)); split(ws.slice(best));
  };
  for (const s of segs) split(s.words);
  return out.map((ws, i) => ({
    i, words: ws, start: ws[0].t, end: Math.max(...ws.map(w => w.end)),
    lastT: Math.max(...ws.map(w => w.t)), shown: {},
  }));
}

function voiceOf(ph, k) {
  if (ph.mode === "impacto") return "golpe";
  if (ph.mode === "vaho") return "vaho";
  return (k === ph.hero && ph.heroGolpe) ? "golpe" : "grabado";
}

/* todas las decisiones por frase se sortean ACÁ, una vez, con su propio PRNG
   — independientes del tamaño de pantalla (un resize re-maqueta igual) */
function planPhrases(phrases) {
  const prev = [];
  for (const ph of phrases) {
    const r = rngFor(100 + ph.i);
    const n = ph.words.length, chars = ph.words.reduce((s, w) => s + w.text.length, 0);
    const dpw = (ph.end - ph.start) / n;
    ph.solo = n <= 2 && chars <= 12;
    if (ph.solo) ph.mode = "impacto";
    else {
      const w = { ...L.modeWeights };
      if (dpw > 0.55) w.vaho = (w.vaho || 0) * 2.4;
      if (dpw < 0.3) { w.impacto = (w.impacto || 0) * 1.6; w.vaho = (w.vaho || 0) * 0.35; }
      if (prev.length >= 2 && prev[0] === prev[1]) w[prev[0]] = 0;   /* nunca 3 iguales seguidas */
      ph.mode = pickWeighted(r, w);
    }
    let hi = 0;
    ph.words.forEach((w, k) => { if (w.text.length > ph.words[hi].text.length) hi = k; });
    ph.hero = ph.words[hi].text.length >= 4 || ph.solo ? hi : -1;
    ph.heroSolo = r() < L.heroSoloChance;
    ph.heroGolpe = r() < 0.55;
    ph.accent = pickWeighted(r, L.accentWeights);
    ph.fill = pickWeighted(r, L.fillWeights);
    ph.align = pickWeighted(r, L.alignWeights);
    ph.crack = ph.words.map(() => r() < L.crackChance);
    ph.layoutSeed = Math.floor(r() * 1e9);
    prev.unshift(ph.mode); prev.length = Math.min(prev.length, 2);
  }
}

/* transiciones entre frases: estallido (con cambio de mundo) o fundido
   (las grietas quedan — el daño se acumula hasta que la lámina cede) */
function planTransitions(phrases, hasIntro) {
  const out = [];
  let since = 0, damage = 0, prevT = -1;
  phrases.forEach((ph, i) => {
    const r = rngFor(5000 + i);
    const prev = phrases[i - 1];
    let mode = pickWeighted(r, S.modeWeights);
    const roll = r(), dir = r() < 0.5 ? 1 : -1;
    let kind, t;
    if (!prev) {
      kind = hasIntro ? "shatter" : "fade"; mode = "estallido";
      t = Math.max(0.35, ph.start - 0.3);
    } else {
      const room = ph.start - prev.lastT;
      const want = since >= S.everyMin && (since >= S.everyMax || damage >= S.damageMax || ph.solo || roll < S.chance);
      kind = want ? "shatter" : "fade";
      if (kind === "shatter" && room < 0.8) mode = "estallido";
      const lead = kind === "fade" ? 0.18 : mode === "derrumbe" ? 0.62 : mode === "rafaga" ? 0.45 : 0.26;
      t = (ph.start - prev.end) > 3 ? prev.end + 2.2 : ph.start - lead;
      t = Math.max(t, prev.lastT + 0.4, prevT + 0.3);
    }
    out.push({ t, to: i, kind, mode, dir });
    prevT = t;
    if (kind === "shatter") { since = 0; damage = 0; }
    since++;
    ph.words.forEach((w, k) => { if (voiceOf(ph, k) === "golpe" && ph.crack[k]) damage++; });
  });
  return out;
}

function buildEvents(trans) {
  const out = [];
  for (const tr of trans) {
    if (tr.kind === "shatter") out.push({ t: tr.t - 0.07, type: "blow", tr });
    out.push({ t: tr.t, type: "trans", tr });
    phrases[tr.to].words.forEach((w, k) => out.push({ t: Math.max(w.t, tr.t + 0.03), type: "word", ph: phrases[tr.to], k }));
  }
  const pri = { blow: 0, trans: 1, word: 2 };
  out.sort((a, b) => a.t - b.t || pri[a.type] - pri[b.type]);
  return out;
}

/* ============================== MAQUETACIÓN ==============================
   Cada frase llena la lámina como un afiche: filas que se estiran al ancho
   de la caja (fill) o todas al mismo cuerpo (ragged), con la palabra más
   larga como "héroe" en su propia fila. Si el mundo trae una figura a un
   costado, el bloque de texto se corre al otro lado. */
function buildRows(ph) {
  const portrait = vw < vh;
  const base = ph.mode === "impacto" ? "golpe" : ph.mode;
  const budget = (portrait ? L.rowCharsPortrait : L.rowCharsLandscape) * (ph.mode === "vaho" ? 1.3 : ph.mode === "grabado" ? 0.8 : 1);
  const rows = [];
  let cur = null;
  const flush = () => { if (cur) rows.push(cur); cur = null; };
  ph.words.forEach((w, k) => {
    const voice = voiceOf(ph, k);
    const text = voice === "vaho" ? w.text.toLocaleLowerCase("es") : upper(w.text);
    const isHero = k === ph.hero;
    const accent = isHero && voice === "golpe" && ph.accent !== "none" ? ph.accent : null;
    const wd = { k, text, w, accent };
    if (isHero && ph.words.length > 1 && (ph.heroSolo || voice !== base)) {
      flush(); rows.push({ voice, words: [wd], hero: true, chars: text.length }); return;
    }
    if (cur && (cur.voice !== voice || cur.chars + 1 + text.length > budget)) flush();
    if (!cur) cur = { voice, words: [], chars: -1, hero: false };
    cur.words.push(wd); cur.chars += text.length + 1;
  });
  flush();
  /* una palabrita suelta (≤3 letras) al final se sube a la fila anterior */
  if (rows.length >= 2) {
    const a = rows[rows.length - 2], b = rows[rows.length - 1];
    if (!a.hero && !b.hero && a.voice === b.voice && b.words.length === 1 && b.words[0].text.length <= 3
        && a.chars + 1 + b.words[0].text.length <= budget * 1.35) {
      a.words.push(b.words[0]); a.chars += b.words[0].text.length + 1; rows.pop();
    }
  }
  if (ph.solo && rows.length === 1) rows[0].hero = true;
  return rows;
}

function layoutRows(rows, o) {
  const portrait = vw < vh, r = o.r;
  let boxW = vw * (portrait ? 0.86 : o.card ? 0.6 : 0.66), boxH = vh * (portrait ? 0.54 : 0.64);
  let cx = OX + vw / 2, cy = OY + vh * 0.49;
  const fig = currentFigSide();
  if (!portrait && fig && fig !== "center") { boxW *= 0.8; cx += (fig === "left" ? 1 : -1) * vw * 0.12; }
  if (portrait && fig) { cy -= vh * 0.07; boxH *= 0.86; }
  if (!o.card) { cx += (r() - 0.5) * vw * (portrait ? 0.02 : 0.05); cy += (r() - 0.5) * vh * 0.06; }

  for (const row of rows) {
    const V = VOICE[row.voice];
    let w100 = 0;
    row.words.forEach((wd, j) => { w100 += measure(wd.text, row.voice, 100).w + (j ? V.space * 100 : 0); });
    const fit = boxW / Math.max(1, w100) * 100;
    if (row.fixedFs) row.fs = Math.min(row.fixedFs, fit);
    else {
      const cap = boxH * (o.solo ? 0.66 : row.hero ? 0.42 : 0.3) * (row.voice === "vaho" ? 0.85 : 1);
      row.fs = Math.min(fit, cap);
    }
  }
  if (o.fill === "ragged") {
    const free = rows.filter(rw => !rw.fixedFs);
    if (free.length > 1) {
      const mn = Math.min(...free.map(rw => rw.fs));
      free.forEach(rw => { rw.fs = rw.hero ? Math.min(rw.fs, mn * 1.6) : mn; });
    }
  }
  const metrics = () => {
    let tot = 0;
    rows.forEach((row, j) => {
      const V = VOICE[row.voice];
      let asc = 0, desc = 0, w = 0;
      row.words.forEach((wd, i) => {
        const m = measure(wd.text, row.voice, row.fs);
        wd.mw = m.w; asc = Math.max(asc, m.asc); desc = Math.max(desc, m.desc); w += m.w + (i ? V.space * row.fs : 0);
      });
      row.asc = asc; row.desc = desc; row.w = w;
      row.gapBefore = j ? Math.max(rows[j - 1].fs * VOICE[rows[j - 1].voice].gap, row.fs * V.gap) : 0;
      tot += row.gapBefore + asc + desc;
    });
    return tot;
  };
  let total = metrics();
  if (total > boxH) { const k = boxH / total; rows.forEach(rw => { rw.fs *= k; }); total = metrics(); }

  const align = (portrait || o.card) ? "center" : (o.align || "center");
  const items = [];
  let y = cy - total / 2;
  for (const row of rows) {
    y += row.gapBefore;
    const baseline = y + row.asc;
    const x0 = align === "left" ? cx - boxW / 2 : align === "right" ? cx + boxW / 2 - row.w : cx - row.w / 2;
    const rot = o.rotMax ? (r() - 0.5) * 2 * o.rotMax * Math.PI / 180 : 0;
    const rcx = x0 + row.w / 2, rcy = baseline - (row.asc - row.desc) / 2;
    let x = x0;
    for (const wd of row.words) {
      const dx = x + wd.mw / 2 - rcx;
      items.push(makeItem({
        k: wd.k, text: wd.text, word: wd.w, voice: row.voice, fs: row.fs, rot,
        cx: rcx + dx * Math.cos(rot), cy: rcy + dx * Math.sin(rot), by: (row.asc - row.desc) / 2,
        mw: wd.mw, accent: wd.accent || row.accent || null, solo: !!o.solo, r,
      }));
      x += wd.mw + VOICE[row.voice].space * row.fs;
    }
    y += row.asc + row.desc;
  }
  return items;
}

function makeItem(o) {
  const it = { ...o, tIn: Infinity, tOut: null };
  const { text, voice, fs } = o;
  if (voice === "golpe") {
    const col = o.accent ? P[o.accent] : P.text;
    it.sp = textSprite(text, voice, fs, col, o.accent ? col : "#FFFFFF");
    it.gh = textSprite(text, voice, fs, P.hot);
    it.gc = textSprite(text, voice, fs, P.cool);
  } else if (voice === "grabado") {
    it.mask = textSprite(text, voice, fs, "#FFFFFF");
    it.rim = rimSprite(text, voice, fs);
  } else if (voice === "vaho") {
    it.mask = textSprite(text, voice, fs, "#FFFFFF", null, Math.max(0.8, fs * 0.012));
    it.reveal = clamp(o.word ? o.word.end - o.word.t : 0.4, 0.22, 0.7);
    it.drips = [];
    const nd = o.r() < 0.55 ? 1 : 2;
    for (let i = 0; i < nd; i++) it.drips.push({
      fx: 0.08 + o.r() * 0.84, len: vmin * (0.04 + o.r() * 0.1), wid: Math.max(1.6, fs * 0.045),
      delay: it.reveal + 0.15 + o.r() * 0.9, dur: 1.6 + o.r() * 2,
    });
  } else {
    it.sp = textSprite(text, voice, fs, hexA(P.text, 0.92));
  }
  return it;
}

function layoutPhrase(ph) {
  const r = mulberry32(ph.layoutSeed);
  const items = layoutRows(buildRows(ph), {
    r, fill: ph.fill, align: ph.align, solo: ph.solo,
    rotMax: ph.mode === "grabado" ? 0 : L.rowRotMax * (ph.mode === "vaho" ? 1.2 : 1),

  for (const it of items) { const s = ph.shown[it.k]; if (s != null) it.tIn = s; }

}

/* intro / outro: la misma lámina, con título esmerilado gigante */
function cardRows(which) {
  const cfg = which === "intro" ? C.intro : C.outro;
  const rows = [];
  const top = which === "intro" ? cfg.artist : (cfg.songTitle || cfg.artist);
  const title = cfg.title || (which === "intro" ? "" : "");
  if (top && title) rows.push({ voice: "mono", words: [{ k: 0, text: upper(top) }], fixedFs: vmin * 0.032 });
  if (title || top) rows.push({ voice: "grabado", words: [{ k: 1, text: upper(title || top) }], hero: true });
  if (cfg.sub) rows.push({ voice: "golpe", words: [{ k: 2, text: upper(cfg.sub), accent: "hot" }], fixedFs: vmin * 0.085 });
  if (cfg.feats) rows.push({ voice: "mono", words: [{ k: 3, text: upper(cfg.feats) }], fixedFs: vmin * 0.021 });
  return rows;
}

  const rows = cardRows(which);

  const items = layoutRows(rows, { card: true, r: rngFor(which === "intro" ? 1 : 2) });
  items.forEach((it, j) => { it.tIn = which === "intro" ? -1 : t + 0.4 + j * 0.16; });

/* ================================ GRIETAS ================================
   Telaraña: rayos quebrados que salen del impacto (con ramas) + anillos

  for (let k = 1; k <= rings; k++) {
    const rr = R * Math.pow(k / (rings + 0.6), 1.15);
    for (let i = 0; i < nr; i++) {
      if (r() > 0.85 - k * 0.1) continue;
      const A = pointAt(rays[i], rr * (0.9 + r() * 0.2)), B = pointAt(rays[(i + 1) % nr], rr * (0.9 + r() * 0.2));

}

/* ============================== ESTALLIDO ===============================
   La lámina se parte en celdas radiales desde el punto del golpe (rayos ×

   huecos) y cada celda es un fragmento que lleva su pedazo de la foto

   (no integración) → determinista a cualquier frame rate. */

    for (const p of poly) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); cx += p[0]; cy += p[1]; }
    if (x1 < -10 || x0 > GW + 10 || y1 < -10 || y0 > GH + 10) continue;
    cx /= poly.length; cy /= poly.length;
    const dx = cx - px, dy = cy - py, dist = Math.hypot(dx, dy) || 1, ux = dx / dist, uy = dy / dist, q = Math.min(1, dist / maxD);
    const sh = { rel: poly.map(p => [p[0] - cx, p[1] - cy]), cx, cy,

    if (mode === "derrumbe") {
      sh.delay = 0.02 + q * 0.42 + r() * 0.1;
      sh.vx = ux * (40 + r() * 120) * U; sh.vy = (-40 + r() * 140) * U; sh.g = 3000 * U;
      sh.vz = -(0.05 + r() * 0.2); sh.vr = (r() - 0.5) * 3.2; sh.vf = 1 + r() * 3.5; sh.life = 1.0 + r() * 0.5;
    } else if (mode === "rafaga") {

      sh.delay = clamp(order, 0, 1) * 0.28 + r() * 0.04;
      sh.vx = dir * (1500 + r() * 1500) * U; sh.vy = ((r() - 0.5) * 500 - 150) * U; sh.g = 800 * U;
      sh.vz = r() * 0.5; sh.vr = dir * (1.5 + r() * 6); sh.vf = 3 + r() * 9; sh.life = 0.8 + r() * 0.4;
    } else {
      sh.delay = q * 0.05;
      const sp = (1700 - 1300 * q) * (0.65 + r() * 0.7) * U;
      sh.vx = ux * sp + (r() - 0.5) * 120 * U; sh.vy = uy * sp - r() * 260 * U; sh.g = 1900 * U;
      sh.vz = (2.6 - 1.9 * q) * (0.6 + r() * 0.8); sh.vr = (r() - 0.5) * 9; sh.vf = 3 + r() * 11; sh.life = 0.75 + r() * 0.55;

}

    if (mode === "derrumbe") { vx *= 0.35; vy = -r() * 200 * U; }

  for (const sh of shatter.shards) {

      rot = sh.vr * τ; fx = Math.cos(sh.vf * τ);

    g.closePath();

/* ================================ ESTADO ================================ */
let phrases = [], events = [], ev = 0, timelineReady = false;
let pane = null, fading = [], webs = [], shatter = null;

let impulses = [];
let lastT = 0;

function shatterPoint(tr, t) {
  const r = rngFor(8000 + (typeof tr.to === "number" ? tr.to : 998));
  if (pane && pane.items.length) {
    const shown = pane.items.filter(it => it.tIn <= t).sort((a, b) => a.tIn - b.tIn);
    const golpes = shown.filter(it => it.voice === "golpe");
    const pick = golpes.length ? golpes[golpes.length - 1] : shown.length ? shown[Math.floor(r() * shown.length)] : null;
    if (pick) return { x: pick.cx + (r() - 0.5) * pick.mw * 0.4, y: pick.cy + (r() - 0.5) * pick.fs * 0.3 };
  }
  return { x: OX + vw * (0.35 + r() * 0.3), y: OY + vh * (0.35 + r() * 0.3) };
}

/* golpe final: una telaraña enorme + destello + sacudida, 70ms antes de estallar */
function doBlow(tr, t, silent) {
  const p = shatterPoint(tr, t);
  tr.px = p.x; tr.py = p.y;
  if (silent) return;
  webs.push({ ...genWeb(p.x, p.y, vmin * 0.5, rngFor(9000 + (typeof tr.to === "number" ? tr.to : 997)), { rays: 13, rings: 4, w: Math.max(1.1, vmin / 650) }), born: t, dur: 0.07 });
  impulses.push({ t0: t, amp: L.shakePx * U * 2.2, ph: 1.7 });
  flashT = t;
}
function doShatter(tr, t, silent) {
  if (tr.px == null) { const p = shatterPoint(tr, t); tr.px = p.x; tr.py = p.y; }
  if (!silent) {
    /* foto congelada EXACTA de lo que se estaba viendo (mundo + vidrio) */
    snctx.setTransform(1, 0, 0, 1, 0, 0); snctx.globalCompositeOperation = "source-over"; snctx.globalAlpha = 1;
    snctx.clearRect(0, 0, snapCv.width, snapCv.height);
    snctx.drawImage(worldCv, 0, 0, snapCv.width, snapCv.height); snctx.drawImage(glassCv, 0, 0);
    const r = rngFor(7000 + (typeof tr.to === "number" ? tr.to : 996));
    shatter = { t, shards: buildShards(tr.px, tr.py, tr.mode, r, tr.dir), glitter: buildGlitter(tr.px, tr.py, tr.mode, r, tr.dir) };
    kickT = t;
  } else shatter = null;
  webs = []; clearCracks(); fading = []; fogA = 0; pane = null; sweepT = null;
  switchWorld(t);
}
function doFade(t, silent) {
  if (pane && !silent) for (const it of pane.items) if (it.tIn <= t) { it.tOut = t; fading.push(it); }
  pane = null;
  if (!silent) sweepT = t;
}
function activatePhrase(ph, t) {
  pane = { kind: "phrase", ph, mode: ph.mode, items: layoutPhrase(ph) };
  aimCamera(rngFor(3000 + ph.i));
}
function doTrans(tr, t, silent) {
  if (tr.kind === "shatter") doShatter(tr, t, silent); else doFade(t, silent);
  if (tr.to === "outro") { activateCard("outro", t); aimCamera(rngFor(2999)); }
  else activatePhrase(phrases[tr.to], t);
}
function doWord(ph, k, t, silent) {
  if (!pane || pane.ph !== ph) return;
  ph.shown[k] = t;
  const it = pane.items.find(x => x.k === k);
  if (!it) return;
  it.tIn = t;
  lastOnset = t;
  if (it.voice !== "golpe") return;
  const land = t + 0.12;
  if (ph.crack[k]) {
    const r = rngFor(20000 + ph.i * 50 + k);
    const R = clamp(Math.max(it.mw, it.fs) * (ph.solo ? 0.75 : 0.55), vmin * 0.1, vmin * (ph.solo ? 0.42 : 0.3));

function handle(e, silent) {
  if (e.type === "blow") doBlow(e.tr, e.t, silent);

  else doWord(e.ph, e.k, e.t, silent);

/* salto sin efectos (?seek=, o una pestaña que estuvo congelada) */
function fastForward(T) { while (ev < events.length && events[ev].t <= T) handle(events[ev++], true); }

/* ---- outro: se dispara por el FINAL REAL del audio, no por la letra ---- */
function maybeOutro(t) {
  if (outroShown || !timelineReady) return;
  const dur = audio.duration;
  if (!isFinite(dur) || dur <= 0) return;
  if (audio.ended || (dur - t) <= C.outro.leadSec) {
    outroShown = true;
    doc.body.classList.add("outroActive");
    events.length = ev;   /* no entran más palabras */
    const tr = { t: t + 0.08, to: "outro", kind: "shatter", mode: "estallido", dir: 1 };
    events.push({ t, type: "blow", tr }, { t: t + 0.08, type: "trans", tr });
  }
}

/* ================================ CÁMARA ================================ */
const cam = { x: 0, y: 0, rz: 0, rx: 0, ry: 0, s: 1, tx: 0, ty: 0, trz: 0, trx: 0, try: 0, ts: 1 };

  impulses = impulses.filter(im => t - im.t0 < 0.6);
  const kick = t >= kickT ? 0.06 * Math.exp(-(t - kickT) * 4.5) : 0;   /* golpe de zoom al estallar */
  const dX = Math.sin(t * 0.23) * vw * 0.006, dY = Math.cos(t * 0.17) * vh * 0.006, dRy = Math.sin(t * 0.11) * 1.2;
  camPar = { x: cam.x + dX, y: cam.y + dY };
  rig.style.transform = `translate3d(${(cam.x + sx + dX).toFixed(2)}px, ${(cam.y + sy + dY).toFixed(2)}px, 0) ` +
    `rotateX(${cam.rx.toFixed(3)}deg) rotateY(${(cam.ry + dRy).toFixed(3)}deg) rotateZ(${(cam.rz + srz).toFixed(3)}deg) scale(${(cam.s + kick).toFixed(4)})`;
}

/* ================================ ENERGÍA ================================
   Graves reales (AnalyserNode) si el AudioContext corre; si no, un pulso por
   cada palabra cantada. El mundo respira con esto. */
let analyser = null, fbuf = null, bassPeak = 0.25, E = 0;
async function setupAnalyser() {
  if (analyser || MANUAL) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC();
    await Promise.race([ac.resume(), new Promise(r => __nbSetTimeout(r, 400))]);
    if (ac.state !== "running") { ac.close(); return; }   /* conectar un contexto suspendido silenciaría el audio */
    const src = ac.createMediaElementSource(audio);
    const an = ac.createAnalyser();
    an.fftSize = 1024; an.smoothingTimeConstant = 0.6;
    src.connect(an); an.connect(ac.destination);
    fbuf = new Uint8Array(an.frequencyBinCount); analyser = an;
  } catch (e) { analyser = null; }
}
function updateEnergy(t, dt) {
  let a = 0;
  if (analyser && !audio.paused) {
    analyser.getByteFrequencyData(fbuf);
    let s = 0;
    for (let i = 1; i <= 6; i++) s += fbuf[i];
    const b = s / (6 * 255);
    bassPeak = Math.max(b, bassPeak * 0.996, 0.25);
    a = clamp((b / bassPeak - 0.6) / 0.4, 0, 1);
  }
  const on = Math.exp(-Math.max(0, t - lastOnset) * 7);
  const target = Math.max(a, on * 0.75);
  E += (target - E) * (1 - Math.exp(-dt * 18));
}

/* ================================ VIDRIO ================================ */
function spriteAt(ctx, it, sp, s = 1, ox = 0, oy = 0) {
  ctx.save();
  ctx.translate(it.cx, it.cy);
  if (it.rot) ctx.rotate(it.rot);
  if (s !== 1) ctx.scale(s, s);
  ctx.drawImage(sp.cv, -sp.mw / 2 - sp.pad + ox, it.by - sp.asc - sp.pad + oy, sp.w, sp.h);
  ctx.restore();
}
const outK = (it, t, d = 0.24) => it.tOut == null ? 0 : clamp((t - it.tOut) / d, 0, 1);

function drawFog(g, t, dt) {
  const target = pane && pane.mode === "vaho" ? 1 : 0;
  fogA += (target - fogA) * (1 - Math.exp(-dt * (target > fogA ? 2.4 : 3.5)));
  if (fogA < 0.01) return;
  const f = fgctx;
  f.setTransform(1, 0, 0, 1, 0, 0); f.globalCompositeOperation = "source-over"; f.globalAlpha = 1;
  f.clearRect(0, 0, fogCv.width, fogCv.height);
  f.drawImage(frostCv, 0, 0, fogCv.width, fogCv.height);
  f.drawImage(fogTexCv, 0, 0, fogCv.width, fogCv.height);
  f.setTransform(DPR * FQ, 0, 0, DPR * FQ, 0, 0);
  f.globalCompositeOperation = "destination-out";
  const list = (pane ? pane.items : []).concat(fading).filter(it => it.voice === "vaho");
  for (const it of list) {
    const τ = t - it.tIn;
    if (τ < 0) continue;
    const a = 1 - outK(it, t, 0.6);
    if (a <= 0) continue;
    const sp = it.mask, p = easeInOut(τ / it.reveal);
    const x0 = -sp.mw / 2 - sp.pad, y0 = it.by - sp.asc - sp.pad;
    f.globalAlpha = a;
    f.save(); f.translate(it.cx, it.cy); if (it.rot) f.rotate(it.rot);
    f.save(); f.beginPath(); f.rect(x0, y0, sp.w * p, sp.h); f.clip();   /* el dedo escribe de izquierda a derecha */
    f.drawImage(sp.cv, x0, y0, sp.w, sp.h);
    f.restore();
    f.lineCap = "round"; f.strokeStyle = "#000"; f.fillStyle = "#000";
    for (const d of it.drips) {   /* gotas que chorrean desde la letra */
      const q = (τ - d.delay) / d.dur;
      if (q <= 0) continue;
      const len = d.len * easeOutCubic(Math.min(1, q)), dx = -sp.mw / 2 + d.fx * sp.mw, dy0 = it.by - it.fs * 0.04;
      f.lineWidth = d.wid;
      f.beginPath(); f.moveTo(dx, dy0); f.quadraticCurveTo(dx + d.wid * 0.6, dy0 + len * 0.5, dx, dy0 + len); f.stroke();
      f.beginPath(); f.arc(dx, dy0 + len, d.wid * 0.85, 0, TAU); f.fill();
    }
    f.restore();
  }
  f.globalCompositeOperation = "source-over"; f.globalAlpha = 1;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = fogA;
  g.drawImage(fogCv, 0, 0, glassCv.width, glassCv.height);
  g.restore();
}

function drawGrabado(g, t) {
  const list = (pane ? pane.items : []).concat(fading).filter(it => it.voice === "grabado" && t >= it.tIn);
  if (!list.length) return;
  const m = mkctx;
  m.setTransform(1, 0, 0, 1, 0, 0); m.globalCompositeOperation = "source-over"; m.globalAlpha = 1;
  m.clearRect(0, 0, maskCv.width, maskCv.height);
  m.setTransform(DPR, 0, 0, DPR, 0, 0);
  const alphas = list.map(it => smooth((t - it.tIn) / 0.3) * (1 - outK(it, t)));
  list.forEach((it, i) => { if (alphas[i] > 0) { m.globalAlpha = alphas[i]; spriteAt(m, it, it.mask); } });
  m.globalAlpha = 1;
  m.setTransform(1, 0, 0, 1, 0, 0);
  m.globalCompositeOperation = "source-in";
  m.drawImage(frostCv, 0, 0, maskCv.width, maskCv.height);   /* adentro de la letra: el mundo esmerilado */
  m.globalCompositeOperation = "source-atop";
  m.fillStyle = hexA(P.frost, 0.4); m.fillRect(0, 0, maskCv.width, maskCv.height);
  m.fillStyle = noisePatMask; m.fillRect(0, 0, maskCv.width, maskCv.height);
  m.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const it of list) {   /* barrido de luz sobre la letra recién grabada */
    const τ = t - it.tIn;
    if (τ > 0.75) continue;
    const sp = it.mask, x0 = -sp.mw / 2 - sp.pad, bx = x0 + lerp(-0.3, 1.3, τ / 0.75) * sp.w, bw = it.fs * 0.9;
    m.save(); m.translate(it.cx, it.cy); if (it.rot) m.rotate(it.rot);
    const gr = m.createLinearGradient(bx - bw, 0, bx + bw, 0);
    gr.addColorStop(0, "rgba(255,255,255,0)"); gr.addColorStop(0.5, "rgba(255,255,255,0.8)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    m.fillStyle = gr; m.fillRect(x0, it.by - sp.asc - sp.pad, sp.w, sp.h);
    m.restore();
  }
  m.globalCompositeOperation = "source-over";
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(maskCv, 0, 0); g.restore();
  list.forEach((it, i) => { if (alphas[i] > 0) { g.globalAlpha = alphas[i]; spriteAt(g, it, it.rim); } });
  g.globalAlpha = 1;
}

function drawSolid(g, t) {
  const list = (pane ? pane.items : []).concat(fading);
  for (const it of list) {
    if (it.voice !== "golpe" && it.voice !== "mono") continue;
    const τ = t - it.tIn;
    if (τ < 0) continue;
    const o = outK(it, t);
    if (it.voice === "mono") {
      g.globalAlpha = smooth(τ / 0.4) * (1 - o);
      if (g.globalAlpha > 0) spriteAt(g, it, it.sp);
      continue;
    }
    /* golpe: cae desde 1.9x con separación RGB que se cierra al aterrizar */
    const a = clamp(τ / 0.04, 0, 1) * (1 - o);
    if (a <= 0) continue;
    const s = (1 + 0.9 * (1 - easeOutCubic(τ / 0.14))) * (1 + 0.12 * o);
    if (τ < 0.45) {
      const kk = 1 - τ / 0.45, off = it.fs * 0.075 * kk;
      g.globalCompositeOperation = "lighter"; g.globalAlpha = a * 0.6 * kk;
      spriteAt(g, it, it.gh, s, -off, 0); spriteAt(g, it, it.gc, s, off, 0);
      g.globalCompositeOperation = "source-over";
    }
    g.globalAlpha = a;
    spriteAt(g, it, it.sp, s);
  }
  g.globalAlpha = 1;
}

function drawGlass(t, dt) {
  const g = gctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
  g.clearRect(0, 0, glassCv.width, glassCv.height);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  /* el vidrio en sí: un tinte oscuro + reflejos que se mueven al revés de la cámara */
  g.drawImage(reflCv, -GW * 0.1 - camPar.x * 0.5, -GH * 0.1 - camPar.y * 0.5, GW * 1.2, GH * 1.2);

  fading = fading.filter(it => t - it.tOut < 0.7);
  drawFog(g, t, dt);
  drawGrabado(g, t);
  drawSolid(g, t);

  /* grietas: las ya asentadas (horneadas) + las que están creciendo */
  if (hasCracks) { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(crackCv, 0, 0); g.restore(); }
  for (const w of webs) { const p = (t - w.born) / w.dur; if (p > 0) strokeWeb(g, w, easeOutCubic(p)); }
  const done = webs.filter(w => t - w.born >= w.dur);
  if (done.length) { done.forEach(bakeWeb); webs = webs.filter(w => t - w.born < w.dur); }

  drawShards(g, t);

  if (sweepT != null) {   /* reflejo que barre el vidrio en cada fundido */
    const p = (t - sweepT) / 0.8;
    if (p >= 0 && p <= 1) {
      const ux = Math.cos(0.5), uy = Math.sin(0.5), diag = GW * ux + GH * uy, c = lerp(-0.15, 1.15, p) * diag, hw = diag * 0.07;
      const gr = g.createLinearGradient(ux * (c - hw), uy * (c - hw), ux * (c + hw), uy * (c + hw));
      gr.addColorStop(0, "rgba(255,255,255,0)"); gr.addColorStop(0.5, hexA(P.glass, 0.12)); gr.addColorStop(1, "rgba(255,255,255,0)");
      g.globalCompositeOperation = "lighter"; g.fillStyle = gr; g.fillRect(0, 0, GW, GH); g.globalCompositeOperation = "source-over";
    } else if (p > 1) sweepT = null;
  }
}

/* ================================ RELOJ ================================ */
const hint = $("hint"), flashEl = $("flash"), dbgEl = $("debug");
let playing = false, audioFailed = false, wallT0 = null, manualT = SEEK;
const pageT0 = performance.now();
function startWall() {
  if (audioFailed) return;
  audioFailed = true; wallT0 = performance.now(); playing = true; hint.classList.add("gone");
}
async function begin() {
  if (playing || MANUAL) return;
  try { await audio.play(); playing = true; hint.classList.add("gone"); setupAnalyser(); }
  catch (e) { if (audio.error) startWall(); /* autoplay bloqueado → espera el click */ }
}
audio.addEventListener("error", startWall);
audio.addEventListener("playing", () => { playing = true; hint.classList.add("gone"); });
addEventListener("pointerdown", begin);
const clock = now => MANUAL ? manualT
  : audioFailed ? SEEK + (now - wallT0) / 1000
  : audio.currentTime;

/* ================================ MAIN ================================ */
let fpsN = 0, fpsT0 = performance.now(), fps = 0;
function frame(now) {
  const t = clock(now);
  const dt = clamp(t - lastT, 0, 0.1);
  lastT = t;
  maybeOutro(t);
  if (timelineReady) {
    while (ev < events.length && t >= events[ev].t) { const e = events[ev++]; handle(e, (t - e.t) > 1.0); }
  }
  updateEnergy(t, dt);
  updateCamera(t, dt);
  /* antes de arrancar el audio el mundo igual se mueve (reloj de pared) */
  const wt = (playing || MANUAL) ? t : (now - pageT0) / 1000;
  drawWorld(wt, E);
  const needFrost = fogA > 0.01 || (pane && pane.items.some(it => it.voice === "grabado" || it.voice === "vaho")) ||
                    fading.some(it => it.voice === "grabado" || it.voice === "vaho");
  if (needFrost) updateFrost();
  drawGlass(t, dt);
  flashEl.style.opacity = (S.flash * Math.exp(-Math.max(0, t - flashT) * 8)).toFixed(3);
  if (DEBUG) {
    fpsN++;
    if (now - fpsT0 > 500) { fps = Math.round(fpsN * 1000 / (now - fpsT0)); fpsN = 0; fpsT0 = now; }
    const ph = pane?.ph;
    dbgEl.style.display = "block";
    dbgEl.textContent = `t ${t.toFixed(2)}s · fps ${fps}\nfrase ${ph ? ph.i + 1 : "-"}/${phrases.length} · ${pane ? pane.mode : "—"}\nmundo ${worldIdx + 1}/${WORLDS.length} · energía ${E.toFixed(2)}\neventos ${ev}/${events.length}`;
  }
  if (!MANUAL) requestAnimationFrame(frame);
}

addEventListener("resize", () => {
  sizeAll(); buildStatics(); webs = []; shatter = null; fading = [];
  if (pane) {
    if (pane.kind === "phrase") pane.items = layoutPhrase(pane.ph);
    else { const keep = pane.items.map(it => it.tIn); activateCard(pane.which, 0); pane.items.forEach((it, j) => { it.tIn = keep[j] ?? it.tIn; }); }
  }
});

window.__cristal = {
  setTime(t) { manualT = t; frame(performance.now()); },
  get ready() { return timelineReady; },
  info: () => ({ phrases: phrases.length, events: events.length, ev, world: worldIdx, mode: pane?.mode ?? null }),
  timeline: () => events.filter(e => e.type === "trans").map(e => ({
    t: +e.t.toFixed(2), kind: e.tr.kind, mode: e.tr.kind === "shatter" ? e.tr.mode : null,
    to: e.tr.to, phrase: typeof e.tr.to === "number" ? phrases[e.tr.to].words.map(w => w.text).join(" ") : e.tr.to,
    voice: typeof e.tr.to === "number" ? phrases[e.tr.to].mode : null,
  })),
};

if (SEEK && !MANUAL) audio.addEventListener("loadedmetadata", () => { audio.currentTime = SEEK; }, { once: true });
audio.src = encodeURI(C.audio.src);
if (MANUAL) hint.classList.add("gone");
else begin();
requestAnimationFrame(frame);

(async function init() {
  const [words] = await Promise.all([loadLyrics(), fontsReady()]);
  phrases = buildPhrases(words);
  planPhrases(phrases);
  activateCard("intro", 0);
  events = buildEvents(planTransitions(phrases, !!pane));
  timelineReady = true;
  if (SEEK > 0) fastForward(SEEK);
  if (MANUAL) frame(performance.now());
})();
</script>
</body>
