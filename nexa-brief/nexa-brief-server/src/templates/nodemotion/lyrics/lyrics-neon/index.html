    #outro .outroThanks { font-size: 6.2vw; }
    #outro .outroCta { font-size: 7.6vw; margin-top: 6vmin; }
    #outro .outroSupport { font-size: 4.6vw; margin-top: 8vmin; max-width: 86vw; }
    #outro .outroHandle { font-size: 3.8vw; margin-top: 3.6vmin; }
  }

</style>
</head>
<body>
<img id="bg" alt="">
<video id="bgVideo" muted loop playsinline preload="auto" hidden></video>
<div id="bgTint"></div>
<div id="viewport"><div id="worldTilt"><div id="world"></div></div></div>
<div id="vignette"></div>
<div id="crt"></div>
<div id="grain"></div>
<div id="intro">
  <img id="introMedia" alt="">
  <div class="introGlow"></div><div class="introShade"></div>
  <div class="introStack">
    <div class="eyebrow"></div><div class="tube tubeTop"></div>
    <div class="artist"></div><div class="title"></div>
    <div class="tube tubeBot"></div><div class="sub"></div><div class="feats"></div>
  </div>
</div>
<div id="outro">
  <div class="outroHaze"></div>
  <div class="outroStack">
    <div class="outroThanks"></div><div class="outroChannel"></div>
    <div class="outroCta"></div><div class="outroSupport"></div><div class="outroHandle"></div>
  </div>
</div>
<div id="hint">CLICK PARA EMPEZAR</div>
<audio id="audio" preload="auto"></audio>

<script type="module">
/* ================================ CONFIG ================================ */
/* La letra YA NO vive aquí: se consume 100% de lyricsUrl (formato Whisper:
   { metadata, segments: [ { words: [ { word, start, end }, ... ] }, ... ] } ).
   El CONFIG tampoco: vive en config.json como colección de casos con "id"
   (mismo patrón que 04-video-motion). Cada objeto trae audio, lyricsUrl, bg,
   fonts, neon (paleta), intro/outro, layout y seed. Para otra canción,
   agregá otro objeto al array "configs" — acá no se toca nada.
   Servir por HTTP (python3 -m http.server): por file:// el fetch se bloquea. */
const ACTIVE_ID = null;   /* <-- forzar un id ("hola-remix" | "hola-remix-cian" | ...) · null = usa "activeId" del JSON */

const DEFAULT_CONFIG = {"activeId":"default","configs":[{"id":"default","description":"Neón urbano nocturno — letras tubo que se encienden letra por letra, columnas escalonadas que retroceden en direcciones impredecibles sobre una foto de vida nocturna con CRT/grain/vignette. — metadata para marketing/SEO, la plantilla no la usa todavía.","audio":{"src":"assets/song.mp3"},"lyricsUrl":"assets/lyrics.json","bg":{"src":"assets/bg.png","filter":"grayscale(0.3) sepia(0.4) hue-rotate(-18deg) saturate(1.5) brightness(0.32) contrast(1.18)"},"fonts":{"googleUrl":"https://fonts.googleapis.com/css2?family=Monoton&family=Archivo+Black&display=swap","tube":"\"Monoton\", cursive","block":"\"Archivo Black\", sans-serif"},"neon":{"core":"#FFE9CF","glow":"#FF5A1F","deep":"#E01400"},"intro":{"artist":"","title":"HOLA REMIX","sub":"","feats":"","eyebrow":"nodemotion presenta"},"outro":{"leadSec":8,"songTitle":"HOLA REMIX","thanks":"GRACIAS POR VER","channel":"nodemotion","cta":"SUSCRÍBETE","support":"Tu apoyo hace posible que sigamos trayendo más contenido.","handle":"youtube.com/@nodemotion"},"debug":{"enabled":false},"layout":{"stairVw":3.4,"colGapVw":52,"colGapVh":88,"rowsMin":2,"rowsMax":4,"verticalChance":0.13,"soloChance":0.14,"tubeChance":0.5,"dirWeights":{"left":0.55,"down":0.25,"up":0.2}},"seed":11}]};

async function loadDB() {
  try {
    const r = await fetch("config.json");
    if (r.ok) return await r.json();
  } catch (e) {}
  try {
    const r = await fetch("assets/config.json");
    if (r.ok) return await r.json();
  } catch (e) {}
  console.warn("config.json no disponible (fetch bloqueado o ausente) — usando DEFAULT_CONFIG embebido");
  return DEFAULT_CONFIG;
}

const DB = await loadDB();
const CONFIG = DB.configs.find(c => c.id === ACTIVE_ID)
            || DB.configs.find(c => c.id === DB.activeId)
            || DB.configs[0];

/* tema desde el JSON → variables CSS (los defaults del CSS son idénticos al
   caso actual, así que sin config el diseño no cambia en nada) */
(function applyTheme(C) {
  const root = document.documentElement;
  if (C.fonts?.googleUrl) {
    const link = document.querySelector('link[href^="https://fonts.googleapis.com/css2"]');
    if (link && link.href !== C.fonts.googleUrl) link.href = C.fonts.googleUrl;
  }
  if (C.fonts?.tube)  root.style.setProperty("--fontTube", C.fonts.tube);
  if (C.fonts?.block) root.style.setProperty("--fontBlock", C.fonts.block);
  if (C.neon?.core)   root.style.setProperty("--neonCore", C.neon.core);
})(CONFIG);
/* ======================================================================== */

const doc = document, $ = id => doc.getElementById(id);
const C = CONFIG, world = $("world"), audio = $("audio"), bgImage = $("bg"), bgVideo = $("bgVideo");
let vw = innerWidth, vh = innerHeight;
addEventListener("resize", () => { vw = innerWidth; vh = innerHeight; });

function mulberry32(a) { return function() {
  a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(C.seed);

/* ---- neon ---- */
const N = C.neon;
const tubeGlow = s => `0 0 ${s*0.15}px ${N.core}, 0 0 ${s*0.35}px ${N.glow}, 0 0 ${s*0.9}px ${N.glow}, 0 0 ${s*1.8}px ${N.deep}, 0 0 ${s*3}px ${N.deep}`;
function styleNeon(el, fs, outline) {
  if (outline) {
    el.style.webkitTextStroke = Math.max(1.5, fs * 0.045) + "px " + N.core;
    el.style.filter = `drop-shadow(0 0 ${Math.max(2, fs*0.05)}px ${N.core}) ` +
                      `drop-shadow(0 0 ${fs*0.16}px ${N.glow}) ` +
                      `drop-shadow(0 0 ${fs*0.4}px ${N.deep})`;
  } else {
    el.style.color = N.core;
    el.style.textShadow = tubeGlow(Math.max(12, fs * 0.2));
  }
}

/* ---- intro (gancho) y salida: textos del config; todo el movimiento sale de t ---- */
const intro = $("intro"), outro = $("outro"), introMedia = $("introMedia");
const I = C.intro || {}, O = C.outro || {};
doc.documentElement.style.setProperty("--neonGlow", N.glow);
doc.documentElement.style.setProperty("--neonDeep", N.deep);
const qi = s => intro.querySelector(s), qo = s => outro.querySelector(s);
const smooth = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
const rise = (t, at, sec) => smooth((t - at) / sec);
/* ruido determinista: el mismo t da siempre el mismo parpadeo (render cuadro a cuadro) */
const hsh = (a, b) => { let h = Math.imul((a * 73856093) ^ (b * 19349663), 2654435761) >>> 0; h ^= h >>> 15; h = Math.imul(h, 2246822519) >>> 0; h ^= h >>> 13; return (h >>> 0) / 4294967296; };
/* tubo que se enciende: parpadea ~0,5 s y queda prendido con un zumbido muy leve */
function lit(t, t0, seed, dur = .5) {
  if (t < t0) return 0;
  const d = t - t0;
  if (d < dur) return hsh(seed, Math.floor(d * 30)) < .25 + .7 * (d / dur) ? 1 : .12;
  return hsh(seed, Math.floor(t * 24)) < .012 ? .45 : 1;
}
/* corte de luz al salir: parpadea y se apaga */
function unlit(t, t1, seed, dur = .4) {
  if (t < t1) return 1;
  const d = t - t1;
  return d >= dur ? 0 : (hsh(seed + 977, Math.floor(d * 30)) < 1 - d / dur ? 1 : .08);
}
const spans = (el, lines) => {
  el.textContent = "";
  return lines.flatMap(line => {
    const ln = doc.createElement("span"); ln.className = "ln"; el.appendChild(ln);
    return [...line].map(c => { const s = doc.createElement("span"); s.className = "ch"; s.textContent = c; ln.appendChild(s); return s; });
  });
};
/* el título largo se parte en dos renglones parejos (más grande y legible como miniatura) */
function splitTitle(txt, portrait) {
  const ws = txt.split(/\s+/).filter(Boolean);
  if (ws.length < 2 || txt.length <= (portrait ? 9 : 15)) return [txt];
  let best = [txt], score = 1e9;
  for (let i = 1; i < ws.length; i++) {
    const a = ws.slice(0, i).join(" "), b = ws.slice(i).join(" "), d = Math.abs(a.length - b.length);
    if (d < score) { score = d; best = [a, b]; }
  }
  return best;
}
const setText = (el, v) => { el.textContent = v || ""; el.style.display = v ? "" : "none"; return el; };

/* intro: textos */
const songTitle = String(I.title || O.songTitle || "LETRAS DE NEÓN").toUpperCase();
setText(qi(".eyebrow"), I.eyebrow || "nodemotion presenta");
setText(qi(".artist"), I.artist); setText(qi(".sub"), I.sub); setText(qi(".feats"), I.feats);
const introTitle = qi(".title");
let titleChars = [], tubeW = 0;
/* foto o video propio del gancho (intro.image); si no hay, se enciende el fondo del video */
if (I.image) {
  let m = introMedia;
  if (/\.(mp4|webm|mov|m4v|ogg)(?:[?#].*)?$/i.test(I.image)) {
    m = doc.createElement("video"); m.id = "introMedia"; m.muted = true; m.loop = true; m.playsInline = true;
    introMedia.replaceWith(m); m.src = encodeURI(I.image); m.play().catch(() => {});
  } else m.src = encodeURI(I.image);
  m.style.display = "block";
}
/* salida: textos */
setText(qo(".outroThanks"), O.thanks || "GRACIAS POR VER");
const channelChars = spans(qo(".outroChannel"), [String(O.channel || "nodemotion").toUpperCase()]);
setText(qo(".outroCta"), O.cta || "SUSCRÍBETE");
setText(qo(".outroSupport"), O.support || "Tu apoyo hace posible que sigamos trayendo más contenido.");
setText(qo(".outroHandle"), O.handle || "youtube.com/@nodemotion");

/* tamaños: el título y el canal ocupan el ancho disponible sin cortarse */
function fitCards() {
  const portrait = vw < vh, vm = Math.min(vw, vh) / 100;
  titleChars = spans(introTitle, splitTitle(songTitle, portrait));
  let fs = portrait ? vw * .26 : vh * .26;
  introTitle.style.fontSize = fs + "px";
  const maxW = vw * (portrait ? .88 : .84), maxH = vh * (portrait ? .3 : .44);
  fs *= Math.min(1, maxW / Math.max(1, introTitle.scrollWidth), maxH / Math.max(1, introTitle.scrollHeight));
  introTitle.style.fontSize = fs + "px";
  tubeW = Math.min(introTitle.scrollWidth * .78, vw * .7);
  styleNeon(introTitle, fs, false);
  styleNeon(qi(".eyebrow"), vm * 1.7, false); styleNeon(qi(".artist"), vm * 3.6, false);
  styleNeon(qi(".sub"), vm * 2.2, false); styleNeon(qi(".feats"), vm * 1.6, false);
  const ch = qo(".outroChannel");
  let cs = portrait ? vw * .2 : vm * 17;
  ch.style.fontSize = cs + "px";
  cs *= Math.min(1, vw * (portrait ? .88 : .8) / Math.max(1, ch.scrollWidth));
  ch.style.fontSize = cs + "px";
  styleNeon(ch, cs, false);
  styleNeon(qo(".outroThanks"), vm * 3.6, false);
  for (const el of outro.querySelectorAll(".outroCta, .outroSupport")) { el.style.color = N.core; el.style.textShadow = `0 0 ${vm * .5}px ${N.core}, 0 0 ${vm * 1.4}px ${N.glow}`; }
  qo(".outroHandle").style.color = N.glow; qo(".outroHandle").style.textShadow = `0 0 ${vm * 1.2}px ${N.deep}`;
  const tube = `0 0 ${vm * .5}px ${N.core}, 0 0 ${vm * 1.6}px ${N.glow}, 0 0 ${vm * 3.6}px ${N.deep}`;
  for (const el of intro.querySelectorAll(".tube")) el.style.boxShadow = tube;
}
fitCards();
doc.fonts.ready.then(fitCards);
addEventListener("resize", () => fitCards());

const BASE_FILTER = C.bg?.filter || "grayscale(0.3) sepia(0.4) hue-rotate(-18deg) saturate(1.5) brightness(0.32) contrast(1.18)";
let lastFilter = "", lastTint = "";
let introEnd = Math.max(.8, Number(C.intro?.duration) || 2.8);
let outroShown = false;
function updateCards(t) {
  const dur = audio.duration, lead = Math.max(3, Number(O.leadSec) || 8);
  /* con el audio terminado el reloj vuelve al de pared (t≈0): se fija t al final para no perder la salida */
  if (audio.ended && isFinite(dur)) t = dur;
  outroShown = isFinite(dur) && dur > 0 && (audio.ended || t >= dur - lead);
  doc.body.classList.toggle("outroActive", outroShown);

  /* ---------- intro: tiempos escalados a lo que dura (hasta la primera palabra) ---------- */
  const end = introEnd, k = Math.min(1, Math.max(.45, (end - .45) / 2.5)), offAt = end - .45;
  const show = outroShown ? 0 : 1 - rise(t, end - .12, .12);
  intro.style.opacity = show.toFixed(3);
  /* el fondo se enciende durante el gancho y vuelve solo al tono oscuro de la letra */
  const lift = outroShown ? 0 : 1 - rise(t, offAt, .55);
  const tc = (.55 + titleChars.length * Math.min(.06, .9 / Math.max(1, titleChars.length))) * k + .2;
  const flash = Math.exp(-Math.max(0, t - tc) * 5) * (t >= tc ? 1 : 0);
  const filt = lift > .002 ? `${BASE_FILTER} brightness(${(1 + 2.05 * lift + .6 * flash * lift).toFixed(3)}) saturate(${(1 + .35 * lift).toFixed(3)}) contrast(${(1 + .06 * lift).toFixed(3)})` : BASE_FILTER;
  if (filt !== lastFilter) { bgImage.style.filter = filt; bgVideo.style.filter = filt; lastFilter = filt; }
  const tint = (1 - .75 * lift).toFixed(2);
  if (tint !== lastTint) { $("bgTint").style.opacity = tint; lastTint = tint; }
  const im = $("introMedia"); if (I.image && im) im.style.opacity = lift.toFixed(3);
  if (show > 0) {
    const off = s => unlit(t, offAt, s);
    qi(".eyebrow").style.opacity = (lit(t, .1 * k, 1) * off(1)).toFixed(3);
    const tw = tubeW * rise(t, .25 * k, .5 * k);
    for (const [i, el] of [...intro.querySelectorAll(".tube")].entries()) { el.style.width = tw.toFixed(1) + "px"; el.style.opacity = (lit(t, .25 * k, 5 + i) * off(5 + i)).toFixed(3); }
    qi(".artist").style.opacity = (lit(t, .4 * k, 3) * off(3)).toFixed(3);
    const st = Math.min(.06, .9 / Math.max(1, titleChars.length)) * k;
    titleChars.forEach((el, i) => { el.style.opacity = (lit(t, .55 * k + i * st, 10 + i, .45) * off(10 + i)).toFixed(3); });
    introTitle.style.transform = `scale(${(1.04 - .04 * rise(t, .5 * k, 1.6 * k) + .025 * flash).toFixed(4)})`;
    qi(".sub").style.opacity = (lit(t, tc - .15, 7) * off(7)).toFixed(3);
    qi(".feats").style.opacity = (lit(t, tc, 8) * off(8)).toFixed(3);
    qi(".introGlow").style.opacity = ((.22 + .55 * flash) * rise(t, .5 * k, .5) * off(2)).toFixed(3);
  }

  /* ---------- salida: solo neón sobre negro, mismo encendido que la intro ---------- */
  outro.style.opacity = outroShown ? rise(t, dur - lead, .35).toFixed(3) : "0";
  if (!outroShown) return;
  const ot = Math.max(0, t - (dur - lead)), s = lead / 8, endOff = lead - .6;
  const L = (at, seed, d) => lit(ot, at * s, seed, d) * unlit(ot, endOff, seed);
  qo(".outroHaze").style.opacity = (.32 * rise(ot, .5 * s, .8 * s) * unlit(ot, endOff, 40)).toFixed(3);
  qo(".outroThanks").style.opacity = L(.15, 41).toFixed(3);
  channelChars.forEach((el, i) => { el.style.opacity = L(.5 + i * .06, 50 + i, .45).toFixed(3); });
  qo(".outroCta").style.opacity = L(2.6, 45, .3).toFixed(3);
  qo(".outroSupport").style.opacity = (rise(ot, 3.6 * s, .6 * s) * unlit(ot, endOff, 47)).toFixed(3);
  qo(".outroHandle").style.opacity = (lit(ot, 4.9 * s, 48) * unlit(ot, endOff, 48)).toFixed(3);
}

/* ---- lyrics: 100% desde lyricsUrl (JSON de Whisper) ---- */
async function loadLyrics() {
  try {
    const r = await fetch(C.lyricsUrl);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const out = [];
    for (const seg of j.segments) for (const w of seg.words)
      out.push({ t: w.start, text: w.word.trim() });
    if (!out.length) throw new Error("lyrics.json sin palabras");
    return out;
  } catch (e) {
    console.warn("[neon-letras-V3] No se pudo cargar", C.lyricsUrl,
                 "— sirve el HTML por HTTP (Live Server), no por file://.", e);
    return [];
  }
}

/* ---- mundo: columnas que nacen en direcciones impredecibles ---- */
let baseX = 0, baseY = 0, rowY = 0, rowIdx = 0, rowsThisCol = 0, placed = [];
const nextRowsPerCol = () => C.layout.rowsMin + Math.floor(rng() * (C.layout.rowsMax - C.layout.rowsMin + 1));
rowsThisCol = nextRowsPerCol();

function pickDir() {
  const w = C.layout.dirWeights, r = rng() * (w.left + w.down + w.up);
  if (r < w.left) return "left";
  if (r < w.left + w.down) return "down";
  return "up";
}
function newColumn() {
  const dir = pickDir(), L = C.layout;
  if (dir === "left") {
    baseX -= vw * (L.colGapVw / 100) * (0.85 + rng() * 0.4);
    baseY += (rng() - 0.5) * vh * 0.22;
  } else if (dir === "down") {          /* la cámara baja → las viejas salen ARRIBA */
    baseY += vh * (L.colGapVh / 100) * (0.9 + rng() * 0.35);
    baseX += (rng() - 0.5) * vw * 0.30;
  } else {                              /* la cámara sube → las viejas salen ABAJO */
    baseY -= vh * (L.colGapVh / 100) * (0.9 + rng() * 0.35);
    baseX += (rng() - 0.5) * vw * 0.30;
  }
  rowY = baseY;
  rowIdx = 0;
  rowsThisCol = nextRowsPerCol();
}

function fontSizeFor(text, solo) {
  const len = Math.max(2, text.length);
  /* móvil vertical: la palabra ocupa más ancho de pantalla (desktop no cambia) */
  const wShare = vw < vh ? 0.48 : 0.30;
  let fs = Math.min(vw * wShare / (len * 0.52), solo ? vh * 0.26 : vh * 0.125);
  fs *= 0.88 + rng() * 0.28;
  if (solo) fs *= 1.35;
  return Math.max(vh * 0.05, Math.min(fs, solo ? vh * 0.30 : vh * 0.14));
}

function placeWord(w) {
  const L = C.layout;
  const clean = w.text.replace(/[.,;!?¡¿"']/g, "");
  if (!clean) return null;
  const solo = clean.length >= 6 ? rng() < 0.55 : rng() < L.soloChance;
  const vertical = !solo && rng() < L.verticalChance && clean.length <= 6;
  if (solo && rowIdx > 0) newColumn();

  const el = doc.createElement("div");
  const outline = rng() > L.tubeChance;
  el.className = "w " + (outline ? "line" : "tube") + (vertical ? " vert" : "");
  el.textContent = clean;
  const fs = fontSizeFor(clean, solo);
  el.style.fontSize = fs + "px";
  styleNeon(el, fs, outline);

  const stair = rowIdx * vw * (L.stairVw / 100) + (rng() - 0.5) * vw * 0.015;
  const x = baseX + stair;
  const y = rowY;
  el.style.left = x + "px";
  el.style.top = y + "px";
  world.appendChild(el);
  requestAnimationFrame(() => el.classList.add("on"));

  const width = vertical ? fs * 1.1 : clean.length * fs * (outline ? 0.62 : 0.72);
  const height = vertical ? clean.length * fs * 0.8 : fs;
  rowY += height * 1.12 + vh * 0.02;    /* la grada avanza según la altura real */

  placed.push(el);
  for (let i = 0; i < placed.length - 1; i++) placed[i].classList.add("cold");
  if (placed.length > 26) { const old = placed.shift(); old.remove(); }

  rowIdx++;
  if (solo || rowIdx >= rowsThisCol) newColumn();
  return { x, y, w: width, h: height };
}

/* ---- cámara ---- */
let camX = 0, camY = 0, camTX = 0, camTY = 0;
function aimCamera(r) {
  if (!r) return;
  /* móvil vertical: centrar al medio sin jitter para que nada se corte a los lados */
  const cx = vw < vh ? 0.5 : (0.42 + rng() * 0.1);
  camTX = r.x + r.w / 2 - vw * cx;
  camTY = r.y + r.h / 2 - vh * (0.40 + rng() * 0.12);
}

/* ---- reloj: audio si suena; si no, rAF ---- */
let rafT0 = null, rafNow = 0, started = false;
const clock = () => (!audio.paused && audio.currentTime > 0.05)
  ? audio.currentTime
  : (rafT0 === null ? 0 : (rafNow - rafT0) / 1000);

async function begin() {
  if (started) return;
  started = true;
  $("hint").style.display = "none";
  try { await audio.play(); } catch (e) { /* reloj de pared */ }
}
addEventListener("pointerdown", begin, { once: true });

/* ---- main ---- */
let words = [], ptr = 0;
function frame(now) {
  rafNow = now;
  if (rafT0 === null) rafT0 = now;
  const t = clock();
  updateCards(t);                         /* chequear ANTES de poner más palabras */
  if (!outroShown) {                     /* una vez que cierra, no entran palabras nuevas */
    while (ptr < words.length && t >= words[ptr].t) {
      aimCamera(placeWord(words[ptr]));
      ptr++;
    }
  }
  camX += (camTX - camX) * 0.055;
  camY += (camTY - camY) * 0.055;
  const sway = Math.sin(now * 0.00035) * 1.2;
  $("worldTilt").style.transform = `rotateY(${sway}deg)`;
  world.style.transform = `translate3d(${-camX}px, ${-camY}px, 0)`;
  requestAnimationFrame(frame);
}

const backgroundSrc = C.bg?.src || "";
const backgroundIsVideo = C.bg?.type === "video"
  || /\.(mp4|webm|mov|m4v|ogg)(?:[?#].*)?$/i.test(backgroundSrc);

if (backgroundIsVideo) {
  bgImage.hidden = true;
  bgVideo.hidden = false;
  bgVideo.src = encodeURI(backgroundSrc);
  bgVideo.load();
  bgVideo.play().catch(() => {});
} else {
  bgVideo.pause();
  bgVideo.removeAttribute("src");
  bgVideo.load();
  bgVideo.hidden = true;
  bgImage.hidden = false;
  bgImage.src = encodeURI(backgroundSrc);
}
if (C.bg?.filter) {
  bgImage.style.filter = C.bg.filter;
  bgVideo.style.filter = C.bg.filter;
}
audio.src = encodeURI(C.audio.src);
loadLyrics().then(w => { words = w; if (w.length) introEnd = Math.max(.8, w[0].t); });
begin();
requestAnimationFrame(frame);
</script>
</body>
</html>
