const ACTIVE_ID = null;   /* <-- forzar un id · null = usa "activeId" del JSON */

  "do don't can can't will just like if then than too very let get got gotta wanna gonna yeah oh " +

  blurPass(X.T(blk, "filter", "none", true), tp + 0.02, 0.28, "y");
  const rx = cx0 + bh + gap, rTop = -Hs / 2 + (Hs - Cc.h - Dd.h) / 2;
  const tc0 = Math.max(tp + 0.26, c[0].rt);
  slideIn(X, mkLine(X, G, tc, "caps", fs2, pal.ink, rx, rTop).el, tc0, 0.6 * W);
  if (td) {
    const td0 = Math.max(tc0 + 0.15, d[0].rt);
    slideIn(X, mkLine(X, G, td, "caps", fs2, pal.accent, rx, rTop + Cc.h * 0.95).el, td0, 0.45 * W, 0.28);
    brush(X, G, { kind: "swoosh", cx: rx + Dd.w * 0.5, cy: rTop + Cc.h * 0.95 + Dd.h * 1.02, r: Dd.h * 0.5, len: Dd.w * 1.15, t0: td0 + 0.12, dur: 0.75, force: true });
    brush(X, G, { cx: rx + Math.max(Cc.w, Dd.w) * 0.55, cy: rTop + (Cc.h + Dd.h) / 2, r: Math.max(Cc.w, Dd.h * 2) * 0.62, t0: td0 + 0.8, dur: 1.4 });
  }
};

R.type = (sc, X) => {
  const { W, H, G, pal } = X, ws = sc.words, n = ws.length;
  let k2 = n >= 3 && !isContent(ws[n - 2]) ? 2 : 1;
  if (n === 2) k2 = 1;
  const L2w = ws.slice(n - k2), L1w = ws.slice(0, n - k2);
  const L1lines = join(L1w).length > 24 ? splitTwo(L1w) : [L1w];
  let fs1 = Math.min(...L1lines.map(l => fit(disp(l, "caps"), "caps", sw(X, 0.86), 0.13 * H)));
  const t2 = disp(L2w, "caps");
  let fs2 = Math.min(fs1 * 1.25, fit(t2, "caps", sw(X, 0.62), 0.17 * H));
  const d2 = dims(t2, "caps", fs2);
  const hs = L1lines.map(l => dims(disp(l, "caps"), "caps", fs1));
  const total = hs.reduce((a, d) => a + d.h * 0.95, 0) + d2.h * 0.9;
  let y = -total / 2;
  const rts = ws.map(w => w.rt);
  let wOff = 0, endX = 0, endY = 0;
  L1lines.forEach((l, i) => {
    const ln = mkLine(X, G, disp(l, "caps"), "caps", fs1, pal.ink, -hs[i].w / 2, y);
    flipUp(X, ln.chars, l[0].rt, 0.03, rts.slice(wOff));
    wOff += l.length; endX = hs[i].w / 2; endY = y + hs[i].h / 2;
    y += hs[i].h * 0.95;
  });
  const l2 = mkLine(X, G, t2, "caps", fs2, pal.accent, -d2.w / 2, y - fs2 * 0.06);
  popIn(X, l2.chars, L2w[0].rt, 0.035);
  brush(X, G, { cx: endX * 0.7, cy: endY, r: fs1 * 1.1, t0: L1w[0].rt + 0.2, dur: clamp(L2w[0].rt - L1w[0].rt + 0.3, 0.9, 2) });
  X.T(G, "transform", "scale(1)").to(L1w[0].rt, Math.max(0.5, X.exitT - L1w[0].rt), "scale(1.05)");
};

R.tilt = (sc, X) => {
  const { W, H, G, pal } = X, ws = sc.words;
  const lines = [];
  for (let i = 0; i < ws.length; i++) {
    const w = ws[i], nx = ws[i + 1];
    /* "i got", "to this": dos funcionales juntas; la primera palabra va sola y grande */
    if (i > 0 && !isContent(w) && nx && !isContent(nx) && w.text.length + 1 + nx.text.length <= 8) { lines.push([w, nx]); i++; }
    else lines.push([w]);
  }
  const Wc = sw(X, 0.42);
  const info = lines.map((l, i) => {
    const t = disp(l, "low");
    let fs = fit(t, "low", Wc, 0.21 * H);
    /* la base del bloque ("But") va grande aunque sea funcional */
    if (i > 0 && !l.some(isContent)) fs *= t.length <= 3 ? 0.5 : 0.78;
    return { l, t, fs, ...dims(t, "low", fs) };
  });
  G.style.transform = `rotate(${-12 + (X.r() - 0.5) * 4}deg) skewX(-12deg)`;
  const cam = div(G, "grp");
  const camTr = X.T(cam, "transform", "translateY(0px)");
  let S = 0, tPrev = -1;
  info.forEach((q, i) => {
    S += q.h * 0.8;
    const ln = mkLine(X, cam, q.t, "low", q.fs, pal.ink, -q.w / 2 + (X.r() - 0.5) * q.fs * 0.3, -S);
    ln.el.style.transformOrigin = "50% 100%";
    const t = Math.max(q.l[0].rt, tPrev + 0.12);
    X.T(ln.el, "transform", "scaleY(0)").to(t, 0.16, "scaleY(1.15)", EASE_OUT).to(t + 0.16, 0.08, "scaleY(1)");
    const ty = S > 0.66 * H ? S - 0.36 * H : S / 2;
    camTr.to(Math.max(0, t - 0.05), 0.35, `translateY(${ty}px)`, EASE_IO);
    tPrev = t;
  });
  X.exitDir = "right";
};

R.pop = (sc, X) => {
  const { W, H, G, pal } = X, ws = sc.words;
  const units = [];
  for (let i = 0; i < ws.length; i++) {
    const w = ws[i], nx = ws[i + 1];
    if (!isContent(w) && nx && w.text.length + 1 + nx.text.length <= 9) { units.push([w, nx]); i++; }
    else units.push([w]);
  }
  units.forEach((u, i) => {
    const t = disp(u, "caps"), fs = fit(t, "caps", sw(X, 0.72), 0.42 * H), d = dims(t, "caps", fs);
    const box = div(G, "blk", { left: -d.w / 2 + "px", top: -d.h / 2 + "px", width: d.w + "px", height: d.h + "px" });
    mkLine(X, box, t, "caps", fs, u.some(isContent) && i % 2 === 0 ? pal.accent : pal.ink, 0, 0);
    const rot = (X.r() - 0.5) * 14, t0 = u[0].rt, nxt = units[i + 1];
    const tr = X.T(box, "transform", "translateY(0px) scale(0) rotate(-14deg)").to(t0, 0.18, `translateY(0px) scale(1.12) rotate(${rot}deg)`, EASE_OUT).to(t0 + 0.18, 0.1, `translateY(0px) scale(1) rotate(${rot}deg)`);
    if (nxt) {
      const te = Math.max(t0 + 0.3, nxt[0].rt - 0.13);
      tr.to(te, 0.14, `translateY(${-0.95 * H}px) scale(0.55) rotate(${rot}deg)`, EASE_IN);
      blurPass(X.T(box, "filter", "none", true), te, 0.14, "y", true);
    }
    if (i % 3 === 1) brush(X, G, { cx: 0, cy: 0, r: Math.max(d.w, d.h) * 0.62, t0: t0 + 0.05, dur: 1.1 });
  });
};

R.pinwheel = (sc, X) => {
  const { W, H, G, pal } = X;
  let chunks = chunk(sc.words, 10, 99).flatMap(l => l.length > 2 ? [l.slice(0, 2), l.slice(2)] : [l]);
  /* una funcional suelta ("i", "the") se pega al trozo siguiente */
  for (let i = chunks.length - 2; i >= 0; i--)
    if (chunks[i].length === 1 && !isContent(chunks[i][0])) chunks.splice(i, 2, [...chunks[i], ...chunks[i + 1]]);
  while (chunks.length > 4) {   /* fundir los trozos más cortos */
    let bi = 0, bl = 1e9;
    for (let i = 0; i < chunks.length - 1; i++) { const l = join(chunks[i]).length + join(chunks[i + 1]).length; if (l < bl) { bl = l; bi = i; } }
    chunks.splice(bi, 2, [...chunks[bi], ...chunks[bi + 1]]);
  }
  const fs = Math.min(...chunks.map(c => fit(disp(c, "caps"), "caps", sw(X, 0.6), 0.2 * H)));
  const cam = div(G, "grp");
  const camTr = X.T(cam, "transform", "translate(0px, 0px) scale(1)");
  const items = [];
  /* cada trozo = rotate(Θ) translate(x0, y0): girar Θ es un giro RÍGIDO del
     bloque entero alrededor del origen (nada se encima a mitad de giro) */
  const corners = it => {
    const a = it.A * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    return [[0, 0], [it.w, 0], [it.w, it.h], [0, it.h]].map(([x, y]) => [(it.tx + x) * c - (it.ty + y) * s, (it.tx + x) * s + (it.ty + y) * c]);
  };
  const bbox = () => {
    const ps = items.flatMap(corners);
    const xs = ps.map(p => p[0]), ys = ps.map(p => p[1]);
    return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
  };
  const fitCam = t => {
    const b = bbox(), bw = b.x1 - b.x0, bh = b.y1 - b.y0;
    const s = Math.min(1.35, 0.84 * W / bw, 0.8 * H / bh), cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
    camTr.to(t, 0.36, `translate(${-cx * s}px, ${-cy * s}px) scale(${s})`, EASE_IO);
  };
  let tPrev = 0;
  chunks.forEach((c, k) => {
    const txt = disp(c, "caps"), strong = c.some(isContent);
    const f = strong ? fs : fs * 0.75, d = dims(txt, "caps", f);
    let tr0 = c[0].rt;
    if (k > 0) {
      const tp = Math.max(tPrev + 0.35, c[0].rt - 0.3);
      /* giros alternados −90 / +90: los ángulos quedan en {−90, 0, 90} y nada
         queda nunca al revés */
      const ccw = k % 2 === 1;
      for (const it of items) {
        it.A += ccw ? -90 : 90;
        it.tr.to(tp, 0.32, `rotate(${it.A}deg) translate(${it.tx}px, ${it.ty}px)`, EASE_IO);
      }
      tr0 = Math.max(c[0].rt, tp + 0.3);
    }
    let tx = -d.w / 2, ty = -d.h / 2;
    if (items.length) { const b = bbox(); tx = b.x1 + fs * 0.08; ty = b.y1 - d.h * 0.92; }
    const ln = mkLine(X, cam, txt, "caps", f, k % 2 ? pal.accent : pal.ink, 0, 0);
    ln.el.style.transformOrigin = "0 0";
    const it = { tx, ty, A: 0, w: d.w, h: d.h * 0.92 };
    it.tr = X.T(ln.el, "transform", `rotate(0deg) translate(${tx}px, ${ty}px)`);
    items.push(it);
    flipUp(X, ln.chars, tr0, 0.03);
    fitCam(Math.max(0, k ? tr0 - 0.32 : 0));
    tPrev = tr0;
  });
  brush(X, G, { cx: W * 0.18, cy: H * 0.12, r: Math.min(W, H) * 0.14, t0: tPrev + 0.2, dur: 1.3 });
};

R.bounce = (sc, X) => {
  const { W, H, G, pal } = X;
  const lines = chunk(sc.words, 14, 3);
  const fs = Math.min(...lines.map(l => fit(disp(l, "caps"), "caps", sw(X, 0.8), 0.7 * H / lines.length)));
  const sp = dims("A A", "caps", fs).w - 2 * dims("A", "caps", fs).w;
  const lh = dims("A", "caps", fs).h;
  let y = -lines.length * lh / 2, ci = 0;
  for (const l of lines) {
    const ww = l.map(w => dims(disp([w], "caps"), "caps", fs).w);
    let x = -(ww.reduce((a, b) => a + b, 0) + sp * (l.length - 1)) / 2;
    l.forEach((w, i) => {
      const box = div(G, "blk", { left: x + "px", top: y + "px", width: ww[i] + "px", height: lh + "px", transformOrigin: "50% 100%" });
      mkLine(X, box, disp([w], "caps"), "caps", fs, isContent(w) && ci++ % 2 === 0 ? pal.accent : pal.ink, 0, 0);
      const t = w.rt;
      X.T(box, "transform", `translateY(${-1.1 * H}px) scale(1, 1)`)
        .to(t, 0.22, "translateY(0px) scale(1.12, 0.8)", "cubic-bezier(.5,0,1,.6)")
        .to(t + 0.22, 0.1, `translateY(${-lh * 0.12}px) scale(0.96, 1.06)`, EASE_OUT)
        .to(t + 0.32, 0.1, "translateY(0px) scale(1, 1)", EASE_IN);
      blurPass(X.T(box, "filter", "none", true), t, 0.2, "y");
      x += ww[i] + sp;
    });
    y += lh;
  }
  brush(X, G, { kind: "swoosh", cx: 0, cy: y + lh * 0.05, r: lh * 0.5, len: sw(X, 0.5), t0: sc.words[sc.words.length - 1].rt + 0.3, dur: 0.9 });
};

R.split = (sc, X) => {
  const { W, H, G, pal, pal2, root } = X;
  const [a, b] = splitTwo(sc.words);
  const panel = div(root, "panel", { background: pal2.bg });
  root.insertBefore(panel, X.comp);
  const tb = b[0].rt;
  X.T(panel, "clipPath", "polygon(100% 0%, 100% 0%, 100% 100%, 100% 100%)")
    .to(Math.max(0.05, tb - 0.25), 0.34, "polygon(56% 0%, 100% 0%, 100% 100%, 40% 100%)", EASE_OUT);
  const ta = disp(a, "caps"), tbt = disp(b, "caps");
  const fa = fit(ta, "caps", sw(X, 0.46), 0.2 * H), fb = fit(tbt, "caps", sw(X, 0.44), 0.2 * H);
  const da = dims(ta, "caps", fa), db = dims(tbt, "caps", fb);
  const la = mkLine(X, G, ta, "caps", fa, pal.ink, -0.45 * W, -0.32 * H);
  slideIn(X, la.el, a[0].rt, -0.6 * W);
  const lb = mkLine(X, G, tbt, "caps", fb, pal2.accent, 0.45 * W - db.w, 0.3 * H - db.h);
  slideIn(X, lb.el, tb, 0.6 * W);
  brush(X, G, { kind: "swoosh", cx: 0.45 * W - db.w / 2, cy: 0.3 * H + db.h * 0.1, r: db.h * 0.5, len: db.w * 1.1, t0: tb + 0.2, dur: 0.8 });
  brush(X, G, { cx: -0.45 * W + da.w * 0.9, cy: -0.32 * H + da.h * 0.5, r: da.h * 1.1, t0: a[0].rt + 0.3, dur: 1.2 });
};

/* tarjeta de intro / cierre: 1ª línea grande (acento), 2ª mediana, 3ª chica */
R.card = (sc, X) => {
  const { W, H, G, pal } = X, ws = sc.words;
  const specs = [[0.62, 0.3, pal.accent], [0.5, 0.15, pal.ink], [0.56, 0.065, pal.ink]];
  const items = ws.slice(0, 3).map((w, i) => {
    const t = capsText(w.text), [fw, fh, col] = specs[i];
    const fs = fit(t, "caps", sw(X, fw), fh * H);
    return { word: w, t, fs, col, ...dims(t, "caps", fs) };
  });
  const total = items.reduce((a, q) => a + q.h * 0.95, 0);
  let y = -total / 2;
  items.forEach((q, i) => {
    const ln = mkLine(X, G, q.t, "caps", q.fs, q.col, -q.w / 2, y);
    if (i === 0) popIn(X, ln.chars, q.word.rt, 0.04);
    else slideIn(X, ln.el, q.word.rt, (i % 2 ? -0.7 : 0.7) * W);
    if (i === 0) brush(X, G, { cx: 0, cy: y + q.h / 2, r: Math.max(q.w, q.h * 2) * 0.62, t0: q.word.rt + 0.3, dur: 1.6, force: true });
    y += q.h * 0.95;
  });
  X.T(G, "transform", "scale(1)").to(0.3, Math.max(0.5, X.exitT - 0.3), "scale(1.06)");
};

/* ============================ ESCENAS =================================== */
function buildScene(sc, W, H) {
  const r = mulberry32((C.seed * 7919 + sc.idx * 104729) >>> 0);
  const pal = SCH[sc.scheme] || SCH.red, pal2 = SCH[sc.scheme2] || SCH.yellow;
  const root = doc.createElement("div");
  root.className = "scene";
  root.style.width = W + "px"; root.style.height = H + "px"; root.style.background = pal.bg;
  const comp = div(root, "comp", { left: W / 2 + "px", top: H / 2 + "px" });
  const G = div(comp, "grp");
  const tracks = [];
  const X = {
    root, comp, G, W, H, r, pal, pal2, dur: sc.dur, exitT: sc.dur - C.timing.exitSec,
    T: (el, prop, init, discrete) => { const t = new Track(el, prop, init, discrete); tracks.push(t); return t; }
  };
  try { R[sc.layout](sc, X); }
  catch (e) { console.warn("[stylish] receta falló", sc.layout, e); }
  /* salida: el bloque entero se va con desenfoque */
  const dir = X.exitDir || sc.exit || "down", ex = X.exitT, ed = C.timing.exitSec;
  const outT = { down: `translate(0px, ${1.25 * H}px)`, up: `translate(0px, ${-1.25 * H}px)`, left: `translate(${-1.3 * W}px, 0px)`, right: `translate(${1.3 * W}px, 0px)` }[dir];
  X.T(comp, "transform", "translate(0px, 0px) scale(1)").to(0, Math.max(0.01, ex), "translate(0px, 0px) scale(1.03)")
    .to(ex, ed, `${outT} scale(1.03)`, EASE_IN);
  blurPass(X.T(comp, "filter", "none", true), ex, ed, dir === "down" || dir === "up" ? "y" : "x", true);
  /* entrada del fondo */
  const tt = C.timing.transSec ?? 0.42;
  if (sc.trans === "circle") {
    const px = 30 + r() * 40, py = 30 + r() * 40;
    X.T(root, "clipPath", `circle(0% at ${px}% ${py}%)`).to(0, tt, `circle(150% at ${px}% ${py}%)`, EASE_IO);
    brush(X, root, { cx: W * px / 100, cy: H * py / 100, r: Math.min(W, H) * 0.2, t0: 0, dur: 0.9, force: true });
  } else if (sc.trans === "wipe") {
    X.T(root, "clipPath", "polygon(0% 0%, 0% 0%, -30% 100%, -30% 100%)").to(0, tt, "polygon(0% 0%, 130% 0%, 100% 100%, -30% 100%)", EASE_IO);
  } else if (sc.trans === "push") {
    X.T(root, "transform", `translateX(${W}px)`).to(0, tt, "translateX(0px)", EASE_OUT);
  } else if (sc.idx > 0 && r() < 0.7) {
    /* corte seco con un trazo de pincel que cruza el corte (firma) */
    brush(X, root, { cx: W * (0.3 + r() * 0.4), cy: H * (0.3 + r() * 0.4), r: Math.min(W, H) * 0.14, t0: 0, dur: 0.8, force: true });
  }
  for (const t of tracks) { t.compile(); t.seek(0); }
  return { root, seek: t => { for (const tr of tracks) tr.seek(t); }, dispose: () => {} };
}

/* ---- letra → palabras ---- */
const cleanWord = s => s.trim().replace(/[.,;:!?¡¿"“”()\[\]]/g, "").replace(/[`´]/g, "'");
async function loadLyrics() {
  try {
    const r = await fetch(C.lyricsUrl);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const segs = [];
    for (const seg of j.segments) {
      const ws = [];
      for (const w of seg.words) {
        const text = cleanWord(w.word);
        if (!text) continue;
        const end = w.end ?? w.start + 0.3;
        /* Whisper estira la 1ª palabra tras un silencio: si dura de más, la
           palabra "empieza" poco antes de su final (como la canta el video) */
        const t = end - w.start > C.timing.longWordSec ? end - C.timing.longWordLead : w.start;
        ws.push({ text, t, end });
      }
      if (ws.length) segs.push(ws);
    }
    if (!segs.length) throw new Error("lyrics.json sin palabras");
    return { segs, meta: j.metadata || {} };
  } catch (e) {
    console.warn("[stylish] No se pudo cargar", C.lyricsUrl, "— sirve el HTML por HTTP, no por file://.", e);
    return { segs: [], meta: {} };
  }
}

/* segmentos de Whisper → frases de 3–10 palabras y ≤ maxSec */
function phrases(segs) {
  const P = C.scenes, out = [];
  const dur = ws => ws[ws.length - 1].end - ws[0].t;
  const queue = segs.map(s => s.slice());
  while (queue.length) {
    const ws = queue.shift();
    if (ws.length > P.maxWords || (dur(ws) > P.maxSec && ws.length >= 4)) {
      let bi = Math.floor(ws.length / 2), bg = -1;
      for (let i = Math.ceil(ws.length * 0.3); i <= Math.floor(ws.length * 0.7); i++) {
        const g = ws[i].t - ws[i - 1].end;
        if (g > bg) { bg = g; bi = i; }
      }
      queue.unshift(ws.slice(0, bi), ws.slice(bi));
      continue;
    }
    out.push(ws);
  }
  for (let i = 0; i < out.length - 1; i++) {
    const a = out[i], b = out[i + 1];
    if ((a.length < P.minWords || dur(a) < P.minSec) && a.length + b.length <= P.maxWords &&
        b[b.length - 1].end - a[0].t <= P.maxSec * 1.2 && b[0].t - a[a.length - 1].end < 1.2) {
      out.splice(i, 2, [...a, ...b]); i--;
    }
  }
  return out;
}

function buildTimeline(segs, dur) {
  const r = mulberry32(C.seed * 977 + 3), Tm = C.timing, P = C.scenes;
  const ph = phrases(segs);
  const list = [];
  const mk = (kind, t0, t1, ws, extra = {}) => ({
    kind, t0, t1, words: ws.map((w, i) => ({ text: w.text, rt: Math.max(0, (w.t ?? w.rt) - t0 - (w.t != null ? Tm.leadSec : 0)), first: i === 0 })), ...extra
  });
  const syn = (texts, t0) => texts.filter(Boolean).map((s, i) => ({ text: s, t: t0 + 0.2 + i * 0.55 + Tm.leadSec }));

  /* intro: artista / título si sobra aire antes de la primera palabra */
  const first = Math.max(0, ph[0][0].t - Tm.leadSec);
  let startAt = 0;
  if (first >= 1.4) {
    const texts = [C.intro.artist, C.intro.title].filter(Boolean);
    if (texts.length) { list.push(mk("intro", 0, first, syn([C.intro.title || C.intro.artist, C.intro.title ? C.intro.artist : ""], 0), { layout: "card" })); startAt = first; }
  }
  ph.forEach((ws, i) => {
    let t0 = i === 0 && !list.length ? 0 : Math.max(0, ws[0].t - Tm.leadSec);
    const nx = ph[i + 1];
    let t1 = nx ? Math.max(t0 + 0.5, nx[0].t - Tm.leadSec) : dur;
    const lastEnd = ws[ws.length - 1].end;
    let gapAfter = null;
    if (nx && t1 - lastEnd > Tm.interludeSec) { gapAfter = [lastEnd + Tm.holdSec, t1]; t1 = lastEnd + Tm.holdSec; }
    let outro = null;
    if (!nx && C.outro.enabled && dur - (lastEnd + Tm.holdSec) >= 1.8) { outro = [lastEnd + Tm.holdSec, dur]; t1 = outro[0]; }
    list.push(mk("lyric", t0, t1, ws));
    if (gapAfter) {
      /* interludio instrumental: tramos de ~2.2 s con ecos (título / palabras
         fuertes de la frase), alternando pop y slide para no quedar quieto */
      const heroes = ws.filter(isContent).sort((a, b) => b.text.length - a.text.length).map(w => w.text);
      const pool = [C.intro.title, ...heroes, C.intro.artist].filter(Boolean);
      if (!pool.length) pool.push(ws[ws.length - 1].text);
      const [g0, g1] = gapAfter, k = Math.max(1, Math.round((g1 - g0) / 2.2));
      for (let j = 0; j < k; j++) {
        const a = g0 + (g1 - g0) * j / k, b = g0 + (g1 - g0) * (j + 1) / k;
        const texts = j % 2 && pool.length > 1 ? [pool[j % pool.length], pool[(j + 1) % pool.length]] : [pool[j % pool.length]];
        list.push(mk("interlude", a, b, syn(texts, a), { layout: texts.length > 1 ? "slide" : "pop" }));
      }
    }
    if (outro) list.push(mk("outro", outro[0], outro[1], syn([C.outro.title, C.outro.sub, C.outro.feats], outro[0]), { layout: "card" }));
  });

  /* recetas, colores, transiciones y salidas */
  const recent = [];
  const sig = P.signature || [], order = C.palette.order || [], cyc = (C.palette.cycle || Object.keys(SCH)).filter(k => SCH[k]);
  let li = 0, prevScheme = "";
  list.forEach((sc, i) => {
    sc.idx = i; sc.dur = sc.t1 - sc.t0; sc.last = i === list.length - 1;
    const replica = li < sig.length;
    if (sc.kind === "lyric") {
      let lay = replica ? sig[li] : null;
      if (!lay || !FITS[lay] || !FITS[lay](sc) || !(C.layouts[lay]?.weight > 0 || replica)) {
        const cands = Object.entries(C.layouts).filter(([k, v]) => v.weight > 0 && FITS[k] && FITS[k](sc) && !recent.includes(k));
        const pool = cands.length ? cands : [["pop", { weight: 1 }]];
        let x = r() * pool.reduce((a, [, v]) => a + v.weight, 0);
        lay = pool[0][0];
        for (const [k, v] of pool) { x -= v.weight; if (x <= 0) { lay = k; break; } }
      }
      sc.layout = lay; li++;
      recent.push(lay); if (recent.length > P.cooldown) recent.shift();
    }
    if (i < order.length && SCH[order[i]]) sc.scheme = order[i];
    else { const opts = cyc.filter(k => k !== prevScheme); sc.scheme = opts[Math.floor(r() * opts.length)] || "red"; }
    const o2 = cyc.filter(k => k !== sc.scheme);
    sc.scheme2 = o2[Math.floor(r() * o2.length)] || "yellow";
    prevScheme = sc.scheme;
    if (i === 0 || i < sig.length) sc.trans = C.transitions.signature;
    else {
      const w = Object.entries(C.transitions.weights).filter(([, v]) => v > 0);
      let x = r() * w.reduce((a, [, v]) => a + v, 0);
      sc.trans = w[0][0];
      for (const [k, v] of w) { x -= v; if (x <= 0) { sc.trans = k; break; } }
    }
    sc.exit = i < sig.length ? "down" : ["down", "down", "left", "right", "up"][Math.floor(r() * 5)];
  });
  return list;
}

/* ============================ RELOJ + LOOP ============================== */
let rafT0 = null, rafNow = 0, started = false, forced = FROZEN;
const clock = () => forced != null ? forced
  : (!audio.paused && audio.currentTime > 0.05) ? audio.currentTime
  : (rafT0 === null ? 0 : (rafNow - rafT0) / 1000);

async function begin() {
  if (started || FROZEN != null) return;
  started = true;
  $("hint").style.display = "none";
  try { await audio.play(); } catch (e) { /* reloj de pared */ }
}
addEventListener("pointerdown", begin, { once: true });

let scenes = [], curIdx = -1, cur = null, nextBuilt = null;
function sceneAt(t) {
  let lo = 0, hi = scenes.length - 1, ans = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (scenes[m].t0 <= t) { ans = m; lo = m + 1; } else hi = m - 1; }
  return ans;
}
function mount(i) {
  if (cur) { cur.dispose(); cur.root.remove(); }
  cur = (nextBuilt && nextBuilt.i === i) ? nextBuilt.b : buildScene(scenes[i], vw, vh);
  nextBuilt = null;
  /* bajo la escena nueva queda el color de la anterior (transiciones círculo/barrido/empuje) */
  stage.style.background = i > 0 ? (SCH[scenes[i - 1].scheme] || SCH.red).bg : "transparent";
  stage.appendChild(cur.root);
  curIdx = i;
  if (i + 1 < scenes.length) {
    const j = i + 1;
    __nbSetTimeout(() => { if (curIdx === i && !nextBuilt) nextBuilt = { i: j, b: buildScene(scenes[j], vw, vh) }; }, 0);
  }
}
function render(t) {
  const i = sceneAt(t);
  if (i >= 0 && scenes[i].t1 > t) {
    if (i !== curIdx) mount(i);
    cur.seek(t - scenes[i].t0);
  } else if (cur && (i < 0 || t >= scenes[i].t1)) {
    cur.seek(scenes[curIdx].dur);
  }
  if (DEBUG && i >= 0) {
    const s = scenes[i];
    hud.textContent = `t ${t.toFixed(2)} · #${i} ${s.kind} · ${s.layout} · ${s.scheme} · ${s.trans} · "${s.words.map(w => w.text).join(" ")}"`;
  }
}
function frame(now) {
  rafNow = now;
  if (rafT0 === null) rafT0 = now;
  render(clock());
  if (FROZEN == null) requestAnimationFrame(frame);
}

/* ---- arranque ---- */
if (DEBUG) hud.style.display = "block";
if (QS.get("headless") === "1") doc.body.classList.add("headless");
audio.src = encodeURI(C.audio.src);
const fontsReady = Promise.race([
  Promise.all([doc.fonts.load("100px 'Lilita One'"), doc.fonts.load("800 100px Sniglet")]).then(() => doc.fonts.ready),
  new Promise(res => __nbSetTimeout(res, 3000))
]);
const durReady = new Promise(res => {
  if (isFinite(audio.duration) && audio.duration > 0) return res(audio.duration);
  audio.addEventListener("loadedmetadata", () => res(audio.duration), { once: true });
  __nbSetTimeout(() => res(NaN), 2500);
});
if (FROZEN == null) begin();
const [{ segs, meta }, audioDur] = await Promise.all([loadLyrics(), durReady, fontsReady]);
if (segs.length) {
  const last = segs[segs.length - 1];
  const dur = isFinite(audioDur) && audioDur > 0 ? audioDur : (meta.audio_duration_sec || last[last.length - 1].end + 3);
  measCache.clear();
  scenes = buildTimeline(segs, dur);
}
addEventListener("resize", () => {
  vw = innerWidth; vh = innerHeight; measCache.clear();
  nextBuilt = null; if (cur) { cur.dispose(); cur.root.remove(); cur = null; curIdx = -1; }
});
window.__stylish = {
  scenes: () => scenes,
  seek(t) { forced = t; render(t); },
  release() { forced = null; }
};
requestAnimationFrame(frame);
</script>
</body>
</html>
