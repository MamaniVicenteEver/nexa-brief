<title>MIRADA CELESTE — Letras en sepia (video real)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=League+Gothic&family=Alfa+Slab+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* tema — config.json (fonts/palette) puede pisar cualquiera de estas variables */
  :root {
    --fontRound: "Fredoka", sans-serif;
    --fontColumn: "League Gothic", sans-serif;
    --fontSlab: "Alfa Slab One", serif;
    --night: #0A0807; --tan: #B39A7C; --tanLight: #D3BC9D; --tanDeep: #88705A;

  }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--night); cursor: pointer; }

  #bgMedia {
    position: fixed; inset: -6%; width: 112%; height: 112%; object-fit: cover; z-index: 0;
    opacity: 0; transition: opacity 2.4s ease; pointer-events: none;
    animation: mediaDrift 40s ease-in-out infinite alternate;
  }
  @keyframes mediaDrift { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-2.5%, 1.5%) scale(1.07); } }

  #camera { position: fixed; inset: 0; z-index: 2; overflow: hidden; will-change: transform; transition: opacity 1.8s ease; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .wash { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
  .wash.tan {
    background:
      radial-gradient(ellipse 75% 65% at 50% 48%, rgba(214, 192, 160, 0.35), transparent 70%),
      linear-gradient(180deg, #7C654E 0%, #A58C70 34%, #B9A083 60%, #9A8266 100%);

  .wash.umber {

  }
  .scene.light .wash { opacity: 1; }

  /* bloque de texto genérico: centrado en (left, top) */

  .block .ln { display: block; }
  .w { display: inline-block; opacity: 0; will-change: transform, opacity; }

  /* ---- escena 1 · MIRADA: ojos en la penumbra + mano que se estira ---- */

  .mirada .eyesWrap { position: absolute; left: 50%; top: 1vh; width: min(68vw, 120vh); transform-origin: 50% 42%; }
  .mirada .eyesPhase { transition: opacity 0.9s ease; }
  .mirada.light .eyesPhase { opacity: 0; }
  .mirada .eyesWrap svg { width: 100%; height: auto; display: block; }
  .mirada .handWrap { position: absolute; left: -2vw; bottom: -17vh; height: 66vh; transform-origin: 50% 100%; }
  .mirada .handWrap svg { height: 100%; width: auto; display: block; overflow: visible; }
  .hand .hf { fill: #A88C6B; transition: fill-opacity 0.8s ease, fill 0.8s ease; }
  .hand .hn { fill: #C9B393; transition: fill-opacity 0.8s ease; }
  .hand .hs { fill: none; stroke: #4A3829; stroke-opacity: 0.38; stroke-linecap: round; transition: stroke-opacity 0.8s ease; }
  .hand .hh { fill: none; stroke: #DCC8AA; stroke-opacity: 0.45; stroke-linecap: round; transition: stroke-opacity 0.8s ease; }

  .mirada.light .hand .hf, .mirada.light .hand .hn { fill-opacity: 0.1; }

  .noche .cloud svg { width: 100%; height: auto; display: block; }

  .noche .block { color: var(--tan); }
  .noche .block.slab .w {

  }

    position: absolute; left: 0; top: 0; bottom: 0; clip-path: inset(0 100% 0 0);

      radial-gradient(ellipse 90% 70% at 40% 45%, rgba(214, 192, 160, 0.3), transparent 70%),

  }

    position: absolute; left: 0; top: 0; line-height: 1; white-space: nowrap; transform-origin: 0 0;

  }
  .palomas .sw.onPanel { color: var(--night); }

function burstPoints(n, rOut, rIn, jitter, seedFn) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const a = i / (n * 2) * Math.PI * 2 - Math.PI / 2;
    const r = i % 2 === 0 ? rOut * (1 - jitter * seedFn()) : rIn * (0.85 + 0.3 * seedFn());
    pts.push(`${(Math.cos(a) * r).toFixed(1)},${(Math.sin(a) * r).toFixed(1)}`);
  }
  return pts.join(" ");
}

function makeFeathers(parent, count, sizeK = 1) {
  const list = [];
  for (let i = 0; i < count; i++) {
    const e = h("div", "feather", parent, featherSVG(parent.dataset.fid + "_" + i));
    const depth = rng();
    list.push({
      e, depth,
      size: lerp(0.08, 0.2, depth) * sizeK,
      x: rng(), speed: lerp(0.05, 0.1, depth), off: rng(),
      sway: lerp(0.025, 0.07, depth), w: rr(0.35, 0.7), ph: rr(0, 6.28), rot: rr(-30, 30),
      op: lerp(0.5, 0.95, depth)
    });
    e.style.opacity = list.at(-1).op;
    if (depth < 0.3) e.style.filter = "blur(1px)";
  }
  return function tick(t) {
    const base = Math.min(vw, vh);
    for (const f of list) {
      const w = base * f.size * 0.25;
      f.e.style.width = w + "px";
      const range = vh * 1.3;
      const y = ((t * f.speed * vh * M + f.off * range) % range) - vh * 0.18;
      const s = Math.sin(t * f.w * M + f.ph);
      const x = f.x * vw + s * f.sway * vw;
      const r = f.rot + 28 * Math.cos(t * f.w * M + f.ph);
      f.e.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) rotate(${r.toFixed(1)}deg)`;
    }
  };
}

/* ============================== ESCENAS ==============================
   Cada escena: { el, video, exitStyle, chunk:{...}, onChunk, onWord,
   onRest, tick }. `chunk` define cómo se agrupan las palabras en
   "bloques" (lo que se ve junto en pantalla). */
const CHUNK = {
  mirada:   { maxWords: 3, maxChars: 16, targetSec: 0.95 },
  columnas: { maxWords: 2, maxChars: 11, targetSec: 0.8 },
  angel:    { maxWords: 2, maxChars: 12, targetSec: 0.9 },
  noche:    { maxWords: 7, maxChars: 40, line: true },
  palomas:  { maxWords: 3, maxChars: 18, line: true },
  ojo:      { maxWords: 2, maxChars: 14, targetSec: 1.1 },
  recorte:  { maxWords: 2, maxChars: 12, targetSec: 1.0 }
};

function makeMirada(t0) {
  const el = h("div", "scene mirada");
  h("div", "wash tan", el);
  const handWrap = h("div", "handWrap", el);
  vid(MEDIA.hand, "handVid", handWrap, HAND_EYE_MOTION_SCALE);
  const eyesWrap = h("div", "eyesWrap", el);
  const eyesPhase = h("div", "eyesPhase", eyesWrap);
  vid(MEDIA.eyes, "eyesVid", eyesPhase, HAND_EYE_MOTION_SCALE);
  const stage = h("div", "", el);
  anim(eyesWrap, [{ opacity: 0 }, { opacity: 1 }], t0 < 1 ? 3200 : 1600, EASE.soft);
  let light = false, first = true, block = null;
  let eyeScale = 1, eyeTarget = 1, reach = 0;
  const S = {
    el, video: 0.3,
    onChunk(ch, t) {
      if (ch.lineStart && !first) {
        if (rng() < L.invertChance) { light = !light; el.classList.toggle("light", light); }
        eyeTarget = eyeTarget > 1.06 ? 1 : 1.16;
      }
      first = false;
      if (block) retire(block.wrap, [{ opacity: 1, transform: "translate(-50%,-50%)" }, { opacity: 0, offset: 0.55 }, { opacity: 0, transform: "translate(-50%,-80%)" }], 620);
      const cy = vh * (portrait() ? 0.5 : 0.6);
      block = buildBlock(ch, stage, FONT.round, {
        cls: light ? "onLight" : "", boxW: vw * 0.8, boxH: vh * 0.4, maxSize: vh * (portrait() ? 0.14 : 0.24), lineH: 1.02, cy
      });
      anim(block.inner, [{ transform: "scale(1)" }, { transform: "scale(1.07)" }], displayDur(ch) * 1000 + 1500, EASE.soft);
    },
    onWord(w) { revealSoft(w.el, block?.size || 80); reach = 1; },
    onRest() {
      if (!block) return;
      retire(block.wrap, [{ opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)" }], 1400);
      block = null;
    },
    tick(t, dt) {
      const k = t - t0;
      const motionT = t * HAND_EYE_MOTION_SCALE;
      eyeScale = approach(eyeScale, eyeTarget, dt, 0.4);
      eyesWrap.style.transform = `translateX(-50%) translateY(${(Math.sin(motionT * 0.3) * 0.6).toFixed(2)}vh) scale(${(eyeScale + 0.015 * Math.sin(motionT * 0.45)).toFixed(4)})`;
      reach = approach(reach, 0, dt, 0.7);
      const rise = 1 - easeOut(k / 6.8);
      const hy = rise * vh * 0.62 - reach * vh * 0.03 * M + Math.sin(motionT * 0.7) * vh * 0.012 * M;
      const hr = 4 + 2.5 * Math.sin(motionT * 0.5) * M + reach * 2;
      handWrap.style.transform = `translateY(${hy.toFixed(1)}px) rotate(${hr.toFixed(2)}deg)`;
    }
  };
  return S;
}

function makeColumnas() {
  const el = h("div", "scene columnas");
  h("div", "wash tan", el);
  const starLayer = h("div", "", el), colLayer = h("div", "", el);
  const cm = capMetrics(FONT.column), shiftEm = -(cm.asc - cm.desc - cm.cap) / 2;
  let light = true, cur = null, dir = 1;
  function retireCur() {
    if (!cur) return;
    const wrap = cur.block.wrap;
    anim(cur.block.inner, [{ opacity: 1, transform: "translateX(0)" }, { opacity: 0, transform: `translateX(${-cur.dir * 7}vw)` }], 520, EASE.inOut)
      .onfinish = () => wrap.remove();
    if (cur.star) retire(cur.star, [{ opacity: 1 }, { opacity: 0 }], 600);
    cur = null;
  }
  return {
    el, video: 0,
    onChunk(ch) {
      light = !light;
      el.classList.toggle("light", light);
      retireCur();
      dir = -dir;
      const disp = displayDur(ch);
      const texts = ch.words.map(w => fmt(w.text, FONT.column));
      const gapEm = 0.14, ws = texts.map(s => emWidth(s, FONT.column));
      const allowed = vw * 0.92 + Math.min(vw * 0.9, vw * 0.3 * disp);
      const singleW = ws.reduce((a, b) => a + b, 0) + gapEm * (ws.length - 1);
      const size1 = Math.min(vh * 1.04 / cm.cap, allowed / singleW);
      const n = texts.length, lineH = cm.cap * 1.1;
      const size2 = n > 1 ? Math.min(vh * 1.02 / (n * lineH), allowed / Math.max(...ws)) : 0;
      const stack = size2 > size1 * 1.15;
      const size = stack ? size2 : size1;
      const textW = (stack ? Math.max(...ws) : singleW) * size;
      const showStar = !stack && rng() < L.starChance && textW < vw * 0.56;
      const starLeft = rng() < 0.5;
      let cx = vw / 2;

function makePalomas(t0) {
  const el = h("div", "scene palomas");
  const panel = h("div", "panel", el);
  const doveLayer = h("div", "layer", el), wordLayer = h("div", "layer", el), featherLayer = h("div", "layer", el);
  featherLayer.dataset.fid = "pf" + Math.floor(rng() * 1e6);
  const featherTick = makeFeathers(featherLayer, L.featherCount);
  el.insertBefore(doveLayer, panel);
  vid(MEDIA.doves, "doveVid", doveLayer);
  const doves = [];
  for (let i = 0; i < 0; i++) {
    const e = h("div", "dove", doveLayer, doveSVG("d" + i + "_" + Math.floor(rng() * 1e6)));
    doves.push({ e, wn: e.querySelector(".wn"), wf: e.querySelector(".wf"), period: rr(9, 13), off: i / L.doveCount + rr(-0.08, 0.08),
      y0: rr(0.12, 0.5), rise: rr(-0.22, -0.06), scale: rr(0.7, 1.25), freq: rr(1.3, 1.8), ph: rr(0, 6) });
  }
  let stair = null, panelOn = false;
  const panelW = () => (portrait() ? 0.66 : 0.5) * vw;
  function clearStair() {
    if (!stair) return;
    for (const s of stair.spans) retire(s.e, [
      { opacity: 1, transform: "translate(0,0)", filter: "blur(0px)" },
      { opacity: 0, offset: 0.5 },
      { opacity: 0, transform: "translate(-5vw,-3vh)", filter: "blur(8px)" }
    ], 520);
    if (panelOn) anim(panel, [{ clipPath: "inset(0 0% 0 0)" }, { clipPath: "inset(0 100% 0 0)" }], 800, EASE.inOut);
    panelOn = false;
    stair = null;
  }
  function toPanel() {
    panelOn = true;
    panel.style.width = panelW() + "px";
    anim(panel, [{ clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)" }], 950, EASE.inOut);
    const n = stair.spans.length, m = vw * 0.055;
    const maxEm = Math.max(...stair.spans.map(s => s.em));
    const S2 = Math.min(stair.size, (panelW() - 2 * m) / maxEm, vh * 0.7 / (n * 1.08));
    const top0 = vh / 2 - n * S2 * 1.08 / 2;
    stair.spans.forEach((s, i) => {
      const x2 = m, y2 = top0 + i * S2 * 1.08;
      const dx = s.x - x2, dy = s.y - y2, k = s.size / S2;
      s.e.style.left = x2 + "px"; s.e.style.top = y2 + "px"; s.e.style.fontSize = S2 + "px";
      s.x = x2; s.y = y2; s.size = S2;
      s.e.classList.add("onPanel");
      anim(s.e, [{ transform: `translate(${dx}px, ${dy}px) scale(${k})` }, { transform: "translate(0,0) scale(1)" }], 1100, EASE.inOut, i * 70);
    });
  }
  return {
    el, video: 0.12,
    onChunk(ch) {
      clearStair();
      const f = FONT.round, texts = ch.words.map(w => fmt(w.text, f)), ems = texts.map(s => emWidth(s, f));
      const gapEm = 0.55, n = texts.length;
      let size = Math.min(vh * 0.11, vw * 0.085);
      const totalEm = ems.reduce((a, b) => a + b, 0) + gapEm * (n - 1);
      size = Math.min(size, vw * 0.84 / totalEm);
      const dy = size * 1.2, x0 = vw * 0.06, y0 = vh * 0.47 - (n - 1) * dy / 2 - size / 2;
      let x = x0;
      const spans = texts.map((txt, i) => {
        const e = h("div", "sw", wordLayer);
        e.textContent = txt;
        e.style.fontWeight = f.w;
        e.style.fontSize = size + "px";
        const s = { e, x, y: y0 + i * dy, size, em: ems[i] };
        e.style.left = s.x + "px"; e.style.top = s.y + "px"; e.style.opacity = 0;
        ch.words[i].el = e;
        x += (ems[i] + gapEm) * size;
        return s;
      });
      stair = { ch, spans, size };
    },
    onWord(w) {
      w.el.style.opacity = "";
      anim(w.el, [
        { opacity: 0, transform: "translateX(-3vw)", filter: "blur(8px)" },
        { opacity: 1, transform: "translateX(0)", filter: "blur(0px)" }
      ], 900, EASE.out);
    },
    onRest() {},
    tick(t) {
      const k = t - t0;
      if (stair && !panelOn && t >= stair.ch.lastT + 0.6 && t < stair.ch.next - 0.25 && stair.spans.length > 1) toPanel();
      featherTick(k);
      const base = Math.min(vw * 0.2, vh * 0.34);
      for (const d of doves) {
        const p = ((k / d.period + d.off) % 1 + 1) % 1;
        const w = base * d.scale;
        const x = lerp(vw * 1.08, -w * 1.3, p);
        const y = (d.y0 + d.rise * p) * vh + Math.sin(p * Math.PI * 2 + d.ph) * vh * 0.025;
        d.e.style.width = w + "px";
        d.e.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) rotate(${(-4 + 5 * Math.sin(k * 0.8 + d.ph)).toFixed(2)}deg)`;
        const glide = 0.55 + 0.45 * Math.sin(k * 0.55 + d.ph);
        const ph = k * Math.PI * 2 * d.freq * M + d.ph;
        const sy = lerp(0.9, Math.cos(ph) * 0.78 + 0.22, glide);
        const sf = lerp(0.9, Math.cos(ph - 0.35) * 0.74 + 0.2, glide);
        d.wn.setAttribute("transform", `rotate(${(-30 + 9 * Math.sin(ph)).toFixed(2)}) scale(1,${sy.toFixed(3)})`);
        d.wf.setAttribute("transform", `rotate(${(-40 + 9 * Math.sin(ph - 0.35)).toFixed(2)}) scale(1,${sf.toFixed(3)})`);
      }
    }
  };
}

const cleanWord = s => s.trim().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "");
let durationHint = 0;
async function loadLyrics() {
  try {
    const r = await fetch(C.lyricsUrl);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const d = Number(j.metadata?.audio_duration_sec);
    if (d > 0) durationHint = d;
    const segs = [];
    for (const seg of j.segments || []) {
      const ws = (seg.words || []).map(w => ({ t: w.start, end: w.end, text: cleanWord(w.word) })).filter(w => w.text);
      if (!ws.length) continue;
      segs.push({ start: ws[0].t, end: Math.max(seg.end ?? 0, ws.at(-1).end), words: ws });
    }
    if (!segs.length) throw new Error("lyrics.json sin palabras");
    return segs;
  } catch (e) {
    console.warn("[mirada-celeste] No se pudo cargar", C.lyricsUrl, "— sirve el HTML por HTTP, no por file://.", e);
    return [];
  }
}

/* reparte los escenarios por peso sobre la duración real; cada corte cae
   en el inicio de la línea de letra más cercana al punto ideal */
function buildPlan(segs, tEnd) {
  const defs = C.scenes.filter(d => SCENES[d.id]);
  const usable = segs.filter(s => s.start < tEnd);
  const n = Math.min(defs.length, usable.length);
  if (!n) return [];
  const tStart = usable[0].start;
  const span = Math.max(1, Math.min(tEnd, usable.at(-1).end + 2) - tStart);
  const weights = defs.slice(0, n).map(d => Math.max(0.1, Number(d.weight) || 1));
  const total = weights.reduce((a, b) => a + b, 0);
  const bounds = [0];
  let cum = 0;
  for (let i = 1; i < n; i++) {
    cum += weights[i - 1];
    const target = tStart + cum / total * span;
    const lo = bounds[i - 1] + 1, hi = usable.length - (n - i);
    let best = lo;
    for (let j = lo; j <= hi; j++) if (Math.abs(usable[j].start - target) < Math.abs(usable[best].start - target)) best = j;
    bounds.push(best);
  }
  const plan = defs.slice(0, n).map((d, i) => ({ id: d.id, seg0: bounds[i], seg1: i + 1 < n ? bounds[i + 1] : usable.length, switchAt: 0 }));
  for (let i = 1; i < n; i++) {
    const s = usable[plan[i].seg0].start, pe = usable[plan[i].seg0 - 1].end;
    plan[i].switchAt = clamp(s - 1.4, pe + 0.1, s - 0.02);
  }
  const words = [];
  plan.forEach((p, pi) => {
    const o = CHUNK[p.id], chunks = [];
    for (let si = p.seg0; si < p.seg1; si++) {
      const ws = usable[si].words.filter(w => w.t < tEnd);
      if (!ws.length) continue;
      let groups = [];
      if (o.line) {
        const chars = ws.reduce((a, w) => a + w.text.length + 1, 0);
        const k = Math.max(Math.ceil(ws.length / o.maxWords), Math.ceil(chars / o.maxChars));
        const per = Math.ceil(ws.length / k);
        for (let i = 0; i < ws.length; i += per) groups.push(ws.slice(i, i + per));
      } else {
        let g = null, chars = 0;
        for (const w of ws) {
          if (!g || g.length >= o.maxWords || chars + w.text.length > o.maxChars || w.t - g[0].t >= o.targetSec) { g = []; groups.push(g); chars = 0; }
          g.push(w);
          chars += w.text.length + 1;
        }
      }
      groups.forEach((g, gi) => chunks.push({ words: g.map(w => ({ ...w })), t0: g[0].t, lastT: g.at(-1).t, t1: g.at(-1).end, lineStart: gi === 0, pi }));
    }
    const endT = pi + 1 < plan.length ? plan[pi + 1].switchAt : tEnd;
    chunks.forEach((ch, k) => {
      ch.next = k + 1 < chunks.length ? chunks[k + 1].t0 : endT;
      ch.words.forEach((w, i) => { w.chunk = ch; w.i = i; words.push(w); });
    });
    p.chunks = chunks;
  });
  return { plan, words };
}

/* ------------------------------ fondo (video/imagen) ------------------------------ */
const media = (() => {
  const src = C.bg?.src;
  if (!src) return null;
  const isVideo = /\.(mp4|webm|mov|m4v)(\?|$)/i.test(src);
  const m = doc.createElement(isVideo ? "video" : "img");
  m.id = "bgMedia";
  if (isVideo) { m.muted = true; m.loop = true; m.playsInline = true; m.autoplay = true; m.preload = "auto"; }
  if (C.bg.filter) m.style.filter = C.bg.filter;
  m.onerror = () => m.remove();
  m.src = encodeURI(src);
  doc.body.insertBefore(m, camera);
  if (isVideo) m.play().catch(() => {});
  return m;
})();
const setMedia = o => { if (media) media.style.opacity = String(o * (C.bg?.opacity ?? 1)); };

/* ------------------------------ motor ------------------------------ */
let plan = [], words = [], ptr = 0, sIdx = -1, scene = null, exiting = [], curChunk = null;
function sceneAt(t) { let i = 0; while (i + 1 < plan.length && t >= plan[i + 1].switchAt) i++; return i; }
function switchTo(i, t, instant) {
  const next = SCENES[plan[i].id](t, plan[i]);
  next.id = plan[i].id;
  if (scene && !instant) {
    const old = scene;
    if (old.exitStyle === "rise") {
      camera.appendChild(next.el);
      anim(old.el, [{ transform: "translateY(0)" }, { transform: "translateY(-100%)" }], 1900, EASE.inOut);
      anim(next.el, [{ transform: "translateY(100%)" }, { transform: "translateY(0)" }], 1900, EASE.inOut);
    } else {
      camera.insertBefore(next.el, old.el);
      anim(next.el, [{ transform: "scale(1.07)" }, { transform: "scale(1)" }], 2000, EASE.out);
      anim(old.el, [{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(0.985)" }], 1300, EASE.inOut);
    }
    exiting.push({ s: old, until: t + 2.2 });
  } else {
    if (scene) scene.el.remove();
    camera.appendChild(next.el);
  }
  scene = next;
  sIdx = i;
  curChunk = null;
  setMedia(next.video ?? 0);
}
function hardSync(t) {
  if (scene) scene.el.remove();
  for (const e of exiting) e.s.el.remove();
  exiting = [];
  scene = null;
  for (const p of plan) for (const ch of p.chunks) ch.rested = false;
  switchTo(sceneAt(t), t, true);
  ptr = words.findIndex(w => w.t >= t);
  if (ptr < 0) ptr = words.length;
  if (ptr > 0) {
    const pw = words[ptr - 1];
    if (t < pw.chunk.next && pw.chunk.pi === sIdx) ptr = words.indexOf(pw.chunk.words[0]);
  }
}
function dispatch(w, t) {
  if (w.chunk.pi > sIdx) switchTo(w.chunk.pi, t, false);
  if (w.chunk.pi !== sIdx) return;
  if (w.i === 0) { scene.onChunk(w.chunk, t); curChunk = w.chunk; }
  if (w.el) scene.onWord(w, t);
}

/* ---- reloj: audio si suena; si no, rAF (con offset de ?t) ---- */
const startParam = Number(params.get("t")) || 0;
const HOLD = params.has("hold") ? (Number(params.get("hold")) || 1.5) : 0;
let rafT0 = null, rafNow = 0, started = false, clockOffset = startParam;
const wall = () => rafT0 === null ? 0 : (rafNow - rafT0) / 1000;
const clock = () => HOLD ? clockOffset + Math.min(HOLD, wall())
  : (!audio.paused && audio.currentTime > 0.05) ? audio.currentTime : clockOffset + wall();
async function begin() {
  if (started || HOLD) return;
  started = true;
  $("hint").style.display = "none";
  try { await audio.play(); } catch (e) { started = false; $("hint").style.display = ""; }
}
addEventListener("pointerdown", begin);

let outroShown = false, outroT = 0;
function totalDuration() {
  const d = Number(audio.duration);
  return Number.isFinite(d) && d > 0 ? d : durationHint;
}
function maybeOutro(t) {
  if (outroShown) return;
  const dur = totalDuration();
  if (!dur) return;
  if (audio.ended || t >= dur - C.outro.leadSec) {
    outroShown = true;
    outroT = t;
    doc.body.classList.add("outroActive");
    $("intro").classList.add("gone");
    $("outro").classList.add("show");
    showCard("outro");
    setMedia(0);
  }
}
audio.addEventListener("ended", () => maybeOutro(clock()));

const flicker = $("flicker");
const dbg = DEBUG ? h("div", "", doc.body) : null;
if (dbg) dbg.id = "debug";
let lastT = 0, introGone = false;
function frame(now) {
  rafNow = now;
  if (rafT0 === null) rafT0 = now;
  const t = clock(), dt = clamp(t - lastT, 0, 0.1);
  if (plan.length && (t < lastT - 1 || t > lastT + 3)) hardSync(t);
  lastT = t;
  maybeOutro(t);
  if (plan.length && !outroShown) {
    const want = sceneAt(t);
    if (want > sIdx) switchTo(want, t, false);
    while (ptr < words.length && t >= words[ptr].t) {
      if (!introGone) { $("intro").classList.add("gone"); introGone = true; }
      dispatch(words[ptr], t);
      ptr++;
    }
    if (curChunk && !curChunk.rested && t > curChunk.t1 + (scene.restAfter ?? 2.2) && t < curChunk.next - 0.35) {
      curChunk.rested = true;
      scene.onRest(curChunk, t);
    }
  }
  if (scene) scene.tick(t, dt);
  exiting = exiting.filter(e => {
    if (t > e.until) { e.s.el.remove(); return false; }
    e.s.tick(t, dt);
    return true;
  });
  if (outroShown) outroFeatherTick(t - outroT);
  camera.style.transform = `translate(${(0.5 * Math.sin(t * 0.13) * M).toFixed(3)}vw, ${(0.45 * Math.sin(t * 0.11 + 1) * M).toFixed(3)}vh) scale(${(1.02 + 0.008 * Math.sin(t * 0.07)).toFixed(4)}) rotate(${(0.16 * Math.sin(t * 0.09) * M).toFixed(3)}deg)`;
  flicker.style.opacity = (0.018 + 0.018 * Math.sin(t * 7.3) * Math.sin(t * 3.1)).toFixed(4);
  if (dbg) dbg.textContent = `t ${t.toFixed(2)}  escena ${scene?.id ?? "-"} (${sIdx + 1}/${plan.length})\n${curChunk ? curChunk.words.map(w => w.text).join(" ") : ""}`;
  requestAnimationFrame(frame);
}

audio.src = encodeURI(C.audio.src);
const sceneParam = params.get("scene");
const fontsReady = Promise.all([
  doc.fonts.load(`600 100px ${C.fonts.round}`), doc.fonts.load(`700 100px ${C.fonts.round}`), doc.fonts.load(`500 100px ${C.fonts.round}`),
  doc.fonts.load(`400 100px ${C.fonts.column}`), doc.fonts.load(`400 100px ${C.fonts.slab}`)
]).catch(() => {});
const [segs] = await Promise.all([loadLyrics(), Promise.race([fontsReady, new Promise(r => __nbSetTimeout(r, 3500))])]);
const dur = totalDuration() || (segs.at(-1)?.end ?? 0) + C.outro.leadSec + 2;
({ plan, words } = segs.length ? buildPlan(segs, dur - C.outro.leadSec) : { plan: [], words: [] });
if (DEBUG) {
  console.table(plan.map(p => ({ escena: p.id, desde: p.switchAt.toFixed(1), bloques: p.chunks.length })));
  window.__mc = { plan: plan.map(p => ({ id: p.id, from: p.switchAt, chunks: p.chunks.map(c => ({ t0: c.t0, lastT: c.lastT, t1: c.t1, next: c.next, n: c.words.length })) })) };
}
let startAt = startParam;
if (sceneParam) {
  const p = plan.find(x => x.id === sceneParam);
  if (p) startAt = Math.max(p.switchAt, 0.01);
}
clockOffset = startAt;
if (startAt > 0) { audio.currentTime = startAt; $("intro").classList.add("gone"); introGone = true; }
if (plan.length) hardSync(startAt);
lastT = startAt;
begin();
requestAnimationFrame(frame);
</script>
</body>
