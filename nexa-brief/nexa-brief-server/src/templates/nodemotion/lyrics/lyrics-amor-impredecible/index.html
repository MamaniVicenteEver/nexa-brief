    function escapeHTML(t){const e=document.createElement('i');e.textContent=t;return e.innerHTML;}function icon(kind,x,y,size,red,fill){const e=document.createElement('div');e.className='doodle '+(red?'red ':'')+(fill?'fill':'');e.innerHTML=svg[kind];e.style.cssText='left:'+x+'%;top:'+y+'%;width:'+size+'px;--bob:'+(3+(size%4))+'s';doodles.append(e);__nbSetTimeout(()=>e.remove(),5200);}
    function addDoodles(i,scene){doodles.replaceChildren();if(scene===0){icon('heart',65,37,54,false,true);icon('loop',66,46,150);icon('spark',59,32,19);}else if(scene===1){icon('hearts',16,35,85);icon('spark',12,52,19);icon('spark',29,30,13);}else if(scene===2){icon('arrow',62,58,145,true);icon('heart',24,31,35,false);}else{icon('loop',15,59,135);icon('spark',75,34,24,true);icon('heart',72,55,42,false,true);}}
    function wordSpan(word,type,i){return '<span class="piece '+type+'" style="--turn:'+(i%2?1:-1)*(i%3)+'deg;animation-delay:'+(i*95)+'ms">'+escapeHTML(word)+'</span>';}
    function row(words,type,name,offset){return '<div class="row '+name+'">'+words.map((w,i)=>wordSpan(w,type,i+offset)).join(' ')+'</div>';}
    function chooseWords(text,scene){const words=text.trim().split(/\s+/).filter(Boolean),cut=Math.max(1,Math.ceil(words.length/2)),a=words.slice(0,cut),b=words.slice(cut),mid=words[Math.floor(words.length/2)]||'';if(scene===0)return '<div class="scene scene-a">'+row(a,'script','one',0)+row(b,'type','two',a.length)+'</div>';if(scene===1)return '<div class="scene scene-b">'+row(a.slice(0,-1),'hand','one',0)+row([mid],'dramatic','two',a.length)+row(b,'hand','three',a.length+1)+'</div>';if(scene===2)return '<div class="scene scene-c">'+row(a,'type','one',0)+row(b,'script','two',a.length)+'</div>';return '<div class="scene scene-d">'+row(a.slice(0,1),'whisper','one',0)+row(a.slice(1).concat(b.slice(0,1)),'dramatic','two',1)+row(b.slice(1),'hand','three',cut)+'</div>';}
    function render(seg,index){if(old)old.remove();old=lyric.cloneNode(true);old.id='';old.className='old';old.style.position='fixed';old.style.inset='0';old.style.display='grid';old.style.placeItems='center';old.style.pointerEvents='none';document.body.append(old);__nbSetTimeout(()=>old&&old.remove(),1200);const scene=(Math.abs(Math.sin((index+(cfg.seed||27))*61.31))*10000|0)%4;lyric.innerHTML=chooseWords(seg.text||'',scene);subline.textContent=phrases[index%phrases.length];subline.classList.add('show');addDoodles(index,scene);}
    function clock(){if(!audio)return;const i=lyrics.findIndex(s=>audio.currentTime>=s.start&&audio.currentTime<s.end);if(i>=0&&i!==last){last=i;render(lyrics[i],i);}$('#progress').style.transform='scaleX('+(audio.duration?audio.currentTime/audio.duration:0)+')';requestAnimationFrame(clock);}
    async function boot(){const db=await fetch('assets/config.json').then(r=>r.json());cfg=db.configs.find(x=>x.id===db.activeId)||db.configs[0];const json=await fetch(cfg.lyricsUrl).then(r=>r.json());lyrics=json.segments||[];audio=new Audio(cfg.audio.src);audio.preload='auto';if(previewWanted)$('#screen').click();}
    $('#screen').addEventListener('click',async()=>{if(started)return;if(!audio){previewWanted=true;return;}started=true;$('#screen').classList.add('gone');try{await audio.play();}catch(e){console.warn('Audio bloqueado por navegador',e);}render(lyrics[0]||{text:'Todo cambia'},0);clock();});
    window.addEventListener('message',e=>{const type=e.data?.type;if(type==='nexa-template-preview'){previewWanted=e.data.playing===true;if(previewWanted){if(!started)$('#screen').click();else audio?.play().catch(()=>{});}else audio?.pause();}else if(type==='nexa-template-reset'){previewWanted=false;if(audio){audio.pause();try{audio.currentTime=0;}catch(_){}}started=false;last=-1;$('#screen').classList.remove('gone');}});
    boot().catch(e=>{console.warn(e);lyric.innerHTML='<span class="script piece" style="opacity:1;filter:none;transform:none">Todo cambia</span>';});
</script>
