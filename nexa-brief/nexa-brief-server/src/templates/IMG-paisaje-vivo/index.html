    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #0b0c0e;
            font-family: 'Shippori Mincho', serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Estiramos la imagen para que cubra siempre el 100% con un margen extra para soportar el movimiento de cámara y la sacudida por bajo */
        .background-stage {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            z-index: 1;
            filter: none;
            will-change: transform;
            pointer-events: none;
            image-rendering: auto;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        /* Viñeta muy suave para dar profundidad sin perder detalle */
        .vignette-overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: radial-gradient(circle at center, transparent 35%, rgba(8, 9, 12, 0.25) 100%);
            pointer-events: none;
        }

        /* Marca NEXA BRIEF */
        .nexa-brief-brand {
            position: fixed;
            top: 40px;
            right: 60px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Montserrat', sans-serif;
            pointer-events: none;
            user-select: none;
            opacity: 0.7;
            transition: opacity 1.5s ease;
        }

        .brand-nexa {
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 0.3em;
            color: #ff9a6c;
            transition: color 1.2s ease;
        }

        .brand-divider {
            width: 1px;
            height: 14px;
            background: rgba(255, 140, 100, 0.35);
            transition: background 1.2s ease;
        }

        .brand-brief {
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 0.4em;
            color: #C15B4A;
            transition: color 1.2s ease;
        }

        /* Letra vertical monumental ajustable por variables */
        .haiku {
            position: fixed;
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-family: "Shippori Mincho", "Yu Mincho", serif;
            line-height: 2.2;
            color: rgba(255, 180, 150, 0.45);
            letter-spacing: 0.28em;
            font-weight: 700;
            user-select: none;
            z-index: 4;
            pointer-events: none;
        }

        .haiku span {
            display: inline-block;
            transition: color 1.2s cubic-bezier(0.25, 1, 0.5, 1), text-shadow 1.2s ease, transform 1s ease;
            will-change: color, transform;
        }

        #scene {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 3;
            pointer-events: none;
            will-change: transform;
        }
    </style>
</head>

        const audio = document.getElementById("audio-engine");

        const brandContainer = document.getElementById("brand-container");
        const brandBrief = document.getElementById("brand-brief-text");

        let width, height;
        let petals = [], fogs = [], clouds = [], birds = [], fireflies = [], shootingStars = [];

        // Coordenadas del cursor
        let mouseX = -1000, mouseY = -1000;

        let audioCtx = null, analyser = null, dataArray = null, isPlaying = false;
        const audioImpact = { bass: 0, mid: 0, treble: 0, smoothedBass: 0 };

        const settings = {
            minWind: CONFIG.physics.minWind,
            maxWind: CONFIG.physics.maxWind,
            minSize: CONFIG.physics.minSize,
            maxSize: CONFIG.physics.maxSize,
            emitterY: CONFIG.physics.emitterY,
            emitterSpread: CONFIG.physics.emitterSpread,
            gravity: CONFIG.physics.gravity,
            turbulence: CONFIG.physics.turbulence,
            rotationSpeed: CONFIG.physics.rotationSpeed,
            tumbleStrength: CONFIG.physics.tumbleStrength,
            staticTilt: CONFIG.physics.staticTilt,
            petalCount: CONFIG.physics.petalCount,
            fogCount: CONFIG.physics.fogCount,
            cloudCount: CONFIG.physics.cloudCount,
            birdChance: CONFIG.birds.chance,
            maxBirds: CONFIG.birds.max,
            direction: CONFIG.physics.direction,
            fireflyCount: CONFIG.physics.fireflyCount,
            fireflyEnabled: CONFIG.physics.fireflyEnabled,
            repulsionRadius: CONFIG.physics.repulsionRadius,
            repulsionStrength: CONFIG.physics.repulsionStrength
        };

        const cache = { minSize: 0, maxSize: 0, minWind: 0, maxWind: 0, tiltRad: 0 };

        function updateCache() {
            cache.minSize = Math.min(settings.minSize, settings.maxSize);
            cache.maxSize = Math.max(settings.minSize, settings.maxSize);
            cache.minWind = Math.min(settings.minWind, settings.maxWind);
            cache.maxWind = Math.max(settings.minWind, settings.maxWind);
            cache.tiltRad = (settings.staticTilt * Math.PI) / 180;
        }

        function createPetalImage(colorObj) {
            const tempCanvas = document.createElement("canvas");
            tempCanvas.width = 56;
            tempCanvas.height = 56;
            const tCtx = tempCanvas.getContext("2d");
            tCtx.save();
            tCtx.translate(28, 28);
            tCtx.shadowColor = "rgba(120, 40, 20, 0.45)";
            tCtx.shadowBlur = 10;
            tCtx.beginPath();
            tCtx.moveTo(0, -18);
            tCtx.bezierCurveTo(14, -14, 18, -4, 15, 8);
            tCtx.bezierCurveTo(10, 16, 0, 13, 0, 13);
            tCtx.bezierCurveTo(0, 13, -10, 16, -15, 8);
            tCtx.bezierCurveTo(-18, -4, -14, -14, 0, -18);
            tCtx.closePath();
            
            const gradient = tCtx.createLinearGradient(-10, -15, 12, 10);
            gradient.addColorStop(0, colorObj.fill);
            gradient.addColorStop(0.5, colorObj.stroke);
            gradient.addColorStop(1, "#2B0B04");
            tCtx.fillStyle = gradient;
            tCtx.fill();
            
            tCtx.shadowBlur = 0;
            tCtx.shadowColor = "transparent";
            tCtx.strokeStyle = colorObj.vein;
            tCtx.lineWidth = 0.8;
            
            tCtx.beginPath();
            tCtx.moveTo(0, -14);
            tCtx.lineTo(0, 10);
            tCtx.stroke();
            
            tCtx.beginPath();
            tCtx.moveTo(0, -5);
            tCtx.quadraticCurveTo(-5, 2, -9, 4);
            tCtx.stroke();
            tCtx.beginPath();
            tCtx.moveTo(0, -4);
            tCtx.quadraticCurveTo(5, 2, 9, 4);
            tCtx.stroke();
            tCtx.restore();
            
            const img = new Image();
            img.src = tempCanvas.toDataURL();
            return img;
        }

        const petalImages = CONFIG.palette.petals.map(color => createPetalImage(color));

        function rotateVector(x, y, z, ax, ay, az) {
            let cos = Math.cos(az), sin = Math.sin(az);
            const x1 = x * cos - y * sin, y1 = x * sin + y * cos, z1 = z;
            cos = Math.cos(ay); sin = Math.sin(ay);
            const x2 = x1 * cos + z1 * sin, y2 = y1, z2 = -x1 * sin + z1 * cos;
            cos = Math.cos(ax); sin = Math.sin(ax);
            return {
                x: x2,
                y: y2 * cos - z2 * sin,
                z: y2 * sin + z2 * cos
            };
        }

        class Petal {
            constructor(initOnScreen = false) { 
                // Capas 3D: 0: Fondo (pequeño/lento/blurry), 1: Enfoque (normal), 2: Primer plano (gigante/rápido/desenfocado)
                this.layer = Math.random() < 0.25 ? 0 : (Math.random() < 0.18 ? 2 : 1);
                this.reset(initOnScreen); 
            }
            reset(initOnScreen = false) {
                this.image = petalImages[Math.floor(Math.random() * petalImages.length)];
                
                let baseSize = cache.minSize + Math.random() * (cache.maxSize - cache.minSize);
                
                // Modificadores de Capas 3D DoF
                if (this.layer === 0) {
                    this.width = baseSize * 0.45;
                    this.opacity = 0.2 + Math.random() * 0.3;
                    this.speedModifier = 0.4;
                } else if (this.layer === 2) {
                    this.width = baseSize * 2.3;
                    this.opacity = 0.45 + Math.random() * 0.3;
                    this.speedModifier = 1.95;
                } else {
                    this.width = baseSize;
                    this.opacity = 0.75 + Math.random() * 0.25;
                    this.speedModifier = 1.0;
                }
                
                this.height = this.width;
                const centerY = height * settings.emitterY;
                const spreadHeight = height * settings.emitterSpread;
                this.y = centerY - spreadHeight / 2 + Math.random() * spreadHeight;
                this.x = initOnScreen ? Math.random() * width : (settings.direction === -1 ? width + this.width + Math.random() * width : -this.width - Math.random() * width);
                const sizeFactor = (this.width - cache.minSize) / (cache.maxSize - cache.minSize || 1);
                this.windFactor = Math.max(0.15, Math.min(1, 1 - (sizeFactor * 0.45 + Math.random() * 0.4))) * this.speedModifier;
                
                this.vx = 0; this.vy = 0;
                this.waveOffset = Math.random() * Math.PI * 2;
                this.angleZ = Math.random() * Math.PI * 2;
                this.spinZ = (Math.random() - 0.5) * settings.rotationSpeed;
                this.angleX = 0; this.angleY = 0;
                this.spinX = (Math.random() - 0.5) * 0.1;
                this.spinY = (Math.random() - 0.5) * 0.1;
            }
            update(windVelocity) {
                const targetSpeed = (windVelocity + audioImpact.smoothedBass * 4.0) * this.windFactor;
                this.vx += (targetSpeed - this.vx) * 0.06;
                this.x += this.vx * settings.direction;
                
                // Gravedad adaptativa con velocidad aerodinámica mejorada
                this.vy += settings.gravity * 0.05 * (1.4 - (this.windFactor / this.speedModifier)) * (1.0 + audioImpact.smoothedBass * 0.7) * this.speedModifier;
                this.vy += Math.sin(this.x * 0.009 * settings.direction + this.waveOffset) * (settings.turbulence + audioImpact.smoothedBass * 1.0) * 0.05 * this.speedModifier;
                this.vy *= 0.98;
                this.y += this.vy;
                
                // Repulsión por proximidad al Cursor
                if (mouseX > -500) {
                    const dx = this.x - mouseX;
                    const dy = this.y - mouseY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < settings.repulsionRadius) {
                        const force = (1.0 - (dist / settings.repulsionRadius)) * settings.repulsionStrength;
                        this.x += (dx / dist) * force * (this.layer === 2 ? 1.6 : 1.0);
                        this.y += (dy / dist) * force * (this.layer === 2 ? 1.6 : 1.0);
                    }
                }

                const spinMult = 1.0 + audioImpact.smoothedBass * 2.5;
                this.angleZ += (this.spinZ + this.vx * 0.0012) * spinMult;
                this.angleX += this.spinX * settings.tumbleStrength * spinMult;
                this.angleY += this.spinY * settings.tumbleStrength * spinMult;
                
                if ((settings.direction === -1 && this.x < -150) || (settings.direction === 1 && this.x > width + 150) || this.y > height + 150 || this.y < -150) {
                    this.reset(false);
                }
            }
            draw() {
                const vecU = rotateVector(1, 0, 0, this.angleX, this.angleY + cache.tiltRad, this.angleZ);
                const vecV = rotateVector(0, 1, 0, this.angleX, this.angleY + cache.tiltRad, this.angleZ);
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.transform(vecU.x, vecU.y, vecV.x, vecV.y, 0, 0);
                ctx.globalAlpha = this.opacity;
                
                // Aplicar filtros de desenfoque DoF en el Canvas para planos distantes y cercanos
                if (this.layer === 0) {
                    ctx.filter = "blur(2px)";
                } else if (this.layer === 2) {
                    ctx.filter = "blur(4px)";
                }
                
                ctx.drawImage(this.image, -this.width / 2, -this.height / 2, this.width, this.height);
                ctx.restore();
            }
        }

        class CloudDrift {
            constructor(initOnScreen = false) { this.reset(initOnScreen); }
            reset(initOnScreen = false) {
                this.width = 200 + Math.random() * 180;
                this.height = 60 + Math.random() * 50;
                this.y = (height * 0.06) + Math.random() * (height * 0.32);
                this.x = initOnScreen ? Math.random() * width : width + this.width;
                this.speed = 0.04 + Math.random() * 0.1;
                this.opacity = 0.04 + Math.random() * 0.05;
                this.waveAmplitude = 6 + Math.random() * 12;
                this.wavePhase = Math.random() * Math.PI * 2;
                this.waveSpeed = 0.0015 + Math.random() * 0.003;
                this.bubbles = [];
                for (let i = 0; i < 4 + Math.floor(Math.random() * 5); i++) {
                    this.bubbles.push({
                        offsetX: (Math.random() - 0.5) * this.width * 0.7,
                        offsetY: (Math.random() - 0.4) * this.height * 0.5,
                        radiusX: (0.35 + Math.random() * 0.5) * this.width * 0.5,
                        radiusY: (0.35 + Math.random() * 0.5) * this.height * 0.6,
                        opacityMult: 0.5 + Math.random() * 0.5
                    });
                }
            }
            update() {
                this.x -= this.speed;
                this.wavePhase += this.waveSpeed;
                if (this.x < -this.width * 1.6) this.reset(false);
            }
            draw() {
                ctx.save();
                ctx.globalCompositeOperation = "destination-over";
                const baseX = this.x;
                const baseY = this.y + Math.sin(this.wavePhase) * this.waveAmplitude;
                for (const b of this.bubbles) {
                    const cx = baseX + b.offsetX, cy = baseY + b.offsetY;
                    const rad = Math.max(b.radiusX, b.radiusY);
                    const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
                    gradient.addColorStop(0, `rgba(220, 180, 160, ${this.opacity * b.opacityMult})`);
                    gradient.addColorStop(0.5, `rgba(180, 140, 120, ${this.opacity * b.opacityMult * 0.5})`);
                    gradient.addColorStop(1, "rgba(150, 110, 90, 0)");
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, b.radiusX, b.radiusY, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class FogParticle {
            constructor(initOnScreen = false) { this.reset(initOnScreen); }
            reset(initOnScreen = false) {
                this.radius = 160 + Math.random() * 160;
                this.y = (height * 0.28) + Math.random() * (height * 0.5);
                this.x = initOnScreen ? Math.random() * width : width + this.radius;
                this.speed = 0.1 + Math.random() * 0.25;
                this.opacity = 0.04 + Math.random() * 0.08;
            }
            update() {
                this.x -= this.speed * (1.0 + audioImpact.smoothedBass * 2.0);
                if (this.x < -this.radius) this.reset(false);
            }
            draw() {
                ctx.save();
                ctx.globalCompositeOperation = "destination-over";
                const gradient = ctx.createRadialGradient(this.x, this.y, 8, this.x, this.y, this.radius);
                gradient.addColorStop(0, `rgba(${CONFIG.palette.fog}, ${this.opacity})`);
                gradient.addColorStop(0.5, `rgba(180, 140, 150, ${this.opacity * 0.4})`);
                gradient.addColorStop(1, "rgba(0, 0, 0, 0)");
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Crane {
            constructor() { this.reset(); }
            reset() {
                this.x = -60;
                this.y = (height * 0.08) + Math.random() * (height * 0.35);
                this.size = 11 + Math.random() * 13;
                this.speedX = 0.65 + Math.random() * 0.75;
                this.speedY = -0.04 - Math.random() * 0.07;
                this.wingPhase = Math.random() * Math.PI * 2;
                this.wingSpeed = 0.08 + Math.random() * 0.05;
                this.opacity = 0;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                // Aceleración de aleteo por frecuencias melódicas/agudas simuladas de audio
                const trebleFactor = 1.0 + (isPlaying ? audioImpact.smoothedBass * 1.5 : 0.0);
                this.wingPhase += this.wingSpeed * trebleFactor;
                
                if (this.x < 180) this.opacity += 0.015;
                else if (this.x > width - 220) this.opacity -= 0.01;
                this.opacity = Math.max(0, Math.min(0.75, this.opacity));
                if (this.x > width + 60 || this.y < -60) this.reset();
            }
            draw() {
                if (this.opacity <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.strokeStyle = CONFIG.palette.bird;
                ctx.lineWidth = 1.8;
                ctx.lineJoin = "round";
                ctx.lineCap = "round";
                const wingY = Math.sin(this.wingPhase) * (this.size * 0.35);
                ctx.beginPath();
                ctx.moveTo(this.x - this.size * 0.35, this.y + 1);
                ctx.lineTo(this.x, this.y);
                ctx.lineTo(this.x + this.size * 0.35, this.y + 1);
                ctx.moveTo(this.x, this.y);
                ctx.quadraticCurveTo(this.x - this.size * 0.25, this.y - this.size * 0.18 + wingY, this.x - this.size * 0.65, this.y - wingY);
                ctx.moveTo(this.x, this.y);
                ctx.quadraticCurveTo(this.x + this.size * 0.25, this.y - this.size * 0.18 + wingY, this.x + this.size * 0.65, this.y - wingY);
                ctx.stroke();
                ctx.restore();
            }
        }

        class Firefly {
            constructor() { this.reset(true); }
            reset(randomY = false) {
                this.x = Math.random() * width;
                this.y = randomY ? Math.random() * height : height + 10;
                this.size = 1.6 + Math.random() * 3.2;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = -(0.15 + Math.random() * 0.35);
                this.noisePhase = Math.random() * 100;

                // Parpadeo orgánico por destellos (en vez de una respiración sinusoidal constante)
                this.glow = 0;
                this.flashTimer = Math.random() * 90;
                this.flashDuration = 0;
                this.opacity = 0;
            }
            update() {
                // Movimiento Browniano sutil
                this.noisePhase += 0.01;
                this.x += Math.sin(this.noisePhase * 2.2) * 0.28 + this.speedX;
                this.y += this.speedY;

                // Desvío del Cursor
                if (mouseX > -500) {
                    const dx = this.x - mouseX;
                    const dy = this.y - mouseY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 100) {
                        this.x += (dx / dist) * 1.5;
                    }
                }

                // Destello: sube rápido, se apaga lento, con pausas oscuras entre destellos
                if (this.flashDuration > 0) {
                    this.flashDuration -= 1;
                    this.glow = Math.min(1, this.glow + 0.15);
                } else {
                    this.glow = Math.max(0, this.glow - 0.035);
                    this.flashTimer -= 1;
                    if (this.flashTimer <= 0) {
                        this.flashDuration = 18 + Math.random() * 22;
                        this.flashTimer = 60 + Math.random() * 140;
                    }
                }
                this.opacity = 0.12 + this.glow * 0.75;

                if (this.y < -10 || this.x < -10 || this.x > width + 10) {
                    this.reset(false);
                }
            }
            draw() {
                ctx.save();
                ctx.globalCompositeOperation = "screen";

                // Halo suave exterior con el tinte de la paleta
                const haloRadius = this.size * 3.2;
                const halo = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, haloRadius);
                halo.addColorStop(0, CONFIG.palette.firefly);
                halo.addColorStop(0.45, "rgba(255, 230, 150, 0.18)");
                halo.addColorStop(1, "rgba(255, 230, 150, 0)");
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = halo;
                ctx.beginPath();
                ctx.arc(this.x, this.y, haloRadius, 0, Math.PI * 2);
                ctx.fill();

                // Núcleo brillante que crece con el destello
                const coreRadius = this.size * (0.7 + this.glow * 0.6);
                ctx.globalAlpha = Math.min(1, this.opacity * 1.3);
                ctx.fillStyle = "rgba(255, 255, 235, 1)";
                ctx.beginPath();
                ctx.arc(this.x, this.y, coreRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class ShootingStar {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * (width * 0.6);
                this.y = Math.random() * (height * 0.25);
                this.length = 80 + Math.random() * 120;
                this.speed = 12 + Math.random() * 8;
                this.dx = this.speed;
                this.dy = this.speed * 0.35;
                this.opacity = 1.0;
                this.active = false;
            }
            trigger() {
                this.reset();
                this.active = true;
            }
            update() {
                if (!this.active) return;
                this.x += this.dx;
                this.y += this.dy;
                this.opacity -= 0.025;
                if (this.opacity <= 0) {
                    this.active = false;
                }
            }
            draw() {
                if (!this.active) return;
                ctx.save();
                ctx.globalCompositeOperation = "screen";
                const grad = ctx.createLinearGradient(this.x, this.y, this.x - this.dx, this.y - this.dy);
                grad.addColorStop(0, CONFIG.palette.star);
                grad.addColorStop(1, "rgba(255, 240, 220, 0)");
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.length * 0.7, this.y - this.length * 0.25);
                ctx.stroke();
                ctx.restore();
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
        }

        function initEntities() {
            petals = []; fogs = []; clouds = []; birds = []; fireflies = []; shootingStars = [];

            // Instanciar capas tridimensionales de pétalos
            for (let i = 0; i < settings.petalCount; i++) {
                const p = new Petal(false);
                p.x += Math.random() * width * 1.8;
                petals.push(p);
            }
            for (let i = 0; i < settings.fogCount; i++) fogs.push(new FogParticle(true));
            for (let i = 0; i < settings.cloudCount; i++) clouds.push(new CloudDrift(true));

            // Instanciar luciérnagas flotantes (solo si están activadas en la configuración)
            if (settings.fireflyEnabled) {
                for (let i = 0; i < settings.fireflyCount; i++) fireflies.push(new Firefly());
            }

            // Preparar estrella fugaz única
            shootingStars.push(new ShootingStar());

            for (let i = 0; i < 3; i++) {
                const crane = new Crane();
                crane.x = Math.random() * width * 0.8;
                crane.opacity = 0.4 + Math.random() * 0.3;
                birds.push(crane);
            }
        }

        // Registrar escuchadores del cursor para repulsión física
        window.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        window.addEventListener("touchmove", (e) => {
            if (e.touches && e.touches[0]) {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
            }
        });
        window.addEventListener("mouseleave", () => {
            mouseX = -1000;
            mouseY = -1000;
        });

        let windCycle = 0;

        function animate(timestamp) {
            const elapsed = timestamp / 1000;
            ctx.clearRect(0, 0, width, height);

            if (isPlaying && analyser) {
                analyser.getByteFrequencyData(dataArray);
                let bSum = 0;
                for (let i = 0; i < 6; i++) bSum += dataArray[i];
                audioImpact.bass = bSum / 6 / 255;
                audioImpact.smoothedBass += (audioImpact.bass - audioImpact.smoothedBass) * 0.1;
            } else {
                const beatFreq = (elapsed % 0.68) / 0.68;
                audioImpact.bass = Math.pow(Math.max(0, Math.cos(beatFreq * Math.PI)), 4) * 0.5;
                audioImpact.smoothedBass += (audioImpact.bass - audioImpact.smoothedBass) * 0.09;
            }

            // Deriva cinemática de fondo suave, de izquierda a derecha, sin sacudidas
            const pX = Math.sin(elapsed * 0.09) * 2.4;
            const pY = Math.cos(elapsed * 0.065) * 0.5;
            bgStage.style.transform = `translate3d(${pX}%, ${pY}%, 0)`;
            canvas.style.transform = `translate3d(${-pX * 0.2}%, ${-pY * 0.2}%, 0)`;

            // Disparador probabilístico de estrellas fugaces en el fondo
            if (Math.random() < 0.0018) {
                shootingStars.forEach(star => {
                    if (!star.active) star.trigger();
                });
            }

            // Dibujar estrellas fugaces
            for (const star of shootingStars) {
                star.update();
                star.draw();
            }

            // Dibujar nubes y niebla escénica
            for (const cloud of clouds) { cloud.update(); cloud.draw(); }
            for (const fog of fogs) { fog.update(); fog.draw(); }

            // Procesar grullas en vuelo
            if (Math.random() < settings.birdChance && birds.length < settings.maxBirds) {
                birds.push(new Crane());
            }
            for (let i = birds.length - 1; i >= 0; i--) {
                birds[i].update();
                birds[i].draw();
                if (birds[i].x > width + 60 && birds.length > 1) {
                    birds.splice(i, 1);
                }
            }

            // Procesar luciérnagas parpadeantes (respeta el interruptor fireflyEnabled)
            if (settings.fireflyEnabled) {
                for (const firefly of fireflies) { firefly.update(); firefly.draw(); }
            }

            // Simulación física de viento dinámico y dibujado de brasas/pétalos tridimensionales
            windCycle += 0.0035;
            const baseWind = cache.minWind + (cache.maxWind - cache.minWind) * (Math.sin(windCycle) * Math.cos(windCycle * 0.5) * 0.5 + 0.5);
            for (const petal of petals) { petal.update(baseWind); petal.draw(); }

            requestAnimationFrame(animate);
        }

        // Red de seguridad: el bloque del haiku NUNCA debe salirse de la pantalla,
        // sin importar xPct/yPct/fontMax/lineGap/lineHeight que traiga la config.
        // Primero intenta reposicionarlo (lo más común); si ni así entra, lo reduce
        // de escala hasta que quepa entero.
        function fitHaikuToViewport() {
            const node = document.getElementById('haiku-root');
            if (!node) return;
            const margin = 16; // aire mínimo contra cualquier borde

            node.style.transform = 'none'; // no arrastrar un ajuste previo al medir
            const rect = node.getBoundingClientRect();

            const availW = window.innerWidth - margin * 2;
            const availH = window.innerHeight - margin * 2;
            const scale = Math.min(1, availW / rect.width, availH / rect.height);

            const scaledRight = rect.left + rect.width * scale;
            const scaledBottom = rect.top + rect.height * scale;

            let shiftX = 0, shiftY = 0;
            if (rect.left < margin) shiftX = margin - rect.left;
            else if (scaledRight > window.innerWidth - margin) shiftX = (window.innerWidth - margin) - scaledRight;

            if (rect.top < margin) shiftY = margin - rect.top;
            else if (scaledBottom > window.innerHeight - margin) shiftY = (window.innerHeight - margin) - scaledBottom;

            node.style.transformOrigin = 'top left';
            node.style.transform = (scale < 1 || shiftX !== 0 || shiftY !== 0)
                ? `translate(${shiftX}px, ${shiftY}px) scale(${scale})`
                : 'none';
        }

        (function() {
            document.getElementById("brand-nexa-text").textContent = CONFIG.brand.nexa;
            document.getElementById("brand-brief-text").textContent = CONFIG.brand.brief;

            const haikuNode = document.getElementById('haiku-root');
            haikuNode.innerHTML = '';

            const isHorizontal = CONFIG.text.orientation === 'horizontal';
            haikuNode.style.writingMode = isHorizontal ? 'horizontal-tb' : 'vertical-rl';
            haikuNode.style.textOrientation = isHorizontal ? 'mixed' : 'upright';
            haikuNode.style.letterSpacing = `${CONFIG.text.letterSpacing}em`;
            haikuNode.style.lineHeight = CONFIG.text.lineHeight;

            haikuNode.style.left = `${CONFIG.text.xPct}vw`;
            haikuNode.style.top = `${CONFIG.text.yPct}dvh`;
            haikuNode.style.fontSize = `clamp(${CONFIG.text.fontMin}px, 6.5vw, ${CONFIG.text.fontMax}px)`;

            const lines = CONFIG.text.lines;
            lines.forEach((line, lineIdx) => {
                const lineDiv = document.createElement('div');
                lineDiv.style.display = isHorizontal ? 'block' : 'inline-block';
                lineDiv.style.verticalAlign = 'top';
                if (lineIdx > 0) {
                    // Vertical apila columnas de derecha a izquierda (marginRight); horizontal apila renglones hacia abajo (marginTop)
                    if (isHorizontal) lineDiv.style.marginTop = `${CONFIG.text.lineGap}rem`;
                    else lineDiv.style.marginRight = `${CONFIG.text.lineGap}rem`;
                }
                [...line].forEach(char => {
                    const span = document.createElement('span');
                    span.textContent = char;
                    lineDiv.appendChild(span);
                });
                haikuNode.appendChild(lineDiv);
            });

            fitHaikuToViewport();
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(fitHaikuToViewport);
            }

            const spans = document.querySelectorAll('.haiku span');
            let currentCycle = 'dark', charIndex = 0;
            const colorStepDelay = 160, cycleHoldDelay = 3200;
            
            function updateHaikuColors() {
                if (charIndex < spans.length) {
                    const targetSpan = spans[charIndex];
                    if (currentCycle === 'dark') {
                        targetSpan.style.color = CONFIG.palette.textCycle[0];
                        targetSpan.style.textShadow = '0 0 20px rgba(66, 26, 37, 0.65)';
                        targetSpan.style.transform = 'scale(1.08) translateY(-4px)';
                    } else {
                        targetSpan.style.color = CONFIG.palette.textCycle[1];
                        targetSpan.style.textShadow = `0 0 25px ${CONFIG.palette.textCycle[1]}dd`;
                        targetSpan.style.transform = 'scale(1.04) translateY(-3px)';
                    }
                    charIndex++;
                    setTimeout(updateHaikuColors, colorStepDelay);
                } else {
                    setTimeout(() => {
                        spans.forEach(span => span.style.transform = 'scale(1.0) translateY(0)');
                        if (currentCycle === 'dark') {
                            brandContainer.style.opacity = "0.85";
                            brandBrief.style.color = CONFIG.palette.textCycle[1];
                            brandBrief.style.textShadow = `0 0 14px ${CONFIG.palette.textCycle[1]}77`;
                        } else {
                            brandContainer.style.opacity = "0.5";
                            brandBrief.style.color = CONFIG.palette.textCycle[0];
                            brandBrief.style.textShadow = "none";
                        }
                        currentCycle = currentCycle === 'dark' ? 'fire' : 'dark';
                        charIndex = 0;
                        updateHaikuColors();
                    }, cycleHoldDelay);
                }
            }
            setTimeout(updateHaikuColors, 1200);
        })();

        function initAudioContext() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            analyser.smoothingTimeConstant = 0.8;
            const source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }

        async function startAudioPlayback() {
            if (!audioCtx) initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
            if (audio.paused) {
                audio.play().then(() => { isPlaying = true; }).catch(err => console.warn(err));
            }
        }

        // Toggle manual para preview interactivo en navegador real (no lo usa la
        // grabación headless, que arranca solo — ver DOMContentLoaded abajo).
        window.addEventListener('click', async () => {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                await startAudioPlayback();
            }
        }, { once: false });

        // boot() en vez de solo un listener de DOMContentLoaded: el fetch de
        // config.json de arriba (top-level await) es asíncrono, así que
        // DOMContentLoaded puede llegar a dispararse ANTES de que este script
        // module termine de evaluarse y registre el listener — chequear
        // document.readyState cubre ese caso (confirmado con un smoke test real:
        // sin este chequeo, bgImage/audio quedaban sin inicializar).
        function boot() {
            bgStage.style.backgroundImage = `url('${CONFIG.img.src}')`;
            audio.src = CONFIG.audio.src;

            resize();
            updateCache();
            initEntities();
            requestAnimationFrame(animate);
            // Arranca solo — el browser de grabación se lanza con
            // --autoplay-policy=no-user-gesture-required, así que .play() no
            // necesita un click real acá.
            startAudioPlayback();

            window.addEventListener('resize', () => {
                resize();
                initEntities();
                fitHaikuToViewport();
            });
        }

        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }
    </script>
</body>
</html>
