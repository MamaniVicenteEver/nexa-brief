<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA // DYNAMIC PLAYER TEMPLATE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #080101;
      font-family: 'Montserrat', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Fondo principal con transición fluida */
    .background-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      transition: background 0.5s ease;
    }

    /* Sombreado perimetral suave: transparente hasta el 90% y oscurece el último 10% de los cantos */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, transparent 90%, rgba(0, 0, 0, 0.95) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .backdrop-text-container {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      user-select: none;
      pointer-events: none;
    }

    /* El texto gigante trasero con control dinámico de tamaño y opacidad */
    .aura-title {
      font-size: 30vw; /* Ajustado dinámicamente por JS */
      font-weight: 900;
      color: rgba(255, 255, 255, 0.3); /* Color de respaldo */
      opacity: 0.3; /* Opacidad de respaldo */
      letter-spacing: -0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      text-align: center;
      transition: opacity 0.3s ease, color 0.3s ease;
    }

    #particles-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    .character-master-box {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 4;
      pointer-events: none;
    }

    .character-wrapper {
      position: relative;
      height: 70vh;
      width: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: charLevitate 4.5s ease-in-out infinite alternate;
    }

    @keyframes charLevitate {
      0% { transform: translateY(-15px); }
      100% { transform: translateY(20px); }
    }

    .main-character {
      height: 100%;
      width: auto;
      object-fit: contain;
      filter: grayscale(1) contrast(1.5) brightness(0.9) drop-shadow(0 25px 40px rgba(0,0,0,0.9));
      mix-blend-mode: luminosity;
      position: relative;
      z-index: 2;
    }

    #aura-canvas {
      position: absolute;
      top: -15%;
      left: -50%;
      width: 200%;
      height: 130%;
      z-index: 1;
      pointer-events: none;
    }

    .base-glow {
      position: absolute;
      bottom: 5%;
      width: 250px;
      height: 200px;
      background: radial-gradient(circle, rgba(255, 0, 0, 0.6) 0%, rgba(26, 0, 0, 0.8) 40%, transparent 70%);
      filter: blur(35px);
      z-index: -1;
      mix-blend-mode: color-dodge;
      animation: pulseEnergy 0.3s ease-in-out infinite alternate;
    }

    @keyframes pulseEnergy {
      0% { transform: scale(0.95); opacity: 0.6; }
      100% { transform: scale(1.1); opacity: 0.9; }
    }

    .energy-arc {
      position: absolute;
      width: 3px;
      height: 100px;
      background: linear-gradient(to top, transparent, #ff3333, transparent);
      filter: blur(1px) drop-shadow(0 0 8px #ff0000);
      opacity: 0.7;
      animation: energyRise 2s linear infinite;
      z-index: 1;
    }
    .arc-left { left: 30%; top: 25%; animation-delay: 0s; }
    .arc-right { right: 30%; top: 25%; animation-delay: 0.6s; }

    @keyframes energyRise {
      0% { transform: translateY(50px) scaleY(0.3); opacity: 0; }
      50% { opacity: 0.9; }
      100% { transform: translateY(-80px) scaleY(1.3); opacity: 0; }
    }

    .brand-header {
      position: fixed;
      top: 50px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      z-index: 5;
      color: #ffffff;
    }

    .riox-logo {
      text-align: right;
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      line-height: 1;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .riox-logo span {
      font-size: 0.55rem;
      letter-spacing: 0.35em;
      font-weight: 400;
      display: block;
      margin-top: 2px;
      color: #ff3333;
    }

    .player-footer {
      position: fixed;
      bottom: 40px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 5;
      color: #ffffff;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .track-info-panel {
      line-height: 1.8;
    }
    .track-title {
      font-weight: 900;
      font-size: 1rem;
      color: #ff3333;
    }
  
  /* ── Recording UI ─────────────────────────────────────────────────────── */
  #rec-btn {
    position: fixed; bottom: 24px; right: 24px; z-index: 9999;
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(10,10,10,0.85); border: 2px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(8px); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, border-color .15s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #rec-btn:hover { transform: scale(1.1); border-color: rgba(255,60,60,0.7); }
  #rec-btn svg { width: 18px; height: 18px; }
  #rec-btn.recording { border-color: #ff3c3c; animation: rec-pulse 1.2s ease-in-out infinite; }
  @keyframes rec-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,60,60,.5)} 50%{box-shadow:0 0 0 8px rgba(255,60,60,0)} }
  #rec-panel {
    position: fixed; bottom: 84px; right: 24px; z-index: 9999;
    width: 280px; background: rgba(10,10,12,0.96);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 16px;
    padding: 18px; backdrop-filter: blur(20px);
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    display: none; flex-direction: column; gap: 10px;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #rec-panel.open { display: flex; }
  #rec-panel h3 {
    color: rgba(255,255,255,0.9); font-size: 11px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    margin: 0 0 4px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .rec-engine {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 10px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.03);
    transition: background .12s, border-color .12s;
  }
  .rec-engine:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.16); }
  .rec-engine.active { border-color: rgba(255,60,60,0.5); background: rgba(255,40,40,0.08); }
  .rec-engine-icon {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .rec-engine-info { flex: 1; min-width: 0; }
  .rec-engine-name { color: #fff; font-size: 13px; font-weight: 600; margin: 0 0 2px; }
  .rec-engine-desc { color: rgba(255,255,255,0.45); font-size: 10px; line-height: 1.3; margin: 0; }
  .rec-engine-badge {
    font-size: 9px; padding: 2px 6px; border-radius: 4px;
    font-weight: 700; letter-spacing: .05em; white-space: nowrap; flex-shrink: 0;
  }
  .badge-fast    { background: rgba(60,200,120,0.2); color: #3cc878; }
  .badge-quality { background: rgba(255,160,60,0.2); color: #ffa03c; }
  .badge-dev     { background: rgba(100,140,255,0.2); color: #6488ff; }
  #rec-go {
    margin-top: 4px; padding: 11px; border-radius: 10px; border: none; cursor: pointer;
    background: #e03030; color: #fff; font-size: 13px; font-weight: 700;
    letter-spacing: .04em; transition: background .12s, opacity .12s; font-family: inherit;
  }
  #rec-go:hover { background: #c52020; }
  #rec-go:disabled { opacity: .35; cursor: not-allowed; }
  #rec-status {
    font-size: 10px; color: rgba(255,255,255,0.4); text-align: center;
    min-height: 14px; font-family: inherit;
  }
  body.headless #rec-btn, body.headless #rec-panel { display: none !important; }
</style>

<button id="rec-btn" title="Motor de grabación (R)">

    // Fallback 2: Goku Plomo/Gris EXACTO al estilo de la imagen image_7893e6.jpg

    // Tier 3 del loader de configuración: mismo contenido que assets/config.json,
    // embebido para cubrir el caso file:// donde fetch() a recursos locales falla siempre.
    const DEFAULT_CONFIG = {
      "subject": {

    let configAssetBase = "";

    async function loadConfiguration() {
      // Tier 1: pipeline real — config.json generado en tiempo de ejecución.
      try {
        const response = await fetch('config.json');
        if (!response.ok) throw new Error('No se pudo leer config.json');
        configAssetBase = "";
        currentConfig = await response.json();
        applyConfiguration();
        return;
      } catch (err) {
        // sigue al Tier 2
      }

      // Tier 2: config.json de ejemplo empaquetado en assets/ (dev / preview servido por HTTP).
      try {
        const response = await fetch('assets/config.json');
        if (!response.ok) throw new Error('No se pudo leer assets/config.json');
        const parsed = await response.json();
        if (!parsed || Object.keys(parsed).length === 0) throw new Error('assets/config.json vacío');
        configAssetBase = "assets/";
        currentConfig = parsed;
        applyConfiguration();
        return;
      } catch (err) {
        // sigue al Tier 3
      }

      // Tier 3: config embebida — cubre apertura directa vía file://, donde el navegador
      // bloquea fetch() a recursos locales y ambos tiers anteriores fallan siempre.
      console.warn("Cargando configuración de respaldo embebida (file:// / sin servidor)");
      currentConfig = DEFAULT_CONFIG;

      // Selector inteligente de fallback mediante parámetro URL (?fallback=1 o ?fallback=2)
      const urlParams = new URLSearchParams(window.location.search);
      const charParam = urlParams.get('fallback');
      if (charParam === '1') currentConfig = fallbackConfig1;
      else if (charParam === '2') currentConfig = fallbackConfig2;

      applyConfiguration();
    }

    // Helper para convertir hex a rgba manteniendo transparencias idénticas
    function hexToRgba(hex, alpha) {
      let c;
      if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
        c= hex.substring(1).split('');
        if(c.length== 3){
          c= [c[0], c[0], c[1], c[1], c[2], c[2]];
        }
        c= '0x' + c.join('');
        return 'rgba('+[(c>>16)&255, (c>>8)&255, c&255].join(',')+','+alpha+')';
      }
      return hex;
    }

    // Ajusta la fuente gigante trasera de forma matemática para que NUNCA desborde el ancho
    function fitGiantTitle() {
      if (!backdropTitle) return;
      
      // Tamaño máximo de inicio (basado en el viewport)
      let fontSize = Math.min(window.innerWidth * 0.35, window.innerHeight * 0.55);
      backdropTitle.style.fontSize = fontSize + 'px';
      
      const maxWidth = window.innerWidth * 0.90; // Límite de seguridad del 90%
      let safety = 0;
      
      // Reduce progresivamente hasta que encaje sin saltos de línea
      while (backdropTitle.scrollWidth > maxWidth && fontSize > 12 && safety < 150) {
        fontSize -= 4;
        backdropTitle.style.fontSize = fontSize + 'px';
        safety++;
      }
    }

    function resolveConfigAsset(src) {
      if (!src || /^(?:[a-z][a-z\d+.-]*:|\/)/i.test(src)) return src;
      const normalized = src.replace(/^\.\//, "");
      if (normalized.startsWith("assets/")) return normalized;
      return `${configAssetBase}${normalized}`;
    }

    function applyConfiguration() {
      // Mapeo seguro para admitir tanto estructuras planas como anidadas del Prompt 1
      const subject = currentConfig.subject || {};
      const background = currentConfig.background || currentConfig.bg || {};
      const word = currentConfig.word || {};
      const atmosphere = currentConfig.atmosphere || {};
      const brand = currentConfig.brand || { name: "RIOX", sub: "RECORDS" };

      // Extraer propiedades con respaldo
      const imgSrc = subject.src || "img/subject.png";
      const blendMode = background.blend || currentConfig.blend || 'none';
      const bgColors = background.colors || (currentConfig.bg ? currentConfig.bg.colors : ["#3b6fa6", "#0f1f33", "#040810"]);
      
      const giantWord = word.giant_word || currentConfig.giantWord || "AURA";
      const giantColor = word.giant_color || currentConfig.giantColor || "#ffffff";
      
      // Control de opacidad dinámico: prioridad al JSON, de lo contrario usa 0.30 (30% de transparencia)
      const giantOpacity = (word.opacity !== undefined) ? word.opacity : ((currentConfig.giantOpacity !== undefined) ? currentConfig.giantOpacity : 0.30);
      
      const inkColor = word.ink || currentConfig.ink || "#FFFFFF";
      
      const pConfig = atmosphere.particles || currentConfig.particles || { type: "stones", color: "#38a0ff", dark: "rgba(15, 2, 2, 0.9)", count: 25 };
      const glowConfig = atmosphere.glow || currentConfig.glow || { color: "#38a0ff", intensity: 0.5 };
      const effect = atmosphere.effect || currentConfig.effect || 'sparks';
      const brandName = brand.name || "RIOX";
      const brandSubText = brand.sub || "RECORDS";
      const trackName = currentConfig.track || giantWord;

      // 1. Imagen y fusión
      mainCharImg.src = resolveConfigAsset(imgSrc);
      mainCharImg.style.mixBlendMode = blendMode;

      // 2. Colores del fondo (Gradiente radial súper suave, brillante y expansivo)
      bgStage.style.background = `radial-gradient(circle at center, ${bgColors[0]} 0%, ${bgColors[1]} 65%, ${bgColors[2] || '#040810'} 100%)`;

      // 3. Palabra gigante trasera y aplicación de Opacidad Dinámica
      backdropTitle.textContent = giantWord;
      backdropTitle.style.color = giantColor;
      backdropTitle.style.opacity = giantOpacity; // Control de porcentaje preciso
      fitGiantTitle(); // Ajuste inmediato tras cambiar el texto

      // 4. Marca superior e Ink color
      brandLogo.innerHTML = `${brandName} <span id="brand-sub">${brandSubText}</span>`;
      brandLogo.style.color = inkColor;
      const brandSubEl = document.getElementById('brand-sub');
      if (brandSubEl) brandSubEl.style.color = glowConfig.color;

      // 5. Track musical inicial
      trackNameEl.textContent = trackName;
      if (trackNameEl) trackNameEl.style.color = glowConfig.color;

      // 6. Color dinámico del Glow de los pies
      const glowColor = glowConfig.color;
      baseGlowEl.style.background = `radial-gradient(circle, ${hexToRgba(glowColor, 0.5)} 0%, ${hexToRgba(glowColor, 0.15)} 40%, transparent 70%)`;

      // 7. Color de los arcos CSS laterales de energía
      document.querySelectorAll('.energy-arc').forEach(el => {
        el.style.background = `linear-gradient(to top, transparent, ${glowColor}, transparent)`;
        el.style.filter = `blur(1px) drop-shadow(0 0 8px ${glowColor})`;
      });

      // 8. Control de visibilidad del efecto de rayos (sparks)
      const arcL = document.querySelector('.arc-left');
      const arcR = document.querySelector('.arc-right');

      if (effect === 'sparks' || effect === 'arcs') {
        auraCanvas.style.display = 'block';
        if (arcL) arcL.style.display = 'block';
        if (arcR) arcR.style.display = 'block';
      } else {
        auraCanvas.style.display = 'none';
        if (arcL) arcL.style.display = 'none';
        if (arcR) arcR.style.display = 'none';
      }

      // Inicializaciones de canvas
      initStones(pConfig);
      initAuraCanvas();
    }

    function initStones(pConfig) {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
      stones = [];
      const count = pConfig && pConfig.count ? pConfig.count : 25;
      for (let i = 0; i < count; i++) {
        stones.push({
          x: Math.random() * bgCanvas.width,
          y: Math.random() * bgCanvas.height,
          size: Math.random() * 7 + 3,
          speedY: -(Math.random() * 0.5 + 0.1),
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.02,
          pulseOffset: Math.random() * 100
        });
      }
    }

    function drawStones(elapsed) {
      if (!currentConfig) return;
      const atmosphere = currentConfig.atmosphere || {};
      const pConfig = atmosphere.particles || currentConfig.particles || {};
      const particleColor = pConfig.color || "#38a0ff";
      const type = pConfig.type || "stones";

      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

      stones.forEach(stone => {
        stone.y += stone.speedY;
        stone.rotation += stone.rotSpeed;

        if (stone.y < -20) {
          stone.y = bgCanvas.height + 20;
          stone.x = Math.random() * bgCanvas.width;
        }

        bgCtx.save();
        const driftX = Math.sin((elapsed + stone.pulseOffset) * 0.5) * 0.3;
        bgCtx.translate(stone.x + driftX, stone.y);

        if (type === "embers") {
          // Partículas tipo chispas suaves
          bgCtx.fillStyle = particleColor;
          bgCtx.shadowColor = particleColor;
          bgCtx.shadowBlur = 6;
          bgCtx.beginPath();
          bgCtx.arc(0, 0, stone.size * 0.4, 0, Math.PI * 2);
          bgCtx.fill();
        } else {
          // Partículas tipo piedras poligonales ORIGINALES (Sólidas sin bordes/strokes)
          bgCtx.fillStyle = pConfig.dark || "rgba(15, 2, 2, 0.9)";
          bgCtx.rotate(stone.rotation);
          bgCtx.beginPath();
          bgCtx.moveTo(-stone.size, -stone.size * 0.6);
          bgCtx.lineTo(stone.size * 0.8, -stone.size);
          bgCtx.lineTo(stone.size, stone.size * 0.4);
          bgCtx.lineTo(-stone.size * 0.4, stone.size);
          bgCtx.closePath();
          bgCtx.fill();
        }
        bgCtx.restore();
      });
    }

    function initAuraCanvas() {
      const rect = auraCanvas.getBoundingClientRect();
      auraCanvas.width = rect.width * 1.5;
      auraCanvas.height = rect.height * 1.5;
    }

    function updateAndDrawAura(elapsed) {
      if (!currentConfig) return;
      const atmosphere = currentConfig.atmosphere || {};
      const effect = atmosphere.effect || currentConfig.effect || 'sparks';
      if (effect === 'none') return;
      
      auraCtx.clearRect(0, 0, auraCanvas.width, auraCanvas.height);
      
      const width = auraCanvas.width;
      const height = auraCanvas.height;
      const glowConfig = atmosphere.glow || currentConfig.glow || { color: "#38a0ff" };
      const glowColor = glowConfig.color;
      
      auraCtx.globalCompositeOperation = 'screen';

      // Generación de descargas eléctricas y destellos
      if (Math.random() < 0.25) {
        const boltStartX = width * 0.25 + Math.random() * (width * 0.5);
        const boltStartY = height * 0.2 + Math.random() * (height * 0.6);
        
        let points = [{ x: boltStartX, y: boltStartY }];
        let segments = Math.floor(Math.random() * 5) + 4;
        let currentX = boltStartX;
        let currentY = boltStartY;

        for (let j = 0; j < segments; j++) {
          currentX += (Math.random() - 0.5) * 45;
          currentY -= Math.random() * 25 + 10;
          points.push({ x: currentX, y: currentY });
        }

        lightningBolts.push({
          points: points,
          color: Math.random() > 0.4 ? glowColor : (Math.random() > 0.5 ? '#bce0ff' : '#ffffff'),
          alpha: 1.0,
          decay: Math.random() * 0.12 + 0.08,
          width: Math.random() * 2.5 + 1
        });
      }

      // Dibujar Relámpagos
      for (let i = lightningBolts.length - 1; i >= 0; i--) {
        const b = lightningBolts[i];
        b.alpha -= b.decay;

        if (b.alpha <= 0) {
          lightningBolts.splice(i, 1);
          continue;
        }

        auraCtx.save();
        auraCtx.strokeStyle = b.color;
        auraCtx.shadowColor = glowColor;
        auraCtx.shadowBlur = 12;
        auraCtx.globalAlpha = b.alpha;
        auraCtx.lineWidth = b.width;
        
        auraCtx.beginPath();
        auraCtx.moveTo(b.points[0].x, b.points[0].y);
        for (let j = 1; j < b.points.length; j++) {
          auraCtx.lineTo(b.points[j].x, b.points[j].y);
        }
        auraCtx.stroke();
        auraCtx.restore();
      }
    }

    function loop(timestamp) {
      requestAnimationFrame(loop);
      const elapsed = (timestamp - startTime) / 1000;

      const atmosphere = currentConfig ? (currentConfig.atmosphere || {}) : {};
      const pConfig = atmosphere.particles || (currentConfig ? currentConfig.particles : null);
      drawStones(elapsed);
      updateAndDrawAura(elapsed);
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadConfiguration();
      requestAnimationFrame(loop);
    });

    window.addEventListener('resize', () => {
      const atmosphere = currentConfig ? (currentConfig.atmosphere || {}) : {};
      const pConfig = atmosphere.particles || (currentConfig ? currentConfig.particles : null);
      initStones(pConfig);
      initAuraCanvas();
      fitGiantTitle(); // Autoajuste de texto al reescalar pantalla
    });
  
/* ── Recording UI ──────────────────────────────────────────────────────── */
(function initRecUI() {
  if (new URLSearchParams(location.search).get('headless') === '1') {
    document.body.classList.add('headless'); return;
  }
  const btn    = document.getElementById('rec-btn');
  const panel  = document.getElementById('rec-panel');
  const goBtn  = document.getElementById('rec-go');
  const status = document.getElementById('rec-status');
  if (!btn) return;
  let selectedEngine = null, recording = false;

  function togglePanel() { panel.classList.toggle('open'); }
  btn.addEventListener('click', e => { e.stopPropagation(); togglePanel(); });
  document.addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') togglePanel(); });
  document.addEventListener('click', e => {
    if (!panel.contains(e.target) && e.target !== btn) panel.classList.remove('open');
  });
  document.querySelectorAll('.rec-engine').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.rec-engine').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      selectedEngine = el.dataset.engine;
      goBtn.disabled = false;
      status.textContent = '';
    });
  });
  goBtn.addEventListener('click', async () => {
    if (!selectedEngine || recording) return;
    recording = true;
    btn.classList.add('recording');
    goBtn.disabled = true;
    panel.classList.remove('open');
    status.textContent = 'Iniciando ' + selectedEngine + '…';
    const templateName = location.pathname.split('/').filter(Boolean).slice(-2, -1)[0]
                         || document.title || 'unknown';
    const payload = { engine: selectedEngine, template: templateName, timestamp: Date.now() };
    window.postMessage({ type: 'nexa:record', ...payload }, '*');
    document.dispatchEvent(new CustomEvent('nexa:record', { detail: payload }));
    try {
      const res = await fetch('/api/v1/record', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      status.textContent = res.ok ? (await res.json()).message || ('Grabando con ' + selectedEngine + '…')
                                  : 'API ' + res.status + ' — evento emitido';
    } catch { status.textContent = 'Sin servidor — evento emitido (' + selectedEngine + ')'; }
    setTimeout(() => { recording = false; btn.classList.remove('recording'); goBtn.disabled = false; status.textContent = ''; }, 8000);
  });
})();
/* ─────────────────────────────────────────────────────────────────────────── */
</script>
