<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAUTION — Kinetic Lyrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,100..900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* tema — defaults idénticos al caso actual; config.json puede pisarlos */
  :root {
    --fExt: "Archivo", sans-serif; --fCond: "Anton", sans-serif; --fCond2: "Oswald", sans-serif;
    --red: #C80202; --dark: #000000; --light: #FFFFFF;
  }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; cursor: pointer; }

  /* escenario: cada escena es un "cartón" a pantalla completa con corte duro */
  #stage { position: fixed; inset: 0; overflow: hidden; z-index: 1; }
  .scene { position: absolute; left: 0; top: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .patch { position: absolute; pointer-events: none; }

  /* texto: .bx posiciona (left/top + translate por ancla), .tx es lo que se anima */
  .bx { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 0.86; }
  .tx { display: inline-block; white-space: nowrap; line-height: 0.86; text-transform: uppercase; }
  .ch { display: inline-block; white-space: pre; }
  .ext  { font-family: var(--fExt); font-weight: 900; font-stretch: 125%; }
  .sans { font-family: var(--fExt); font-weight: 900; font-stretch: 100%; }
  .nar  { font-family: var(--fExt); font-weight: 900; font-stretch: 70%; }
  .lite { font-family: var(--fExt); font-weight: 500; font-stretch: 100%; text-transform: none; }
  .cond { font-family: var(--fCond); font-weight: 400; }
  .cond2 { font-family: var(--fCond2); font-weight: 700; }
  .lab { position: absolute; overflow: hidden; }
  .lab > div { padding: 0.18em 0.45em 0.12em; white-space: nowrap; line-height: 1; text-transform: uppercase;
               font-family: var(--fExt); font-weight: 900; font-stretch: 100%; }

  #measure { position: absolute; left: -99999px; top: 0; visibility: hidden; white-space: nowrap;
             font-size: 100px; line-height: 0.86; }

  #hud {
    position: fixed; left: 8px; top: 8px; z-index: 50; display: none; padding: 6px 8px;
    font: 11px/1.4 ui-monospace, monospace; color: #0f0; background: rgba(0,0,0,0.7); pointer-events: none;
  }
  #hint {
    position: fixed; bottom: 6vh; width: 100vw; text-align: center; z-index: 8;
    font-family: var(--fExt); font-weight: 900; font-size: 1.5vh; letter-spacing: 0.5em; color: #fff;
    opacity: 0.55; animation: hintPulse 2s ease infinite; pointer-events: none;
  }
  @keyframes hintPulse { 0%,100% { opacity: 0.2; } 50% { opacity: 0.7; } }

  /* ── Recording UI ─────────────────────────────────────────────────────── */
  #rec-btn {
    position: fixed; bottom: 24px; right: 24px; z-index: 9999;
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(10,10,10,0.85); border: 2px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(8px); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, border-color .15s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #rec-btn:hover { transform: scale(1.1); border-color: rgba(255,60,60,0.7); }
  #rec-btn svg { width: 18px; height: 18px; }
  #rec-btn.recording { border-color: #ff3c3c; animation: rec-pulse 1.2s ease-in-out infinite; }
  @keyframes rec-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,60,60,.5)} 50%{box-shadow:0 0 0 8px rgba(255,60,60,0)} }
  #rec-panel {
    position: fixed; bottom: 84px; right: 24px; z-index: 9999;
    width: 280px; background: rgba(10,10,12,0.96);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 16px;
    padding: 18px; backdrop-filter: blur(20px);
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    display: none; flex-direction: column; gap: 10px;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #rec-panel.open { display: flex; }
  #rec-panel h3 {
    color: rgba(255,255,255,0.9); font-size: 11px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    margin: 0 0 4px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .rec-engine {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 10px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.03);
    transition: background .12s, border-color .12s;
  }
  .rec-engine:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.16); }
  .rec-engine.active { border-color: rgba(255,60,60,0.5); background: rgba(255,40,40,0.08); }
  .rec-engine-icon {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .rec-engine-info { flex: 1; min-width: 0; }
  .rec-engine-name { color: #fff; font-size: 13px; font-weight: 600; margin: 0 0 2px; }
  .rec-engine-desc { color: rgba(255,255,255,0.45); font-size: 10px; line-height: 1.3; margin: 0; }
  .rec-engine-badge {
    font-size: 9px; padding: 2px 6px; border-radius: 4px;
    font-weight: 700; letter-spacing: .05em; white-space: nowrap; flex-shrink: 0;
  }
  .badge-fast    { background: rgba(60,200,120,0.2); color: #3cc878; }
  .badge-quality { background: rgba(255,160,60,0.2); color: #ffa03c; }
  .badge-dev     { background: rgba(100,140,255,0.2); color: #6488ff; }
  #rec-go {
    margin-top: 4px; padding: 11px; border-radius: 10px; border: none; cursor: pointer;
    background: #e03030; color: #fff; font-size: 13px; font-weight: 700;
    letter-spacing: .04em; transition: background .12s, opacity .12s; font-family: inherit;
  }
  #rec-go:hover { background: #c52020; }
  #rec-go:disabled { opacity: .35; cursor: not-allowed; }
  #rec-status {
    font-size: 10px; color: rgba(255,255,255,0.4); text-align: center;
    min-height: 14px; font-family: inherit;
  }
  body.headless #rec-btn, body.headless #rec-panel, body.headless #hint { display: none !important; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<span id="measure"></span>
<div id="hint">CLICK PARA EMPEZAR</div>
<audio id="audio" preload="auto"></audio>
<!-- ── Recording panel ────────────────────────────────────────────────── -->
<button id="rec-btn" title="Motor de grabación (R)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" style="color:#fff">
    <circle cx="12" cy="12" r="7" fill="rgba(255,60,60,0.85)" stroke="none"/>
    <circle cx="12" cy="12" r="11" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>
  </svg>
</button>
<div id="rec-panel">
  <h3>Motor de grabación</h3>
  <div class="rec-engine" data-engine="hyperframes">
    <div class="rec-engine-icon" style="background:rgba(255,160,30,0.15)">⚡</div>
    <div class="rec-engine-info">
      <p class="rec-engine-name">HyperFrames</p>
      <p class="rec-engine-desc">Rápido, nativo del pipeline Nexa.</p>
    </div>
    <span class="rec-engine-badge badge-fast">RÁPIDO</span>
  </div>
  <div class="rec-engine" data-engine="remotion">
    <div class="rec-engine-icon" style="background:rgba(100,60,255,0.15)">🎬</div>
    <div class="rec-engine-info">
      <p class="rec-engine-name">Remotion</p>
      <p class="rec-engine-desc">Mejor calidad, render más lento.</p>
    </div>
    <span class="rec-engine-badge badge-quality">CALIDAD</span>
  </div>
  <div class="rec-engine" data-engine="playwright">
    <div class="rec-engine-icon" style="background:rgba(60,180,255,0.15)">🎭</div>
    <div class="rec-engine-info">
      <p class="rec-engine-name">Playwright</p>
      <p class="rec-engine-desc">Captura real del navegador.</p>
    </div>
    <span class="rec-engine-badge badge-dev">BROWSER</span>
  </div>
  <button id="rec-go" disabled>● Grabar</button>
  <p id="rec-status"></p>
</div>
<!-- ──────────────────────────────────────────────────────────────────────── -->

<script type="module">
/* ================================ CONFIG ================================ */
/* Mismo contrato que LYRICS-letras-de-neon: la letra se consume 100% de
   lyricsUrl (formato Whisper: { metadata, segments: [ { words: [ { word,
   start, end } ] } ] }) y el CONFIG vive en config.json como colección
   { activeId, configs: [ CASO, ... ] }. Para otra canción basta otro caso
   (u otro config.json en el pipeline) — acá no se toca nada.
   Servir por HTTP (python3 -m http.server): por file:// el fetch se bloquea.

   Motor: kinetic typography de cortes duros ("Caution"). La letra se agrupa
   en ESCENAS de ~0.4–1.3 s (una por palabra acentuada); cada escena elige un
   layout del mazo (config.layouts) y un fondo (rojo / blanco / negro). Todas
   las animaciones son Web Animations en pausa que se posicionan con el reloj
   del audio en cada frame (tl.seek), así que el render es determinista:
   ?t=12.3 congela el cuadro de ese segundo (debug / capturas). */
const ACTIVE_ID = null;   /* <-- forzar un id · null = usa "activeId" del JSON */

const DEFAULT_CONFIG = {"activeId":"default","configs":[{"id":"default","description":"Kinetic typography de cortes duros estilo 'Caution'. — metadata para marketing/SEO, la plantilla no la usa todavía.","audio":{"src":"assets/From-Klickpin.mp3"},"lyricsUrl":"assets/lyrics.json","fonts":{"googleUrl":"https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,100..900&family=Oswald:wght@500;600;700&display=swap","extended":"\"Archivo\", sans-serif","condensed":"\"Anton\", sans-serif","condensedAlt":"\"Oswald\", sans-serif"},"colors":{"primary":"#C80202","dark":"#000000","light":"#FFFFFF"},"intro":{"artist":"","title":"","album":"","labels":{"artist":"Artist","title":"Single","album":"Album"},"cardSec":1.0},"outro":{"enabled":true,"leadSec":3,"title":"Gracias","sub":"Por ver","feats":"Suscríbete · NEXA BRIEF"},"timing":{"leadSec":0.12},"scenes":{"gapSec":0.6,"maxWords":4,"maxChars":22,"minSec":0.42,"maxSec":1.3,"maxHoldSec":1.6,"echoSec":0.95,"cooldown":3,"dropOutChance":0.35,"pushScale":0.035,"stopwords":[]},"layouts":{},"mosaic":{"enabled":true,"atSec":null,"minGapSec":1.2,"maxSec":2.6,"tailFraction":0.35,"cols":4,"rows":4,"swapSec":0.45},"texture":{"grain":0.1,"patches":true},"debug":{"enabled":false},"seed":7}]};

/* stopwords por defecto (en + es): palabras que NUNCA son la protagonista de
   una escena ni abren un corte por sí solas. config.scenes.stopwords se suma. */
const BASE_STOP = ("a an the and or but so of to in on at by for from with up out off as is are am be was were " +
  "i im i'm me my you your he she it its we they them his her our their this that these those " +
  "do don't can can't will just like if then than too very let get got gotta wanna gonna yeah oh " +
  "el la los las un una unos unas y o pero de del al a en con por para sin que se me te le lo les nos " +
  "mi tu su mis tus sus yo es soy eres son fue ya no si sí muy más como cuando donde").split(/\s+/);

/* layouts del mazo: weight (0 = desactivado) y fondos posibles. config.layouts
   pisa campo a campo. Los nombres son el vocabulario estable de la plantilla. */
const BASE_LAYOUTS = {
  giant:     { weight: 3.0, bgs: ["red", "black", "white"] },   /* MOVE / MAN / PLEASE a pantalla llena + etiqueta + tickers */
  type:      { weight: 2.0, bgs: ["black"] },                   /* I HEAR / EM CHATTIN tecleado + ecos chicos */
  editorial: { weight: 1.4, bgs: ["white"] },                   /* STOP · FOR THE / TALKING · barra · lista */
  build:     { weight: 1.4, bgs: ["white", "black"] },          /* GOTTA LET / OUT THE / BEAST. palabra a palabra */
  mirror:    { weight: 1.2, bgs: ["white", "red", "black"] },   /* LET OUT THE con copias recortadas arriba/abajo */
  sandwich:  { weight: 1.0, bgs: ["white"] },                   /* HOT / frase chica / LIKE */
  pair:      { weight: 1.0, bgs: ["red"] },                     /* DRESS / TOO + "sharp" en minúscula */
  tracking:  { weight: 1.0, bgs: ["white"] },                   /* S T O P abierto que se apila */
  stack:     { weight: 1.0, bgs: ["white"] },                   /* THAT ×7 que se abre y colapsa */
  outline:   { weight: 1.0, bgs: ["white"] },                   /* CHAT WITH THE en contorno ×6 */
  band:      { weight: 0.9, bgs: ["white"] },                   /* franja negra con WALKING */
  duo:       { weight: 1.0, bgs: ["black"] },                   /* ZERO DEGREES + barra */
  side:      { weight: 0.9, bgs: ["black"] },                   /* WITH grande + THE POISE ×3 */
  scatter:   { weight: 0.9, bgs: ["black", "white"] },          /* BOYS' + copias dispersas */
  dash:      { weight: 0.9, bgs: ["white"] },                   /* — YOU WANNA / TOUCH */
  split:     { weight: 0.8, bgs: ["white", "black"] }           /* C A G E mitad contorno */
};

async function loadDB() {
  try {
    const r = await fetch("config.json");
    if (r.ok) return await r.json();
  } catch (e) {}
  try {
    const r = await fetch("assets/config.json");
    if (r.ok) return await r.json();
  } catch (e) {}
  console.warn("config.json no disponible (fetch bloqueado o ausente) — usando DEFAULT_CONFIG embebido");
  return DEFAULT_CONFIG;
}

const DB = await loadDB();
const RAW = DB.configs.find(c => c.id === ACTIVE_ID)
         || DB.configs.find(c => c.id === DB.activeId)
         || DB.configs[0];
/* merge superficial por bloque contra los defaults, así un config parcial
   (el que devuelve la IA) nunca rompe el motor */
const D = DEFAULT_CONFIG.configs[0];
const C = { ...D, ...RAW };
for (const k of ["fonts", "colors", "intro", "outro", "timing", "scenes", "mosaic", "texture", "debug"])
  C[k] = { ...D[k], ...(RAW[k] || {}) };
C.intro.labels = { ...D.intro.labels, ...(RAW.intro?.labels || {}) };
C.layouts = {};
for (const [k, v] of Object.entries(BASE_LAYOUTS)) C.layouts[k] = { ...v, ...((RAW.layouts || {})[k] || {}) };
const STOP = new Set([...BASE_STOP, ...(C.scenes.stopwords || [])].map(s => s.toLowerCase()));

(function applyTheme(C) {
  const root = document.documentElement;
  if (C.fonts?.googleUrl) {
    const link = document.querySelector('link[href^="https://fonts.googleapis.com/css2"]');
    if (link && link.href !== C.fonts.googleUrl) link.href = C.fonts.googleUrl;
  }
  if (C.fonts?.extended)     root.style.setProperty("--fExt", C.fonts.extended);
  if (C.fonts?.condensed)    root.style.setProperty("--fCond", C.fonts.condensed);
  if (C.fonts?.condensedAlt) root.style.setProperty("--fCond2", C.fonts.condensedAlt);
  if (C.colors?.primary)     root.style.setProperty("--red", C.colors.primary);
  if (C.colors?.dark)        root.style.setProperty("--dark", C.colors.dark);
  if (C.colors?.light)       root.style.setProperty("--light", C.colors.light);
})(C);
/* ======================================================================== */

const doc = document, $ = id => doc.getElementById(id);
const stage = $("stage"), audio = $("audio"), meas = $("measure"), hud = $("hud");
const QS = new URLSearchParams(location.search);
const FROZEN = QS.has("t") ? parseFloat(QS.get("t")) : null;   /* ?t=SEG → cuadro congelado */
const DEBUG = C.debug.enabled || QS.get("debug") === "1";
let vw = innerWidth, vh = innerHeight;

function mulberry32(a) { return function() {
  a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const U = s => s.toUpperCase();

/* ---- paletas por fondo ---- */
const COL = C.colors;
const PAL = {
  red:   { name: "red",   bg: COL.primary, ink: COL.light, acc: COL.dark,    ghost: "rgba(0,0,0,0.16)" },
  white: { name: "white", bg: COL.light,   ink: COL.dark,  acc: COL.primary, ghost: "rgba(0,0,0,0.10)" },
  black: { name: "black", bg: COL.dark,    ink: COL.light, acc: COL.primary, ghost: "rgba(255,255,255,0.13)" }
};

/* ============================ TEXTURAS ================================== */
/* generadas una vez con semilla: grano, moteado de fotocopia oscuro y claro */
const texRng = mulberry32(C.seed * 31 + 5);
function valueNoise(size, cell) {
  const g = Math.max(1, Math.round(size / cell)), grid = new Float32Array(g * g).map(() => texRng());
  const at = (a, b) => grid[((b % g + g) % g) * g + ((a % g + g) % g)];
  return (x, y) => {
    const gx = x / (size / g), gy = y / (size / g), x0 = Math.floor(gx), y0 = Math.floor(gy);
    const fx = gx - x0, fy = gy - y0, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const a = at(x0, y0), b = at(x0 + 1, y0), c = at(x0, y0 + 1), d = at(x0 + 1, y0 + 1);
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  };
}
function makeTile(size, pix) {
  const cv = doc.createElement("canvas"); cv.width = cv.height = size;
  const cx = cv.getContext("2d"), im = cx.createImageData(size, size), d = im.data;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const [r, g, b, a] = pix(x, y), i = (y * size + x) * 4;
    d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = a;
  }
  cx.putImageData(im, 0, 0);
  return `url(${cv.toDataURL()})`;
}
function speckle(rgb) {
  const n1 = valueNoise(384, 96), n2 = valueNoise(384, 24), n3 = valueNoise(384, 6);
  return makeTile(384, (x, y) => {
    const p = n1(x, y) * 0.55 + n2(x, y) * 0.3 + n3(x, y) * 0.15;
    const dens = clamp((p - 0.42) / 0.3, 0, 1);
    const on = texRng() < dens * dens * 0.7;
    return [rgb[0], rgb[1], rgb[2], on ? 150 + texRng() * 105 : 0];
  });
}
const TEX = {
  /* grano con alfa (composición normal, sin mix-blend: barato en headless) */
  grain: makeTile(192, () => { const v = texRng() < 0.5 ? 0 : 255; return [v, v, v, texRng() * 255]; }),
  speckDark: speckle([20, 20, 20]),
  speckLight: speckle([235, 235, 235]),
  speckRed: speckle([90, 0, 0])
};

function xgridImg(color, cell) {
  const s = `<svg xmlns='http://www.w3.org/2000/svg' width='${cell}' height='${cell}'><path d='M${cell*0.22} ${cell*0.22}L${cell*0.72} ${cell*0.72}M${cell*0.72} ${cell*0.22}L${cell*0.22} ${cell*0.72}' stroke='${color}' stroke-width='${Math.max(1, cell*0.12)}'/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(s)}")`;
}

/* ============================ MEDICIÓN ================================== */
const measCache = new Map();
function measure(text, cls, ls = 0) {
  const key = cls + "|" + ls + "|" + text;
  let m = measCache.get(key);
  if (!m) {
    meas.className = "tx " + cls;
    meas.style.letterSpacing = ls + "em";
    meas.textContent = text;
    const r = meas.getBoundingClientRect();
    m = { w: Math.max(1, r.width), h: Math.max(1, r.height) };
    measCache.set(key, m);
  }
  return m;
}
/* tamaño de fuente (px) para que `text` quepa en maxW × maxH */
function fit(text, cls, ls, maxW, maxH) {
  const m = measure(text, cls, ls);
  return 100 * Math.min(maxW / m.w, maxH / m.h);
}
const textW = (text, cls, ls, fs) => measure(text, cls, ls).w * fs / 100;

/* ============================ TIMELINE ================================== */
/* cada escena registra Web Animations en pausa; seek(t) las posiciona */
class TL {
  constructor() { this.list = []; }
  add(el, kf, t, d, easing = "linear") {
    const a = el.animate(kf, { delay: Math.max(0, t) * 1000, duration: Math.max(0.001, d) * 1000, fill: "both", easing });
    a.pause(); this.list.push(a); return a;
  }
  seek(s) { const ms = Math.max(0, s) * 1000; for (const a of this.list) a.currentTime = ms; }
  cancel() { for (const a of this.list) a.cancel(); this.list = []; }
}
/* regla: cada elemento lleva a lo sumo UNA animación de opacity (show/pop/type)
   y la desaparición usa visibility (hideAt), así no se pisan los fill:both */
/* en t<=0 no se anima: el primer cuadro de cada corte ya trae el texto (sin parpadeo) */
const show = (tl, el, t) => { if (t > 0.001) tl.add(el, [{ opacity: 0 }, { opacity: 1 }], t, 0.001); };
const hideAt = (tl, el, t) => tl.add(el, [{ visibility: "visible" }, { visibility: "hidden" }], t, 0.001);
const pop = (tl, el, t, from = 1.1, d = 0.18) => {
  show(tl, el, t);
  tl.add(el, [{ transform: `scale(${from})` }, { transform: "scale(1)" }], t, d, "cubic-bezier(.2,.8,.2,1)");
};
function typeChars(tl, chars, t0, span, r, wordRt) {
  const order = chars.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  order.forEach((ci, k) => {
    let t = t0 + span * k / Math.max(1, order.length);
    if (wordRt) t = Math.max(t, wordRt[chars[ci].wi] || 0);
    show(tl, chars[ci], t);
  });
}
function wipeX(tl, el, t, d = 0.2, origin = "left") {
  el.style.transformOrigin = origin + " center";
  tl.add(el, [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], t, d, "cubic-bezier(.3,.9,.2,1)");
}

/* ============================ PRIMITIVAS ================================ */
function div(parent, cls, css) {
  const d = doc.createElement("div");
  if (cls) d.className = cls;
  if (css) Object.assign(d.style, css);
  parent.appendChild(d);
  return d;
}
/* texto posicionado: (x,y) es el punto de ancla (ax, ay ∈ 0..1 del propio texto).
   split: "chars" → .ch por letra (con .wi = índice de palabra) · "words" → span por palabra */
function T(parent, text, o) {
  const box = div(parent, "bx");
  const sy = o.sy || 1;
  box.style.left = o.x + "px"; box.style.top = o.y + "px";
  box.style.transform = `translate(${-(o.ax ?? 0.5) * 100}%, ${-(o.ay ?? 0.5) * 100}%)` + (sy !== 1 ? ` scaleY(${sy})` : "");
  const el = div(box, "tx " + (o.cls || "sans"));
  el.style.fontSize = o.fs + "px";
  if (o.ls) el.style.letterSpacing = o.ls + "em";
  if (o.stroke) {
    el.style.color = "transparent";
    el.style.webkitTextStroke = `${Math.max(1, o.fs * (o.sw || 0.018))}px ${o.color}`;
  } else el.style.color = o.color;
  const chars = [], words = [];
  if (o.split === "chars") {
    let wi = 0;
    for (const c of text) {
      const s = doc.createElement("span"); s.className = "ch"; s.textContent = c; s.wi = wi;
      if (c === " ") wi++;
      el.appendChild(s); chars.push(s);
    }
  } else if (o.split === "words") {
    text.split(" ").forEach((w, i) => {
      if (i) el.appendChild(doc.createTextNode(" "));
      const s = doc.createElement("span"); s.textContent = w; el.appendChild(s); words.push(s);
    });
  } else el.textContent = text;
  return { box, el, chars, words };
}
/* etiqueta: caja de color con texto, entra con barrido desde la izquierda */
function label(parent, text, o) {
  const w = div(parent, "lab", { left: o.x + "px", top: o.y + "px", transform: "translateY(-50%)" });
  const inner = div(w, "", { background: o.bg, color: o.color, fontSize: o.fs + "px", letterSpacing: (o.ls ?? 0.02) + "em" });
  inner.textContent = text;
  return { box: w, el: inner };
}
function xgrid(parent, x, y, w, h, color, u) {
  const cell = Math.max(5, Math.round(15 * u));
  return div(parent, "patch", {
    left: x + "px", top: y + "px", width: w + "px", height: h + "px",
    backgroundImage: xgridImg(color, cell), backgroundSize: `${cell}px ${cell}px`
  });
}
function bar(parent, x, y, w, h, color) {
  return div(parent, "patch", { left: x + "px", top: y + "px", width: w + "px", height: h + "px", background: color });
}

/* fondo: color + parches (moteado de fotocopia / bloques) estáticos por escena */
function decorate(root, pal, W, H, r, lite) {
  root.style.background = pal.bg;
  if (lite) {   /* celda de mosaico: un solo parche, sin grano (pintado barato) */
    if (pal.name === "white" && C.texture.patches)
      div(root, "patch", { left: W * 0.55 + "px", top: H * 0.45 + "px", width: W * 0.45 + "px", height: H * 0.55 + "px", background: "#EDEDED" });
    return;
  }
  if (C.texture.grain > 0) div(root, "patch", {
    left: 0, top: 0, width: "100%", height: "100%", backgroundImage: TEX.grain,
    backgroundPosition: `${Math.floor(r() * 192)}px ${Math.floor(r() * 192)}px`, opacity: C.texture.grain
  });
  if (!C.texture.patches) return;
  const P = (css) => div(root, "patch", css);
  const rect = (wf, hf, corner) => {
    const w = W * wf, h = H * hf;
    const cx = corner % 2 ? W - w * (0.6 + r() * 0.5) : -w * r() * 0.3;
    const cy = corner < 2 ? -h * r() * 0.3 : H - h * (0.6 + r() * 0.5);
    return { left: cx + "px", top: cy + "px", width: w + "px", height: h + "px" };
  };
  const tile = Math.round(Math.max(160, Math.min(W, H) * 0.55)) + "px";
  if (pal.name === "white") {
    P({ ...rect(0.3 + r() * 0.2, 0.45 + r() * 0.3, 3), background: "#EDEDED" });
    P({ ...rect(0.3 + r() * 0.15, 0.3 + r() * 0.25, 0), backgroundImage: TEX.speckDark, backgroundSize: tile, opacity: 0.55 });
    if (r() < 0.6) P({ ...rect(0.25, 0.3, 3), backgroundImage: TEX.speckDark, backgroundSize: tile, opacity: 0.35 });
  } else if (pal.name === "red") {
    P({ ...rect(0.35 + r() * 0.2, 0.4 + r() * 0.3, Math.floor(r() * 4)), background: "rgba(0,0,0,0.07)" });
    P({ ...rect(0.25 + r() * 0.2, 0.3 + r() * 0.3, Math.floor(r() * 4)), background: "rgba(255,255,255,0.035)" });
    P({ left: 0, top: 0, width: "100%", height: "100%", backgroundImage: TEX.speckRed, backgroundSize: tile, opacity: 0.22 });
  } else {
    P({ ...rect(0.35 + r() * 0.2, 0.4 + r() * 0.3, Math.floor(r() * 4)), background: "rgba(255,255,255,0.035)" });
    P({ left: 0, top: 0, width: "100%", height: "100%", backgroundImage: TEX.speckLight, backgroundSize: tile, opacity: 0.1 });
    for (let i = 0; i < 2; i++)
      P({ left: r() * W + "px", top: r() * H + "px", width: (0.04 + r() * 0.1) * W + "px", height: "1px",
          background: "rgba(255,255,255,0.18)", transform: `rotate(${(r() - 0.5) * 50}deg)` });
  }
}

/* ============================ LAYOUTS =================================== */
/* firma: (sc, S, tl, r, p) — sc = escena { words:[{text, rt}], hero, heroIdx,
   text, dur }, S = { el, W, H, u }, p = paleta. Todo en px del escenario. */
const others = sc => sc.words.filter((_, i) => i !== sc.heroIdx).map(w => U(w.text));
const wordRts = sc => sc.words.map(w => w.rt);
const FITS = {
  giant:     sc => sc.hero.length <= 8,
  type:      () => true,
  editorial: sc => sc.words.length >= 2 && sc.text.length <= 28 && isContent(sc.words[0]),
  build:     sc => sc.words.length >= 3,
  mirror:    sc => sc.text.length <= 16 || sc.hero.length <= 8,
  sandwich:  sc => sc.words.length >= 3 && sc.text.length <= 30 && isContent(sc.words[0]),
  pair:      sc => sc.words.length >= 2 && sc.words.length <= 4 && sc.words.slice(0, 2).some(isContent) && (sc.words.length >= 3 || sc.words.every(isContent)),
  tracking:  sc => sc.hero.length <= 6 && sc.words.length <= 3,
  stack:     sc => sc.hero.length <= 6 && sc.words.length <= 2,
  outline:   sc => sc.words.length >= 2 && sc.text.length <= 22,
  band:      () => true,
  duo:       sc => sc.words.length >= 2 && sc.words.length <= 3 && sc.text.length <= 20,
  side:      sc => sc.words.length >= 2 && sc.words.length <= 4 && sc.words[0].text.length <= 7 && isContent(sc.words[0]),
  scatter:   sc => sc.hero.length <= 8 && sc.words.length <= 2,
  dash:      sc => sc.words.length <= 3,
  split:     sc => sc.hero.length >= 3 && sc.hero.length <= 7 && sc.words.length <= 2
};

const L = {};

L.giant = (sc, S, tl, r, p) => {
  const { W, H, u } = S, hw = U(sc.hero);
  const col = p.name === "red" ? COL.dark : p.name === "white" ? p.acc : (r() < 0.5 ? p.ink : p.acc);
  const ls = hw.length <= 3 ? 0.16 : hw.length <= 5 ? 0.07 : 0.01;
  const fs = fit(hw, "cond", ls, 0.95 * W, 0.66 * H / 0.86);
  const sy = clamp((0.84 * H) / (fs * 0.86), 1, 1.55);
  const o = T(S.el, hw, { cls: "cond", fs, x: W / 2, y: H / 2, color: col, ls, sy });
  pop(tl, o.el, 0, 1.08, 0.2);
  let wi = -1;
  sc.words.forEach((w, i) => { if (i !== sc.heroIdx && (wi < 0 || w.text.length > sc.words[wi].text.length)) wi = i; });
  if (wi >= 0) {
    const lab = label(S.el, U(sc.words[wi].text), {
      x: W * (0.06 + r() * 0.16), y: H * (0.47 + r() * 0.08), fs: 30 * u,
      bg: p.name === "white" ? COL.dark : COL.light, color: p.name === "white" ? COL.light : COL.dark, ls: 0.22
    });
    tl.add(lab.el, [{ transform: "translateX(-101%)" }, { transform: "translateX(0)" }],
           Math.max(0.08, sc.words[wi].rt), 0.2, "cubic-bezier(.2,.9,.2,1)");
  }
  if (r() < 0.6) {
    const tt = (U(sc.text) + "        ").repeat(14);
    for (const y of [0.05 * H, 0.95 * H]) {
      const k = T(S.el, tt, { cls: "sans", fs: 13 * u, x: -0.02 * W, y, ax: 0, color: p.name === "red" ? COL.light : p.ink, ls: 0.03 });
      tl.add(k.el, [{ transform: "translateX(0)" }, { transform: `translateX(${-0.1 * W}px)` }], 0, sc.dur);
    }
  }
};

L.type = (sc, S, tl, r, p) => {
  const { W, H, u } = S;
  const full = sc.text.length <= 16, txt = U(full ? sc.text : sc.hero);
  const fs = fit(txt, "cond2", 0.03, 0.66 * W, 0.24 * H);
  const o = T(S.el, txt, { cls: "cond2", fs, x: W * (0.46 + r() * 0.08), y: H * (0.46 + r() * 0.08), color: p.ink, ls: 0.03, split: "chars" });
  typeChars(tl, o.chars, 0, 0.2, r, full ? wordRts(sc) : null);
  tl.add(o.el, [{ letterSpacing: "0.02em", transform: "translateX(-1.5%)" },
                { letterSpacing: "0.1em", transform: "translateX(1.5%)" }], 0, sc.dur);
  const spots = [[0.1, 0.1], [0.82, 0.1], [0.12, 0.72], [0.8, 0.84], [0.62, 0.2], [0.3, 0.9]];
  for (let i = spots.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [spots[i], spots[j]] = [spots[j], spots[i]]; }
  const n = 3 + Math.floor(r() * 2);
  for (let i = 0; i < n; i++) {
    const [fx, fy] = spots[i];
    const e = T(S.el, i % 2 ? U(sc.hero) : txt, {
      cls: "cond2", fs: (15 + r() * 9) * u, x: W * fx, y: H * fy, ax: fx > 0.5 ? 1 : 0,
      color: r() < 0.35 ? p.acc : p.ink, ls: 0.04, split: "chars"
    });
    typeChars(tl, e.chars, 0.04 + i * 0.05, 0.22, r);
  }
};

L.editorial = (sc, S, tl, r, p) => {
  const { W, H, u } = S, ws = sc.words;
  const first = U(ws[0].text), rest = ws.slice(1);
  const lf = fit(first, "sans", 0, 0.2 * W, 0.1 * H);
  const left = T(S.el, first, { cls: "sans", fs: lf, x: 0.07 * W, y: 0.66 * H, ax: 0, color: r() < 0.5 ? p.ink : p.acc });
  show(tl, left.el, 0);
  /* resto en dos renglones equilibrados */
  let cut = 1, best = 1e9;
  for (let k = 1; k < rest.length; k++) {
    const a = rest.slice(0, k).map(w => w.text).join(" ").length, b = rest.slice(k).map(w => w.text).join(" ").length;
    if (Math.abs(a - b) < best) { best = Math.abs(a - b); cut = k; }
  }
  const lines = rest.length > 1 ? [rest.slice(0, cut), rest.slice(cut)] : [rest];
  const rf = Math.min(...lines.map(l => fit(U(l.map(w => w.text).join(" ")), "cond2", 0.1, 0.42 * W, 0.13 * H)));
  lines.forEach((l, i) => {
    const o = T(S.el, U(l.map(w => w.text).join(" ")), { cls: "cond2", fs: rf, x: 0.52 * W, y: 0.17 * H + i * rf * 1.02, ax: 0, ay: 0, color: p.ink, ls: 0.1 });
    show(tl, o.box, l[0].rt);
    tl.add(o.el, [{ letterSpacing: "0.34em" }, { letterSpacing: "0.1em" }], l[0].rt, 0.35, "cubic-bezier(.2,.8,.2,1)");
  });
  const barY = 0.17 * H + lines.length * rf * 1.02 + 0.01 * H;
  wipeX(tl, bar(S.el, 0.455 * W, barY, 0.2 * W, 0.034 * H, p.acc), 0.06, 0.18);
  const full = U(sc.text), lsz = Math.min(19 * u, fit(full, "sans", 0.32, 0.36 * W, 1e9));
  const n = 2 + Math.floor(r() * 3), accLast = r() < 0.7;
  for (let i = 0; i < n; i++) {
    const o = T(S.el, full, { cls: "sans", fs: lsz, x: 0.615 * W, y: barY + 0.085 * H + i * lsz * 1.45, ax: 0, color: accLast && i === n - 1 ? p.acc : p.ink, ls: 0.32 });
    show(tl, o.el, 0.1 + i * 0.09);
  }
  const tiny = T(S.el, full, { cls: "sans", fs: 10 * u, x: 0.1 * W, y: 0.06 * H, ax: 0, color: p.ink, ls: 0.14 });
  show(tl, tiny.el, 0);
  wipeX(tl, xgrid(S.el, 0.06 * W, 0.86 * H, 0.2 * W, 0.028 * H, p.acc, u * 0.8), 0.05, 0.25);
};

L.build = (sc, S, tl, r, p) => {
  const { W, H, u } = S, ws = sc.words;
  const total = sc.text.length, perLine = Math.max(7, Math.ceil(total / (total > 16 ? 3 : 2)));
  const lines = [[]];
  for (const w of ws) {
    const cur = lines[lines.length - 1], len = cur.map(x => x.text).join(" ").length;
    if (cur.length && len + 1 + w.text.length > perLine && lines.length < 3) lines.push([w]); else cur.push(w);
  }
  const fs = Math.min(...lines.map(l => fit(U(l.map(w => w.text).join(" ")), "ext", 0.01, 0.64 * W, 0.14 * H)));
  const lh = fs * 0.92, y0 = H / 2 - (lines.length - 1) * lh / 2 - 0.02 * H;
  let wi = 0;
  lines.forEach((l, li) => {
    const o = T(S.el, U(l.map(w => w.text).join(" ")), { cls: "ext", fs, x: W / 2, y: y0 + li * lh, color: p.ink, ls: 0.01, split: "words" });
    o.words.forEach((s, k) => {
      const w = l[k], isLast = wi === ws.length - 1;
      if (isLast) s.style.color = p.acc;
      show(tl, s, w.rt); wi++;
    });
  });
  const blockBottom = y0 + (lines.length - 1) * lh + fs * 0.5;
  show(tl, bar(S.el, 0.11 * W, blockBottom + 0.02 * H, 0.085 * W, 0.07 * H, p.acc), 0.06);
  const full = U(sc.text) + ".";
  for (const [x, y] of [[0.17 * W, y0 - fs * 0.5 - 0.07 * H], [0.18 * W, blockBottom + 0.15 * H]]) {
    const o = T(S.el, full, { cls: "ext", fs: 11 * u, x, y, ax: 0, color: p.acc, ls: 0.02 });
    show(tl, o.el, 0.04);
  }
  wipeX(tl, xgrid(S.el, 0.8 * W, 0.03 * H, 0.14 * W, 0.1 * H, p.ink, u * 0.8), 0.1, 0.3);
};

L.mirror = (sc, S, tl, r, p) => {
  const { W, H } = S, txt = U(sc.text.length <= 16 ? sc.text : sc.hero);
  const col = p.name === "red" ? COL.light : p.acc;
  const fs = fit(txt, "cond", 0.01, 0.64 * W, 0.28 * H);
  const big = fs * 1.2;
  [[-1, "inset(0 0 46% 0)"], [1, "inset(46% 0 0 0)"]].forEach(([dir, clip]) => {
    const o = T(S.el, txt, { cls: "cond", fs: big, x: W / 2, y: H / 2 + dir * fs * 1.02, color: col, ls: 0.01, sy: 1.3 });
    o.el.style.clipPath = clip;
    show(tl, o.box, 0.05);
    tl.add(o.el, [{ transform: "translateY(0)" }, { transform: `translateY(${dir * 4}%)` }], 0, sc.dur);
  });
  const main = T(S.el, txt, { cls: "cond", fs, x: W / 2, y: H / 2, color: col, ls: 0.01 });
  show(tl, main.box, 0.09);
  /* glitch de rebanadas al entrar */
  for (let i = 0; i < 3; i++) {
    const s = T(S.el, txt, { cls: "cond", fs, x: W / 2 + (r() - 0.5) * 0.08 * W, y: H / 2, color: col, ls: 0.01 });
    s.el.style.clipPath = `inset(${i * 33}% 0 ${100 - (i + 1) * 33}% 0)`;
    hideAt(tl, s.box, 0.09);
  }
};

L.sandwich = (sc, S, tl, r, p) => {
  const { W, H } = S, ws = sc.words;
  const top = U(ws[0].text);
  const bi = sc.heroIdx > 0 ? sc.heroIdx : ws.length - 1, bottom = U(ws[bi].text);
  const ft = fit(top, "sans", 0, 0.4 * W, 0.2 * H);
  pop(tl, T(S.el, top, { cls: "sans", fs: ft, x: W / 2, y: 0.2 * H, color: p.ink }).el, 0, 1.06, 0.15);
  const mid = T(S.el, U(sc.text), { cls: "sans", fs: fit(U(sc.text), "sans", 0.02, 0.6 * W, 0.05 * H), x: W / 2, y: 0.5 * H, color: p.ink, ls: 0.02, split: "words" });
  mid.words.forEach((s, i) => show(tl, s, Math.max(0.05, ws[i].rt)));
  const fb = fit(bottom, "nar", 0, 0.36 * W, 0.22 * H);
  pop(tl, T(S.el, bottom, { cls: "nar", fs: fb, x: W / 2, y: 0.8 * H, color: p.acc }).el, Math.max(0.1, ws[bi].rt), 1.06, 0.15);
};

L.pair = (sc, S, tl, r, p) => {
  const { W, H, u } = S, ws = sc.words;
  const big = ws.slice(0, 2), lite = ws.slice(2);
  const col = p.name === "red" ? (r() < 0.5 ? COL.light : COL.dark) : p.ink;
  const fs = Math.min(...big.map(w => fit(U(w.text), "ext", 0.02, 0.42 * W, 0.13 * H)));
  const y0 = 0.42 * H - (big.length - 1) * fs * 0.47;
  big.forEach((w, i) => {
    const o = T(S.el, U(w.text), { cls: "ext", fs, x: 0.52 * W, y: y0 + i * fs * 0.94, ax: 0, color: col, ls: 0.02, split: "chars" });
    typeChars(tl, o.chars, w.rt, 0.08, r);
    const g = T(S.el, U(w.text), { cls: "ext", fs: fs * 0.55, x: 0.62 * W, y: 0.1 * H + i * fs * 0.52, ax: 0, color: p.ghost, stroke: true, sw: 0.03, ls: 0.02 });
    show(tl, g.el, 0);
  });
  if (lite.length) {
    const lt = lite.map(w => w.text.toLowerCase()).join(" ");
    const o = T(S.el, lt, { cls: "lite", fs: Math.min(0.085 * H, fit(lt, "lite", 0, 0.26 * W, 1e9)), x: 0.24 * W, y: 0.64 * H, ax: 0, color: col === COL.dark ? COL.light : col, split: "chars" });
    typeChars(tl, o.chars, lite[0].rt, 0.14, r);
  }
  const c1 = T(S.el, U(big[0].text), { cls: "ext", fs: 12 * u, x: 0.05 * W, y: 0.05 * H, ax: 0, color: p.ink, stroke: true, sw: 0.05 });
  const c2 = T(S.el, U(ws[ws.length - 1].text), { cls: "ext", fs: 12 * u, x: 0.05 * W, y: 0.95 * H, ax: 0, color: p.ink, stroke: true, sw: 0.05 });
  show(tl, c1.el, 0.05); show(tl, c2.el, 0.1);
};

L.tracking = (sc, S, tl, r, p) => {
  const { W, H } = S, hw = U(sc.hero);
  const col = p.name === "red" ? p.ink : p.acc;
  const fs = fit(hw, "cond", 0.8, 0.62 * W, 0.3 * H);
  const big = T(S.el, hw, { cls: "cond", fs, x: W / 2, y: H / 2, color: col, ls: 0.8 });
  const tB = Math.min(sc.dur * 0.45, 0.5);
  tl.add(big.el, [{ letterSpacing: "1.05em" }, { letterSpacing: "0.78em" }], 0, tB, "ease-out");
  hideAt(tl, big.box, tB);
  const rest = others(sc);
  const f2 = fs * 0.42, f3 = f2 * 0.5;
  const rows = [[rest[0] || hw, f3, false], [hw, f2, true], [hw, f2, true], [hw, f2, true], [rest[1] || rest[0] || hw, f3, false]];
  const total = rows.reduce((a, [, f]) => a + f * 0.98, 0);
  let y = H / 2 - total / 2;
  rows.forEach(([txt, f, isHero], i) => {
    y += f * 0.49;
    const o = T(S.el, txt, { cls: "cond", fs: f, x: W / 2, y, color: isHero ? col : (p.name === "white" ? p.ink : p.ink), ls: isHero ? 0.5 : 0.55 });
    show(tl, o.el, tB + i * 0.025);
    y += f * 0.49;
  });
};

L.stack = (sc, S, tl, r, p) => {
  const { W, H } = S, hw = U(sc.hero), n = 7;
  const fs = fit(hw, "cond2", 0.02, 0.3 * W, (0.84 * H / n) / 0.86), lh = fs * 0.86;
  const tB = Math.min(sc.dur * 0.45, 0.55);
  const lines = [];
  for (let i = 0; i < n; i++) {
    const o = T(S.el, hw, { cls: "cond2", fs, x: W / 2, y: H / 2 + (i - (n - 1) / 2) * lh, color: p.ink, ls: 0.02 });
    show(tl, o.el, i * 0.03);
    lines.push(o);
  }
  const mid = (n - 1) / 2;
  lines.forEach((o, i) => {
    const d = Math.abs(i - mid);
    if (d === 3) hideAt(tl, o.box, tB);
    else if (d === 2) hideAt(tl, o.box, tB + 0.16);
    else if (d === 1) hideAt(tl, o.box, tB + 0.32);
    if (d < 3) tl.add(o.el, [{ letterSpacing: "0.02em", transform: "scale(1)" },
                             { letterSpacing: "0.6em", transform: d === 0 ? "scale(0.62)" : "scale(0.85)" }],
                      tB, Math.max(0.3, sc.dur - tB), "cubic-bezier(.2,.8,.2,1)");
  });
};

L.outline = (sc, S, tl, r, p) => {
  const { W, H } = S, txt = U(sc.text), n = 6;
  const fs = fit(txt, "ext", 0.3, 0.54 * W, 0.075 * H), lh = fs * 1.08;
  const y0 = H / 2 - (n - 1) / 2 * lh;
  const sCol = p.name === "white" ? p.acc : p.ink;
  for (let i = 0; i < n; i++) {
    const o = T(S.el, txt, { cls: "ext", fs, x: W / 2, y: y0 + i * lh, color: sCol, stroke: true, sw: 0.03, ls: 0.3 });
    show(tl, o.el, i * 0.035);
  }
  const solid = T(S.el, txt, { cls: "ext", fs, x: W / 2, y: y0, color: p.ink, ls: 0.3 });
  const red = T(S.el, txt, { cls: "ext", fs, x: W / 2, y: y0 + (n - 2) * lh, color: p.acc, ls: 0.3 });
  show(tl, red.el, 0.18);
  const steps = Math.max(2, Math.floor(sc.dur / 0.14)), kf = [];
  for (let k = 0; k <= steps; k++) kf.push({ transform: `translateY(${(k % n) * lh}px)`, easing: "steps(1, end)" });

};

L.band = (sc, S, tl, r, p) => {

L.dash = (sc, S, tl, r, p) => {

  });

/* ============================ ESCENAS =================================== */
function buildScene(sc, W, H, lite = false) {
  const r = mulberry32((C.seed * 7919 + sc.idx * 104729 + (sc.variant || 0) * 131) >>> 0);
  const pal = PAL[sc.bg] || PAL.white;
  const root = doc.createElement("div");
  root.className = "scene";
  root.style.width = W + "px"; root.style.height = H + "px";
  decorate(root, pal, W, H, r, lite);
  const cam = div(root, "layer");
  const tl = new TL();
  const S = { el: cam, W, H, u: Math.min(W, H) / 1080 };
  try { L[sc.layout](sc, S, tl, r, pal); }
  catch (e) { console.warn("[caution] layout falló", sc.layout, e); L.type(sc, S, tl, r, pal); }
  if (sc.layout !== "giant")
    tl.add(cam, [{ transform: "scale(1)" }, { transform: `scale(${1 + C.scenes.pushScale})` }], 0, Math.max(0.2, sc.dur));
  /* salida: algunas letras se apagan en los últimos cuadros antes del corte */
  const chars = [...cam.querySelectorAll(".ch")];
  if (sc.kind === "card" || (chars.length && r() < C.scenes.dropOutChance)) {
    for (const ch of chars) if (r() < 0.45) hideAt(tl, ch, Math.max(0.05, sc.dur - 0.04 - r() * 0.12));
  }
  return { root, seek: t => tl.seek(t), dispose: () => tl.cancel() };
}

/* mosaico 4×4 de escenas pasadas, cada celda en loop y rotando */
function buildMosaic(sc, W, H) {
  const M = C.mosaic, cols = M.cols, rows = M.rows, cw = W / cols, ch = H / rows;
  const root = doc.createElement("div");
  root.className = "scene";
  root.style.width = W + "px"; root.style.height = H + "px"; root.style.background = COL.dark;
  const grid = div(root, "layer");
  const pool = sc.pool.length ? sc.pool : [{ ...sc, layout: "type", bg: "black" }];
  const cells = [];
  for (let i = 0; i < cols * rows; i++) {
    const host = div(grid, "", { position: "absolute", left: (i % cols) * cw + "px", top: Math.floor(i / cols) * ch + "px", width: cw + "px", height: ch + "px", overflow: "hidden" });
    cells.push({ host, key: -1, built: null, phase: (i * 0.137) % 1, period: M.swapSec * (2 + (i * 7) % 5) });
  }
  const pulse = new TL();
  pulse.add(grid, [{ transform: "scale(1.12)" }, { transform: "scale(1)" }], 0, 0.22, "cubic-bezier(.2,.8,.2,1)");
  return {
    root,
    seek(t) {
      pulse.seek(t);
      cells.forEach((c, i) => {
        const k = Math.floor(Math.max(0, t) / c.period + c.phase);
        const key = (i * 5 + k * 3) % pool.length;
        if (key !== c.key) {
          if (c.built) { c.built.dispose(); c.built.root.remove(); }
          c.built = buildScene({ ...pool[key], variant: i + 1 }, cw, ch, true);
          c.host.appendChild(c.built.root);
          c.key = key;
        }
        const lt = t - (k - c.phase) * c.period;
        c.built.seek(lt % Math.max(0.3, pool[key].dur));
      });
    },
    dispose() { pulse.cancel(); cells.forEach(c => c.built && c.built.dispose()); }
  };
}

/* ---- letra → palabras planas ---- */
const cleanWord = s => s.trim().replace(/[.,;:!?¡¿"“”()\[\]]/g, "").replace(/[`´]/g, "'");
async function loadLyrics() {
  try {
    const r = await fetch(C.lyricsUrl);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const out = [];
    for (const seg of j.segments) for (const w of seg.words) {
      const text = cleanWord(w.word);
      if (text) out.push({ t: w.start, end: w.end ?? w.start + 0.3, text });
    }
    if (!out.length) throw new Error("lyrics.json sin palabras");
    return { words: out, meta: j.metadata || {} };
  } catch (e) {
    console.warn("[caution] No se pudo cargar", C.lyricsUrl, "— sirve el HTML por HTTP, no por file://.", e);
    return { words: [], meta: {} };
  }
}

const isContent = w => !STOP.has(w.text.toLowerCase().replace(/’/g, "'"));
function groupScenes(flat, r) {
  const P = C.scenes, out = [];
  let cur = null;
  for (const w of flat) {
    const c = isContent(w);
    if (cur) {
      const dt = w.t - cur.t0, gap = w.t - cur.lastT;
      const brk = cur.words.length >= P.maxWords || cur.chars + 1 + w.text.length > P.maxChars ||
                  gap > P.gapSec || dt >= P.maxSec || (c && cur.content >= cur.target && dt >= P.minSec);
      if (!brk) { cur.words.push(w); cur.chars += 1 + w.text.length; cur.lastT = w.t; if (c) cur.content++; continue; }
      /* las palabras funcionales del final ("the", "I") se van con la palabra
         fuerte que las sigue: "I HEAR" | "I'M CHATTIN" | "THE NOISE" */
      let carry = [];
      {
        while (cur.words.length > 1 && !isContent(cur.words[cur.words.length - 1]) &&
               w.t - cur.words[cur.words.length - 1].t < P.maxSec * 0.8) carry.unshift(cur.words.pop());
        /* escena sin palabra fuerte: entera a la siguiente si cabe, si no se queda */
        if (!cur.words.some(isContent)) {
          if (cur.words.length + carry.length < P.maxWords + 1) { carry = [...cur.words, ...carry]; cur.words = []; }
          else { cur.words.push(...carry); carry = []; }
        }
      }
      if (cur.words.length) out.push(cur);
      if (carry.length) {
        const ws = [...carry, w];
        cur = { t0: ws[0].t, words: ws, chars: ws.map(x => x.text).join(" ").length, lastT: w.t, content: ws.filter(isContent).length, target: r() < 0.8 ? 1 : 2 };
        continue;
      }
    }
    cur = { t0: w.t, words: [w], chars: w.text.length, lastT: w.t, content: c ? 1 : 0, target: r() < 0.8 ? 1 : 2 };
  }
  if (cur) out.push(cur);
  /* cortes demasiado cortos (< 0.3 s) se funden con la escena siguiente */
  for (let i = out.length - 2; i >= 0; i--) {
    if (out[i + 1].t0 - out[i].t0 >= 0.3) continue;
    const prev = out[i - 1], next = out[i + 1];
    if (prev && prev.words.length < next.words.length && out[i].t0 - prev.t0 < P.maxSec) prev.words.push(...out[i].words);
    else { next.words = [...out[i].words, ...next.words]; next.t0 = out[i].t0; }
    out.splice(i, 1);
  }
  return out;
}
function pickHero(words) {
  let idx = -1;
  words.forEach((w, i) => { if (isContent(w) && (idx < 0 || w.text.length >= words[idx].text.length)) idx = i; });
  if (idx < 0) words.forEach((w, i) => { if (idx < 0 || w.text.length > words[idx].text.length) idx = i; });
  return idx;
}

/* arma la lista completa de escenas [t0, t1) para toda la canción */
function buildTimeline(flat, dur) {
  const r = mulberry32(C.seed * 977 + 3), lead = C.timing.leadSec, P = C.scenes;
  const list = [];
  const mk = (kind, t0, t1, words, extra = {}) => {
    const ws = words.map(w => ({ text: w.text, rt: kind === "lyric" ? Math.max(0, w.t - lead - t0) : 0 }));
    const heroIdx = ws.length ? pickHero(ws) : 0;
    return { kind, t0, t1, words: ws, heroIdx, hero: ws.length ? ws[heroIdx].text : "", text: ws.map(w => w.text).join(" "), ...extra };
  };
  const groups = groupScenes(flat, r);
  const lastW = flat[flat.length - 1];

  /* outro: tarjetas al final si queda aire después de la última palabra */
  let tOut = dur;
  const outroCards = [C.outro.title, C.outro.sub, C.outro.feats].filter(Boolean);
  if (C.outro.enabled && outroCards.length) {
    const t = Math.max(dur - C.outro.leadSec, lastW.end + 0.35);
    if (dur - t >= 0.8) tOut = t;
  }

  /* mosaico: el último silencio instrumental largo del tramo final (o atSec) */
  let mos = null;
  if (C.mosaic.enabled) {
    if (C.mosaic.atSec != null) mos = [C.mosaic.atSec, Math.min(tOut, C.mosaic.atSec + C.mosaic.maxSec)];
    else for (let i = flat.length - 2; i >= 0; i--) {
      if (flat[i].t < dur * (1 - C.mosaic.tailFraction)) break;
      const a = flat[i].end + 0.15, b = flat[i + 1].t - lead;
      if (b - a >= C.mosaic.minGapSec) { mos = [Math.max(a, b - C.mosaic.maxSec), b]; break; }
    }
  }

  /* intro: tarjetas (artista / título / álbum) + adelanto de la última frase */
  const firstT = Math.max(0, groups[0].t0 - lead);
  let introEnd = 0;
  const ic = C.intro, cards = [];
  if (ic.artist) cards.push([U(ic.artist), ic.labels.artist]);
  if (ic.title) cards.push([`“${U(ic.title)}”`, ic.labels.title]);
  if (ic.album) cards.push([U(ic.album), ic.labels.album]);
  if (firstT >= 0.5) {
    let n = cards.length;
    while (n > 0 && firstT / n < 0.45) n--;
    const cs = n ? Math.min(ic.cardSec, firstT / n) : 0;
    for (let i = 0; i < n; i++)
      list.push(mk("card", i * cs, (i + 1) * cs, [], { cardText: cards[i][0], cardLabel: cards[i][1], layout: "card", bg: "red" }));
    introEnd = n * cs;
    if (firstT - introEnd >= 0.4) {
      const teaser = groups.slice(-2).flatMap(g => g.words).slice(-4);
      /* un cartón por palabra fuerte del adelanto (STOP → THAT en el demo) */
      const k = Math.max(1, Math.min(teaser.length, Math.round((firstT - introEnd) / (P.echoSec * 0.6))));
      for (let i = 0; i < k; i++) {
        const a = introEnd + (firstT - introEnd) * i / k, b = introEnd + (firstT - introEnd) * (i + 1) / k;
        const part = teaser.slice(Math.floor(i * teaser.length / k), Math.floor((i + 1) * teaser.length / k));
        list.push(mk("echo", a, b, part.length ? part : teaser));
      }
    }
  }

  /* escenas de letra */
  groups.forEach((g, gi) => {
    let t0 = gi === 0 && firstT < 0.5 ? 0 : Math.max(0, g.t0 - lead);
    const next = groups[gi + 1];
    let t1 = next ? Math.max(0, next.t0 - lead) : tOut;
    if (mos && t0 < mos[0] && t1 > mos[0]) t1 = mos[0];
    if (mos && t0 >= mos[0] && t0 < mos[1]) t0 = mos[1];
    t1 = Math.min(t1, tOut);
    if (t1 - t0 < 0.08) return;
    /* aguante largo (silencio sin letra): se parte en ecos con otro layout */
    const d = t1 - t0;
    const k = d > P.maxHoldSec ? Math.max(2, Math.round(d / P.echoSec)) : 1;
    for (let i = 0; i < k; i++) {
      const a = t0 + d * i / k, b = t0 + d * (i + 1) / k;
      const sc = mk(i === 0 ? "lyric" : "echo", a, b, g.words);
      if (i === 0) sc.words.forEach((w, wi) => { w.rt = Math.max(0, g.words[wi].t - lead - a); });
      list.push(sc);
    }
  });
  if (mos) list.push({ kind: "mosaic", t0: mos[0], t1: mos[1], words: [], text: "", hero: "", heroIdx: 0 });
  if (tOut < dur) {
    const n = Math.max(1, Math.min(outroCards.length, Math.floor((dur - tOut) / 0.7)));
    const cs = (dur - tOut) / n;
    for (let i = 0; i < n; i++)
      list.push(mk("card", tOut + i * cs, tOut + (i + 1) * cs, [], { cardText: U(outroCards[i]), cardLabel: C.outro.title, layout: "card", bg: "red" }));
  }
  list.sort((a, b) => a.t0 - b.t0);

  /* layouts + fondos: mazo ponderado, sin repetir los últimos `cooldown` */
  const recent = [];
  let prevBg = "";
  list.forEach((sc, i) => {
    sc.idx = i; sc.dur = sc.t1 - sc.t0;
    if (sc.kind === "card" || sc.kind === "mosaic") { prevBg = sc.bg || prevBg; return; }
    let cands = Object.entries(C.layouts).filter(([k, v]) => v.weight > 0 && FITS[k] && FITS[k](sc) && !recent.includes(k));
    if (!cands.length) cands = [["type", C.layouts.type]];
    let tot = cands.reduce((a, [, v]) => a + v.weight, 0), x = r() * tot, pick = cands[0];
    for (const c of cands) { x -= c[1].weight; if (x <= 0) { pick = c; break; } }
    sc.layout = pick[0];
    const bgs = (pick[1].bgs || ["white"]).filter(b => PAL[b]);
    const fresh = bgs.filter(b => b !== prevBg);
    const bgPool = fresh.length && r() < 0.85 ? fresh : bgs;
    sc.bg = bgPool[Math.floor(r() * bgPool.length)] || "white";
    prevBg = sc.bg;
    recent.push(sc.layout); if (recent.length > P.cooldown) recent.shift();
  });
  const pool = list.filter(s => s.kind === "lyric");
  list.forEach(sc => { if (sc.kind === "mosaic") sc.pool = pool.filter(s => s.t1 <= sc.t0).slice(-24); });
  return list;
}

/* ============================ RELOJ + LOOP ============================== */
let rafT0 = null, rafNow = 0, started = false, forced = FROZEN;
const clock = () => forced != null ? forced
  : (!audio.paused && audio.currentTime > 0.05) ? audio.currentTime
  : (rafT0 === null ? 0 : (rafNow - rafT0) / 1000);

async function begin() {
  if (started || FROZEN != null) return;
  started = true;
  $("hint").style.display = "none";
  try { await audio.play(); } catch (e) { /* reloj de pared */ }
}
addEventListener("pointerdown", begin, { once: true });

let scenes = [], curIdx = -1, cur = null, nextBuilt = null;
function sceneAt(t) {
  let lo = 0, hi = scenes.length - 1, ans = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (scenes[m].t0 <= t) { ans = m; lo = m + 1; } else hi = m - 1; }
  return ans;
}
const build = sc => sc.kind === "mosaic" ? buildMosaic(sc, vw, vh) : buildScene(sc, vw, vh);
function mount(i) {
  if (cur) { cur.dispose(); cur.root.remove(); }
  cur = (nextBuilt && nextBuilt.i === i) ? nextBuilt.b : build(scenes[i]);
  nextBuilt = null;
  stage.appendChild(cur.root);
  curIdx = i;
  if (i + 1 < scenes.length) {
    const j = i + 1;
    setTimeout(() => { if (curIdx === i && !nextBuilt) nextBuilt = { i: j, b: build(scenes[j]) }; }, 0);
  }
}
function render(t) {
  const i = sceneAt(t);
  if (i >= 0 && scenes[i].t1 > t) {
    if (i !== curIdx) mount(i);
    cur.seek(t - scenes[i].t0);
  } else if (cur && (i < 0 || t >= scenes[i].t1)) { cur.dispose(); cur.root.remove(); cur = null; curIdx = -1; }
  if (DEBUG && i >= 0) {
    const s = scenes[i];
    hud.textContent = `t ${t.toFixed(2)} · #${i} ${s.kind} · ${s.layout || ""} · ${s.bg || ""} · "${s.text || s.cardText || ""}"`;
  }
}
function frame(now) {
  rafNow = now;
  if (rafT0 === null) rafT0 = now;
  render(clock());
  if (FROZEN == null) requestAnimationFrame(frame);
}

/* ---- arranque ---- */
if (DEBUG) hud.style.display = "block";
if (new URLSearchParams(location.search).get("headless") === "1") doc.body.classList.add("headless");
audio.src = encodeURI(C.audio.src);
const fontsReady = Promise.race([
  Promise.all([doc.fonts.load("900 100px Archivo"), doc.fonts.load("100px Anton"), doc.fonts.load("700 100px Oswald")]).then(() => doc.fonts.ready),
  new Promise(res => setTimeout(res, 3000))
]);
const durReady = new Promise(res => {
  if (isFinite(audio.duration) && audio.duration > 0) return res(audio.duration);
  audio.addEventListener("loadedmetadata", () => res(audio.duration), { once: true });
  setTimeout(() => res(NaN), 2500);
});
if (FROZEN == null) begin();
const [{ words: flat, meta }, audioDur] = await Promise.all([loadLyrics(), durReady, fontsReady]).then(([a, b]) => [a, b]);
if (flat.length) {
  const dur = isFinite(audioDur) && audioDur > 0 ? audioDur : (meta.audio_duration_sec || flat[flat.length - 1].end + 4);
  measCache.clear();
  scenes = buildTimeline(flat, dur);
}
addEventListener("resize", () => {
  vw = innerWidth; vh = innerHeight; measCache.clear();
  nextBuilt = null; if (cur) { cur.dispose(); cur.root.remove(); cur = null; curIdx = -1; }
});
window.__caution = {
  scenes: () => scenes,
  seek(t) { forced = t; render(t); },
  release() { forced = null; }
};
requestAnimationFrame(frame);

/* ── Recording UI ──────────────────────────────────────────────────────── */
(function initRecUI() {
  if (new URLSearchParams(location.search).get('headless') === '1') {
    document.body.classList.add('headless'); return;
  }
  const btn    = document.getElementById('rec-btn');
  const panel  = document.getElementById('rec-panel');
  const goBtn  = document.getElementById('rec-go');
  const status = document.getElementById('rec-status');
  if (!btn) return;
  let selectedEngine = null, recording = false;

  function togglePanel() { panel.classList.toggle('open'); }
  btn.addEventListener('click', e => { e.stopPropagation(); togglePanel(); });
  document.addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') togglePanel(); });
  document.addEventListener('click', e => {
    if (!panel.contains(e.target) && e.target !== btn) panel.classList.remove('open');
  });
  document.querySelectorAll('.rec-engine').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.rec-engine').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      selectedEngine = el.dataset.engine;
      goBtn.disabled = false;
      status.textContent = '';
    });
  });
  goBtn.addEventListener('click', async () => {
    if (!selectedEngine || recording) return;
    recording = true;
    btn.classList.add('recording');
    goBtn.disabled = true;
    panel.classList.remove('open');
    status.textContent = 'Iniciando ' + selectedEngine + '…';
    const templateName = location.pathname.split('/').filter(Boolean).slice(-2, -1)[0]
                         || document.title || 'unknown';
    const payload = { engine: selectedEngine, template: templateName, timestamp: Date.now() };
    window.postMessage({ type: 'nexa:record', ...payload }, '*');
    document.dispatchEvent(new CustomEvent('nexa:record', { detail: payload }));
    try {
      const res = await fetch('/api/v1/record', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      status.textContent = res.ok ? (await res.json()).message || ('Grabando con ' + selectedEngine + '…')
                                  : 'API ' + res.status + ' — evento emitido';
    } catch { status.textContent = 'Sin servidor — evento emitido (' + selectedEngine + ')'; }
    setTimeout(() => { recording = false; btn.classList.remove('recording'); goBtn.disabled = false; status.textContent = ''; }, 8000);
  });
})();
/* ─────────────────────────────────────────────────────────────────────────── */
</script>
