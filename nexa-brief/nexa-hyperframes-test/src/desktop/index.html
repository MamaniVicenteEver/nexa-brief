<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <!-- ===== Escena A: 0s - ~6.9s (titular + stat de conteo) ===== -->
      <div id="scene-a" class="scene clip" data-start="0" data-duration="6.9" data-track-index="0">
        <div id="brand-mark" class="brand-mark">
          <div class="brand-dot"></div>
          <div class="brand-text">Nexa Brief</div>
        </div>

        <div id="headline" class="headline">
          Video con <span class="accent">IA</span> en minutos, no en horas
        </div>

        <div id="subtitle" class="subtitle">
          Guion, voz y edición automatizados de punta a punta.
        </div>

        <div class="stat-wrap">
          <div class="counter-line">
            <span id="counter" class="counter">0</span><span id="counter-suffix" class="counter-suffix">×</span>
          </div>
          <div id="stat-label" class="stat-label">Más rápido que editar a mano</div>
        </div>
      </div>

      <!-- ===== Escena B: 6.2s - 15s (barras del pipeline + CTA) ===== -->
      <div id="scene-b" class="scene clip" data-start="6.2" data-duration="8.8" data-track-index="1">
        <div class="bars-wrap">
          <div class="bar-col">
            <div class="bar-value">2 min</div>
            <div class="bar"></div>
            <div class="bar-label">Guion</div>
          </div>
          <div class="bar-col">
            <div class="bar-value">1 min</div>
            <div class="bar"></div>
            <div class="bar-label">Voz</div>
          </div>
          <div class="bar-col">
            <div class="bar-value">30 seg</div>
            <div class="bar"></div>
            <div class="bar-label">Video</div>
          </div>
        </div>

        <div id="cta" class="cta">Probá HyperFrames gratis</div>
      </div>

      <!-- ===== Cierre: destello + negro (14.2s - 15s) ===== -->
      <div id="flash-overlay" class="flash-overlay clip" data-start="14.2" data-duration="0.8" data-track-index="2"></div>
      <div id="black-overlay" class="black-overlay clip" data-start="14.2" data-duration="0.8" data-track-index="3"></div>
    </div>

    <!-- Configuración + plantillas + orquestador. -->
    <script src="core/config.js"></script>

    <script src="components/brand-mark.js"></script>
    <script src="components/kinetic-text.js"></script>
    <script src="components/counter-stat.js"></script>
    <script src="components/elastic-push.js"></script>
    <script src="components/growth-bars.js"></script>
    <script src="components/cta-pulse.js"></script>
    <script src="components/flash-outro.js"></script>

    <script src="index.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = window.NexaBrief.buildTimeline(gsap);
    </script>
  </body>
</html>
