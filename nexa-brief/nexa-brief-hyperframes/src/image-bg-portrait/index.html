<!DOCTYPE html>
<!--
  Port HyperFrames de src/templates/IMG-retrato-impacto/index.html
  (nexa-brief-server) — mismo motor de layout (fitH/fitW/fitV/bestFit/place,
  función pura de CONFIG + viewport, sin RNG ni reloj), reemplazando:
    1. La carga de config.json por fetch() -> window.__hyperframes.getVariables()
       (ver docs/investigaciones/hyperframes-en-nichos-y-selector-ui.md, sección 3).
    2. El ecualizador en vivo (AnalyserNode.getByteFrequencyData(), no seekable)
       por un array de magnitudes precalculado por frame (vars.eqMagnitudes,
       ver hyperframes_audio.py) — mismo problema que ya resolvió la versión
       Remotion (ImageBg.js) con @remotion/media-utils, sin equivalente JS acá.

  data-duration="{{DURATION}}" / src="{{BG_SRC}}" / src="{{AUDIO_SRC}}" son
  placeholders de texto, NO variables: se confirmó (spike 2026-09-17) que el
  "compile" de HyperFrames lee data-duration y el src de <img>/<audio> del
  HTML estático, antes de correr ningún script — una asignación JS a
  `.src`/`.setAttribute("data-duration", ...)` en runtime es invisible para
  esa etapa (el audio queda mudo, sin error, si el src es "" en el HTML).
  HyperframesAdapter reemplaza estos tres placeholders antes de escribir el
  archivo en el directorio de render efímero del job (ver hyperframes_adapter.py).
  vars.config/vars.eqMagnitudes en cambio SÍ funcionan vía getVariables() en
  runtime porque son contenido (texto/números/arrays), no assets de media.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  :root { --bg: #FFFFFF; --ink: #111111; --font-stack: "Arial Black", "Helvetica Neue", sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  #bgblur {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    z-index: 0; filter: blur(50px) saturate(1.15); transform: scale(1.15);
    display: none;
  }
  #bgfill { position: absolute; inset: 0; z-index: 0; }
  #bgfill div { position: absolute; }
  #bg {
    position: absolute; object-fit: contain; z-index: 1;
    --fx: 0px; --fy: 0px;
    -webkit-mask-image:
      linear-gradient(to right, transparent 0, #000 var(--fx), #000 calc(100% - var(--fx)), transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 var(--fy), #000 calc(100% - var(--fy)), transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent 0, #000 var(--fx), #000 calc(100% - var(--fx)), transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 var(--fy), #000 calc(100% - var(--fy)), transparent 100%);
    mask-composite: intersect;
  }
  .txt {
    position: absolute; z-index: 3;
    font-family: var(--font-stack);
    font-weight: 900; text-transform: uppercase;
    letter-spacing: -0.02em; line-height: 0.85;
    color: var(--ink); white-space: pre-line;
  }
  #eq { position: absolute; left: 0; bottom: 0; width: 1920px; z-index: 4; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-start="0" data-width="1920" data-height="1080" data-fps="30" data-duration="{{DURATION}}">
  <img id="bgblur" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="0" src="" alt="" aria-hidden="true">
  <div id="bgfill" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="1"></div>
  <img id="bg" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="2" src="{{BG_SRC}}" alt="">
  <div class="txt clip" id="txtL" data-start="0" data-duration="{{DURATION}}" data-track-index="3"></div>
  <div class="txt clip" id="txtR" data-start="0" data-duration="{{DURATION}}" data-track-index="4"></div>
  <canvas id="eq" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="5"></canvas>
  <audio id="songEl" class="clip" src="{{AUDIO_SRC}}" data-start="0" data-duration="{{DURATION}}" data-track-index="6" data-has-audio="true" data-volume="1" preload="auto"></audio>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
const vars = window.__hyperframes.getVariables();
// vars.config: mismo objeto plano que ya escribe html_generator en
// output_dir/config.json para el resto de los config_driven_template
// (ver docs/investigaciones/..., "img","colors","bgMode","bgRegions","zones",
// "subject","keepOut","texts","eqPosition","edgeFade","typography",
// "anchorPreference") — no declarado en data-composition-variables porque su
// forma es anidada (el schema de variables de HyperFrames solo declara tipos
// escalares); se confirmó (spike) que claves no declaradas igual llegan
// intactas vía getVariables().
const C = vars.config;
const FPS = 30;
const EQ_MAGNITUDES = vars.eqMagnitudes || [];

const GUT = 20, GAP = 14, doc = document;
const $ = id => doc.getElementById(id);
const bgEl = $("bg"), tL = $("txtL"), tR = $("txtR"), eq = $("eq");

doc.documentElement.style.setProperty("--bg", C.colors.bg);
doc.documentElement.style.setProperty("--ink", C.colors.ink);

const FONT_STACKS = {
  "default":        `"Arial Black","Helvetica Neue",sans-serif`,
  "condensed":      `"Liberation Sans Narrow","Nimbus Sans Narrow","Ubuntu Condensed",sans-serif`,
  "serif-display":  `"Liberation Serif","DejaVu Serif","FreeSerif",serif`,
  "black-rounded":  `"Lato Black",Lato,sans-serif`
};
const fontStack = FONT_STACKS[C.typography] || FONT_STACKS["default"];
doc.documentElement.style.setProperty("--font-stack", fontStack);

const mctx = doc.createElement("canvas").getContext("2d");
const FONT = s => `900 ${s}px ${fontStack}`;
function measure(str) { mctx.font = FONT(100); return mctx.measureText(str).width; }

function fitH(text, rw, rh) {
  const w100 = measure(text);
  const fs = Math.min(100 * rw / w100, rh / 0.85);
  return fs > 4 ? { fs, w: w100 * fs / 100, h: fs * 0.85, content: text } : null;
}
function fitW(text, rw, rh) {
  const words = text.trim().split(/\s+/);
  if (words.length < 2) return null;
  const maxW100 = Math.max(...words.map(measure));
  const fs = Math.min(100 * rw / maxW100, rh / (words.length * 0.85));
  return fs > 4 ? { fs, w: maxW100 * fs / 100, h: words.length * fs * 0.85, content: words.join("\n") } : null;
}
function fitV(text, rw, rh) {
  const chars = text.replace(/\s+/g, "").split("");
  const maxC100 = Math.max(...chars.map(measure));
  const fs = Math.min(100 * rw / maxC100, rh / (chars.length * 0.85));
  return fs > 4 ? { fs, w: maxC100 * fs / 100, h: chars.length * fs * 0.85, content: chars.join("\n") } : null;
}

function bestFit(text, rects, minFS) {
  let bH = null, bV = null, rH = null, rV = null;
  for (const r of rects) {
    if (r.w < 30 || r.h < 30) continue;
    for (const f of [fitH(text, r.w, r.h), fitW(text, r.w, r.h)])
      if (f && (!bH || f.fs > bH.fs)) { bH = f; rH = r; }
    const v = fitV(text, r.w, r.h);
    if (v && (!bV || v.fs > bV.fs)) { bV = v; rV = r; }
  }
  if (bH && bH.fs >= minFS) return { ...bH, rect: rH };
  if (bV && bV.fs >= minFS) return { ...bV, rect: rV };
  const s = (bH && bV) ? (bH.fs >= bV.fs ? { f: bH, r: rH } : { f: bV, r: rV })
          : bH ? { f: bH, r: rH } : bV ? { f: bV, r: rV } : null;
  return s ? { ...s.f, rect: s.r } : null;
}

function place(el, fit, align) {
  if (!fit) { el.textContent = ""; return null; }
  const vw = 1920, vh = 1080, r = fit.rect;
  el.style.fontSize = fit.fs + "px";
  el.textContent = fit.content;
  let x = align === "right" ? r.x + r.w - fit.w
        : align === "band"  ? r.x + (r.w - fit.w) / 2
        : r.x;
  let y = r.y + (r.h - fit.h) / 2;
  x = Math.max(GUT, Math.min(x, vw - fit.w - GUT));
  y = Math.max(GUT, Math.min(y, vh - fit.h - GUT));
  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.textAlign = align === "band" ? "center" : align;
  return { x, y, w: fit.w, h: fit.h };
}

let eqInk = null;

function layout() {
  tL.style.textShadow = ""; tR.style.textShadow = "";
  const vw = 1920, vh = 1080;
  const iw = C.img.w, ih = C.img.h;
  const dw = Math.min(vw, vh * iw / ih), dh = Math.min(vh, vw * ih / iw);
  const ix = (vw - dw) / 2, iy = (vh - dh) / 2, k = dw / iw;
  bgEl.style.cssText += `left:${ix}px;top:${iy}px;width:${dw}px;height:${dh}px;`;
  const X = px => ix + px * k, Y = px => iy + px * k;

  const fadeK = (C.edgeFade || 0) * (C.bgMode === "blur" ? 2 : 1);
  const fade = Math.max(24, Math.min(C.bgMode === "blur" ? 160 : 90, Math.min(dw, dh) * fadeK));
  bgEl.style.setProperty("--fx", (C.edgeFade && dw < vw - 1 ? fade : 0) + "px");
  bgEl.style.setProperty("--fy", (C.edgeFade && dh < vh - 1 ? fade : 0) + "px");

  const eqH = Math.min(90, Math.max(44, vh * 0.06));
  eq.style.height = eqH + "px";
  const minFS = Math.max(26, vh * 0.05);

  const blurEl = $("bgblur"), fillEl = $("bgfill");
  const regions = C.bgMode === "regions" ? (C.bgRegions || []) : [];
  blurEl.style.display = C.bgMode === "blur" ? "block" : "none";
  if (C.bgMode === "blur" && !blurEl.getAttribute("src")) blurEl.src = bgEl.getAttribute("src");
  const proj = rg => {
    const [x0, y0, x1, y1] = rg.rect;
    return { x0: x0 <= 0 ? 0 : X(x0), x1: x1 >= iw ? vw : X(x1),
             y0: y0 <= 0 ? 0 : Y(y0), y1: y1 >= ih ? vh : Y(y1) };
  };
  fillEl.innerHTML = "";
  for (const rg of regions) {
    const p = proj(rg), d = doc.createElement("div");
    d.style.cssText = `left:${p.x0}px;top:${p.y0}px;width:${p.x1 - p.x0}px;height:${p.y1 - p.y0}px;background:${rg.color};`;
    fillEl.appendChild(d);
  }
  const inkAt = (px, py) => {
    for (const rg of regions) {
      const p = proj(rg);
      if (px >= p.x0 && px < p.x1 && py >= p.y0 && py < p.y1) return rg.ink || C.colors.ink;
    }
    return C.colors.ink;
  };
  eqInk = regions.length ? (x => inkAt(x, vh - eqH / 2)) : null;
  const tint = (el, p) => { if (p) el.style.color = inkAt(p.x + p.w / 2, p.y + p.h / 2); };
  const cut = rects => {
    if (!regions.length) return rects;
    const out = [];
    for (const r of rects) for (const rg of regions) {
      const p = proj(rg);
      const x0 = Math.max(r.x, p.x0), y0 = Math.max(r.y, p.y0);
      const x1 = Math.min(r.x + r.w, p.x1), y1 = Math.min(r.y + r.h, p.y1);
      if (x1 - x0 >= 30 && y1 - y0 >= 30) out.push({ x: x0, y: y0, w: x1 - x0, h: y1 - y0 });
    }
    return out.length ? out : rects;
  };
  const carve = rects => {
    let list = rects;
    for (const ko of (C.keepOut || [])) {
      const kx0 = X(ko[0]), ky0 = Y(ko[1]), kx1 = X(ko[2]), ky1 = Y(ko[3]);
      const next = [];
      for (const r of list) {
        const ox0 = Math.max(r.x, kx0), oy0 = Math.max(r.y, ky0);
        const ox1 = Math.min(r.x + r.w, kx1), oy1 = Math.min(r.y + r.h, ky1);
        if (ox0 >= ox1 || oy0 >= oy1) { next.push(r); continue; }
        if (ox0 - r.x >= 30)         next.push({ x: r.x, y: r.y, w: ox0 - r.x, h: r.h });
        if (r.x + r.w - ox1 >= 30)   next.push({ x: ox1, y: r.y, w: r.x + r.w - ox1, h: r.h });
        if (oy0 - r.y >= 30)         next.push({ x: r.x, y: r.y, w: r.w, h: oy0 - r.y });
        if (r.y + r.h - oy1 >= 30)   next.push({ x: r.x, y: oy1, w: r.w, h: r.y + r.h - oy1 });
      }
      list = next;
    }
    return list;
  };
  const usable = rects => carve(cut(rects));

  const rectsL = [], rectsR = [];
  for (const [y0, y1, xl, xr] of C.zones) {
    const ry = Math.max(GUT, Y(y0)), ry1 = Math.min(vh - GUT, Y(y1));
    rectsL.push({ x: GUT, y: ry, w: X(xl) - GAP - GUT, h: ry1 - ry });
    rectsR.push({ x: X(xr) + GAP, y: ry, w: vw - GUT - X(xr) - GAP, h: ry1 - ry });
  }
  let fL = null, fR = null;
  if (C.anchorPreference || (C.keepOut || []).length) {
    const zoneIndex = { top: 0, middle: 1, bottom: 2 }[C.anchorPreference];
    const fallback = [2, 1, 0].filter(i => i !== zoneIndex && i < rectsL.length);
    const order = (zoneIndex !== undefined && zoneIndex < rectsL.length) ? [zoneIndex, ...fallback] : fallback;
    for (const i of order) {
      const tryL = bestFit(C.texts.left, usable([rectsL[i]]), minFS);
      const tryR = bestFit(C.texts.right, usable([rectsR[i]]), minFS);
      if (tryL && tryR && tryL.fs >= minFS && tryR.fs >= minFS) { fL = tryL; fR = tryR; break; }
    }
  }
  if (!fL || !fR) {
    fL = bestFit(C.texts.left, usable(rectsL), minFS);
    fR = bestFit(C.texts.right, usable(rectsR), minFS);
  }
  const flankOK = fL && fR && fL.fs >= minFS && fR.fs >= minFS;

  if (flankOK) {
    tint(tL, place(tL, fL, "right"));
    tint(tR, place(tR, fR, "left"));
  } else {
    const bandW = vw - 2 * GUT;
    const topEnd = Math.max(iy, Y(C.subject.top)) - GAP;
    const botStart = Math.max(Y(C.subject.bottom), iy + dh) + GAP;
    const botEnd = vh - eqH - GAP;
    const topOK = topEnd - GUT >= 46, botOK = botEnd - botStart >= 46;
    let txtT = C.texts.left, txtB = C.texts.right, bT, bB;
    if (topOK && botOK) {
      bT = { x: GUT, y: GUT, w: bandW, h: topEnd - GUT };
      bB = { x: GUT, y: botStart, w: bandW, h: botEnd - botStart };
    } else if (topOK) {
      txtT = C.texts.left + " " + C.texts.right; txtB = "";
      bT = { x: GUT, y: GUT, w: bandW, h: topEnd - GUT };
    } else if (botOK) {
      txtB = C.texts.left + " " + C.texts.right; txtT = "";
      bB = { x: GUT, y: botStart, w: bandW, h: botEnd - botStart };
    } else {
      txtT = C.texts.left + " " + C.texts.right; txtB = "";
      bT = { x: GUT, y: GUT, w: bandW, h: vh * 0.16 };
      tL.style.textShadow = "0 0 10px var(--bg), 0 0 22px var(--bg), 0 0 34px var(--bg)";
    }
    tint(tL, place(tL, txtT && bT ? bestFit(txtT, usable([bT]), 18) : null, "band"));
    tint(tR, place(tR, txtB && bB ? bestFit(txtB, usable([bB]), 18) : null, "band"));
  }

  const dpr = 1;
  eq.width = vw * dpr; eq.height = eqH * dpr;
}

bgEl.onload = layout;
layout();

// ---- ecualizador: array precalculado por frame (hyperframes_audio.py) en vez
// de AnalyserNode en vivo — redibuja en cada tick del timeline (el runtime
// controla `tl` con seeks, no con reproducción real; GSAP dispara onUpdate en
// cada seek/tick, tal como recomienda `hyperframes docs gsap`). ----
const ec = eq.getContext("2d");
const BARS = 64;
function drawEqualizer(t) {
  const frame = Math.min(EQ_MAGNITUDES.length - 1, Math.max(0, Math.round(t * FPS)));
  const mags = EQ_MAGNITUDES[frame] || [];
  const w = eq.width, h = eq.height;
  ec.clearRect(0, 0, w, h);
  const bw = w / BARS, mid = h / 2;
  for (let i = 0; i < BARS; i++) {
    const v = mags[i] || 0;
    const bh = Math.max(2, v * (h - 6));
    ec.fillStyle = eqInk ? eqInk(i * bw + bw / 2) : C.colors.ink;
    ec.fillRect(i * bw + bw * 0.18, mid - bh / 2, bw * 0.64, bh);
  }
}
drawEqualizer(0);

const tl = gsap.timeline({ paused: true });
tl.eventCallback("onUpdate", () => drawEqualizer(tl.time()));
tl.to({}, { duration: EQ_MAGNITUDES.length / FPS || 0.1 });

window.__timelines = window.__timelines || {};
window.__timelines["root"] = tl;
</script>
</body>
</html>
