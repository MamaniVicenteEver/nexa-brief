<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>山の静寂 · Haiku Mountain Scene</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #eef2f5; /* Tono suave que combina con la niebla de montaña */
        }

        /* Capa del fondo principal: Sol naciente y montañas lejanas */
        .bg-sun {
            position: absolute;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100dvh;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
            opacity: 0.85;
        }

        /* Capa intermedia: Montañas con siluetas de templos/pagodas */
        .pagoda-layer {
            position: absolute;
            right: 0;
            bottom: 0;
            height: 75vh;
            width: auto;
            object-fit: contain;
            z-index: 2;
            pointer-events: none;
        }

        /* Capa frontal: Silueta de pinos orientales y montañas cercanas */
        .pines-layer {
            position: absolute;
            left: -5vw;
            bottom: -5vh;
            height: 65vh;
            width: auto;
            object-fit: contain;
            z-index: 4;
            pointer-events: none;
            filter: brightness(0.9);
        }

        /* El Haiku con tipografía tradicional y orientación vertical */
        .haiku {
            position: absolute;
            top: 8dvh;
            right: 10%;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-family: "Georgia", "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", serif;
            font-size: 30px;
            line-height: 2.4;
            color: #1a252c;
            letter-spacing: 0.12em;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8), 0 0 10px rgba(255, 255, 255, 0.5);
            font-weight: 600;
            user-select: none;
            z-index: 5;
            pointer-events: none;
        }

        /* El Canvas donde se renderizan las hojas doradas */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 3; /* Colocado entre las capas para dar profundidad */
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="haiku" lang="ja">
        霧立ちて<br>
        山の静寂に<br>
        時は止む
    </div>

    <img class="bg-sun" src="https://images.unsplash.com/photo-1542224566-6e85f2e6772f?q=80&w=1920" alt="Fondo de montaña">

    <img class="pagoda-layer" src="https://images.unsplash.com/photo-1528164344705-47542687000d?q=80&w=1000" alt="Pagoda silueta">

    <img class="pines-layer" src="https://images.unsplash.com/photo-1601049541289-9b1b7bbbfe19?q=80&w=1000" alt="Pinos Japoneses">

    <canvas id="scene"></canvas>

    <script>
        (function() {
            const canvas = document.getElementById("scene");
            const ctx = canvas.getContext("2d");

            let width = 0;
            let height = 0;
            let particles = [];

            // Configuración ajustada para hojas doradas cayendo por el viento de montaña
            const settings = {
                bgColor: "transparent", // Transparente para ver las imágenes de fondo
                minWind: 1.5,
                maxWind: 5.5,
                minSize: 12,
                maxSize: 28,
                emitterY: 0.1,
                emitterSpread: 0.8,
                gravity: 0.35,
                turbulence: 0.6,
                rotationSpeed: 0.02,
                tumbleStrength: 0.5,
                staticTilt: 15,
                particleCount: 80, // Cantidad óptima y elegante
                direction: 1 // 1 = De izquierda a derecha imitando el viento de montaña
            };

            const cache = {
                minSize: 0,
                maxSize: 0,
                minWind: 0,
                maxWind: 0,
                tiltRad: 0
            };

            function updateCache() {
                cache.minSize = Math.min(settings.minSize, settings.maxSize);
                cache.maxSize = Math.max(settings.minSize, settings.maxSize);
                cache.minWind = Math.min(settings.minWind, settings.maxWind);
                cache.maxWind = Math.max(settings.minWind, settings.maxWind);
                cache.tiltRad = (settings.staticTilt * Math.PI) / 180;
            }

            // Dibuja dinámicamente una hermosa hoja otoñal de Ginkgo Biloba (Dorada/Amarilla)
            function createGinkgoLeafImage() {
                const tempCanvas = document.createElement("canvas");
                tempCanvas.width = 64;
                tempCanvas.height = 64;
                const tCtx = tempCanvas.getContext("2d");

                tCtx.beginPath();
                // Forma de abanico característica de la hoja de Ginkgo
                tCtx.moveTo(32, 55); 
                tCtx.quadraticCurveTo(20, 40, 5, 25);
                tCtx.bezierCurveTo(8, 5, 25, 2, 32, 18);
                tCtx.bezierCurveTo(39, 2, 56, 5, 59, 25);
                tCtx.quadraticCurveTo(44, 40, 32, 55);

                // Gradiente dorado elegante
                const gradient = tCtx.createLinearGradient(10, 10, 50, 50);
                gradient.addColorStop(0, '#ebd073'); // Oro claro
                gradient.addColorStop(0.5, '#d4af37'); // Oro tradicional
                gradient.addColorStop(1, '#aa7c11'); // Tono tierra suave

                tCtx.fillStyle = gradient;
                tCtx.fill();

                // Detalles y venas suaves de la hoja
                tCtx.strokeStyle = "rgba(184, 134, 11, 0.4)";
                tCtx.lineWidth = 1;
                tCtx.stroke();

                // Tallo
                tCtx.beginPath();
                tCtx.moveTo(32, 45);
                tCtx.lineTo(32, 62);
                tCtx.strokeStyle = "#aa7c11";
                tCtx.lineWidth = 2;
                tCtx.stroke();

                const img = new Image();
                img.src = tempCanvas.toDataURL();
                return img;
            }

            const particleImage = createGinkgoLeafImage();

            function rotateVector(x, y, z, ax, ay, az) {
                let cos = Math.cos(az);
                let sin = Math.sin(az);
                const x1 = x * cos - y * sin;
                const y1 = x * sin + y * cos;
                const z1 = z;

                cos = Math.cos(ay);
                sin = Math.sin(ay);
                const x2 = x1 * cos + z1 * sin;
                const y2 = y1;
                const z2 = -x1 * sin + z1 * cos;

                cos = Math.cos(ax);
                sin = Math.sin(ax);
                return {
                    x: x2,
                    y: y2 * cos - z2 * sin,
                    z: y2 * sin + z2 * cos
                };
            }

            class Particle {
                constructor(initOnScreen = false) {
                    this.reset(initOnScreen);
                }

                reset(initOnScreen = false) {
                    this.image = particleImage;
                    this.width = cache.minSize + Math.random() * (cache.maxSize - cache.minSize);
                    this.height = this.width;

                    const centerY = height * settings.emitterY;
                    const spreadHeight = height * settings.emitterSpread;
                    const minY = centerY - spreadHeight / 2;
                    const maxY = centerY + spreadHeight / 2;
                    this.y = minY + Math.random() * (maxY - minY);

                    if (initOnScreen) {
                        this.x = Math.random() * width;
                    } else {
                        this.x = settings.direction === -1
                            ? width + this.width + Math.random() * width
                            : -this.width - Math.random() * width;
                    }

                    const sizeFactor = (this.width - cache.minSize) / (cache.maxSize - cache.minSize || 1);
                    this.windFactor = 1 - (sizeFactor * 0.4 + Math.random() * 0.4);
                    this.windFactor = Math.max(0.2, Math.min(1, this.windFactor));

                    this.vx = 0;
                    this.vy = 0;
                    this.waveOffset = Math.random() * Math.PI * 2;
                    this.angleZ = Math.random() * Math.PI * 2;
                    this.spinZ = (Math.random() - 0.5) * settings.rotationSpeed;
                    this.angleX = Math.random();
                    this.angleY = Math.random();
                    this.spinX = (Math.random() - 0.5) * 0.05;
                    this.spinY = (Math.random() - 0.5) * 0.05;
                }

                update() {
                    const targetSpeed = cache.minWind + (cache.maxWind - cache.minWind) * this.windFactor;
                    this.vx += (targetSpeed - this.vx) * 0.05;
                    this.x += this.vx * settings.direction;

                    const gravityMod = 1.2 - this.windFactor;
                    this.vy += settings.gravity * 0.04 * gravityMod;

                    const wave = Math.sin(this.x * 0.008 * settings.direction + this.waveOffset);
                    this.vy += wave * settings.turbulence * 0.04;
                    this.vy *= 0.97;
                    this.y += this.vy;

                    this.angleZ += this.spinZ + this.vx * 0.001;

                    if (settings.tumbleStrength > 0) {
                        this.angleX += this.spinX * settings.tumbleStrength;
                        this.angleY += this.spinY * settings.tumbleStrength;
                    }

                    const buffer = 150;
                    const outByX = settings.direction === -1 ? this.x < -buffer : this.x > width + buffer;
                    if (outByX || this.y > height + buffer || this.y < -buffer) {
                        this.reset(false);
                    }
                }

                draw() {
                    const vecU = rotateVector(1, 0, 0, this.angleX, this.angleY + cache.tiltRad, this.angleZ);
                    const vecV = rotateVector(0, 1, 0, this.angleX, this.angleY + cache.tiltRad, this.angleZ);

                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.transform(vecU.x, vecU.y, vecV.x, vecV.y, 0, 0);
                    ctx.drawImage(this.image, -this.width / 2, -this.height / 2, this.width, this.height);
                    ctx.restore();
                }
            }

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = "high";
            }

            function initParticles() {
                particles = [];
                for (let i = 0; i < settings.particleCount; i++) {
                    const particle = new Particle(true);
                    particle.x = Math.random() * width;
                    particles.push(particle);
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height); // Limpia con transparencia para dejar ver los fondos

                for (const particle of particles) {
                    particle.update();
                    particle.draw();
                }

                requestAnimationFrame(animate);
            }

            function start() {
                updateCache();
                resize();
                initParticles();
                animate();
                window.addEventListener("resize", resize);
            }

            start();
        })();
    </script>
</body>
</html>
