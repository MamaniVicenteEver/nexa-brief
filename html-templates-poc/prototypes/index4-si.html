<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexa Brief - Automated Diagnostics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Share Tech Mono"', 'monospace'],
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            azure: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0077ff',
              600: '#005ed4',
              950: '#000814',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: #010206;
      overflow: hidden;
    }

@keyframes characterFloat {
  0%, 100% {
    transform: translateY(0px) scale(1);
    filter: contrast(1.2) brightness(0.95) saturate(1.2) drop-shadow(0 0 50px var(--aura-glow, rgba(0, 119, 255, 0.45)));
  }
  50% {
    transform: translateY(-20px) scale(1.02);
    filter: contrast(1.25) brightness(1.05) saturate(1.3) drop-shadow(0 0 80px var(--aura-glow-bright, rgba(0, 221, 255, 0.7)));
  }
}

    .character-animated {
      animation: characterFloat 6s ease-in-out infinite;
      transition: filter 1s ease-in-out;
    }

    .bg-grid-pattern {
      background-size: 50px 50px;
      background-image: 
        linear-gradient(to right, rgba(0, 119, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 119, 255, 0.03) 1px, transparent 1px);
    }

    .scanlines::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      z-index: 10;
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      opacity: 0.5;
    }

    :root {
      --aura-glow: rgba(0, 119, 255, 0.35);
      --aura-glow-bright: rgba(0, 221, 255, 0.55);
      --accent-color: #0077ff;
    }

    .transition-all-custom {
      transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="h-full text-slate-100 font-sans antialiased scanlines selection:bg-azure-600 selection:text-white">

  <div class="fixed inset-0 z-0 bg-[#010307]">
    <div id="ambient-radial-glow" class="absolute inset-0 bg-[radial-gradient(circle_at_65%_45%,_var(--aura-glow-bright)_0%,_transparent_65%)] opacity-25 transition-all-custom"></div>
    <div id="tactical-grid" class="absolute inset-0 bg-grid-pattern opacity-60 transition-all-custom"></div>
    <div class="absolute inset-0 opacity-[0.015] bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px]"></div>
  </div>

  <div class="fixed inset-0 z-10 flex flex-col justify-center items-end pr-24 pointer-events-none select-none opacity-10">
    <h1 id="bg-giant-text-1" class="font-mono text-[14vw] font-bold tracking-tighter leading-none text-azure-500 transition-all-custom">NEXA</h1>
    <h1 id="bg-giant-text-2" class="font-mono text-[10vw] font-light tracking-widest leading-none text-slate-400 -mt-4 transition-all-custom">STAGE_02</h1>
  </div>

  <div class="absolute bottom-8 right-8 lg:bottom-12 lg:right-12 text-right flex flex-col gap-1 font-mono text-sm tracking-widest select-none z-30">
    <span class="text-white font-bold text-xl" style="text-shadow: 0 0 30px rgba(0, 170, 255, 0.6);">NEXA</span>
    <span class="text-azure-400 text-xs" style="text-shadow: 0 0 20px rgba(0, 200, 255, 0.4);">BRIEF</span>
  </div>

  <div class="fixed inset-0 z-10 flex justify-center items-end pointer-events-none select-none">
<div class="absolute bottom-[26vh] left-[-10%] w-[1450px] h-[850px] md:w-[1000px] md:h-[1000px] flex items-center justify-center">
  <canvas id="visualizer-canvas" class="w-full h-full filter blur-[1px] opacity-90 mix-blend-screen transition-all duration-1000"></canvas>
</div>
<div class="character-container absolute bottom-0 left-[5%] h-[90vh] flex items-end">
  <img id="character" class="character-image character-animated h-[100%] w-auto object-contain" src="https://raw.githubusercontent.com/BlackStar1991/Pictures-for-sharing-/master/Japan/girl.png" alt="Sujeto Muscular">
</div>
  </div>

  <script type="module">
    const canvas = document.getElementById('visualizer-canvas');
    const ctx = canvas.getContext('2d');

    let animationFrameId;
    let rotationAngle = 0;
    let simulationTime = 0;
    let auraScalePulse = 1.8;
    let currentThemeIndex = 0;
    const themeKeys = ['cobalt', 'amethyst', 'emerald', 'amber'];

    const themes = {
      cobalt: {
        glow: 'rgba(0, 119, 255, 0.45)',
        glowBright: 'rgba(0, 221, 255, 0.7)',
        accent: '#0077ff',
        gradientStart: '#0011bb',
        gradientMiddle: '#00ddff',
        gradientEnd: '#ccddff',
        giantText: 'NEXA',
      },
      amethyst: {
        glow: 'rgba(168, 85, 247, 0.45)',
        glowBright: 'rgba(232, 121, 249, 0.7)',
        accent: '#a855f7',
        gradientStart: '#581c87',
        gradientMiddle: '#d946ef',
        gradientEnd: '#f3e8ff',
        giantText: 'VOID',
      },
      emerald: {
        glow: 'rgba(16, 185, 129, 0.45)',
        glowBright: 'rgba(52, 211, 153, 0.7)',
        accent: '#10b981',
        gradientStart: '#064e3b',
        gradientMiddle: '#34d399',
        gradientEnd: '#ecfdf5',
        giantText: 'CHROMA',
      },
      amber: {
        glow: 'rgba(245, 158, 11, 0.45)',
        glowBright: 'rgba(251, 191, 36, 0.7)',
        accent: '#f59e0b',
        gradientStart: '#78350f',
        gradientMiddle: '#fbbf24',
        gradientEnd: '#fef3c7',
        giantText: 'CORE',
      }
    };

    function resizeCanvas() {
      const parent = canvas.parentElement;
      canvas.width = parent.clientWidth * 1.5;
      canvas.height = parent.clientHeight * 1.5;
    }

    function renderProceduralAura() {
      animationFrameId = requestAnimationFrame(renderProceduralAura);
      
      if (!ctx) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const innerRadius = canvas.width * 0.22;
      const barCount = 140;
      const angleStep = (Math.PI * 2) / barCount;
      
      simulationTime += 0.012;
      rotationAngle -= 0.001;

      const dynamicScale = auraScalePulse + Math.sin(simulationTime * 1.5) * 0.25;

      for (let layer = 0; layer < 2; layer++) {
        const isOuterLayer = layer === 1;
        const currentLayerMultiplier = isOuterLayer ? 0.8 : 1.1;
        
        for (let i = 0; i < barCount; i++) {
          const currentAngle = i * angleStep + rotationAngle * (isOuterLayer ? -1 : 1);
          
          const wavePhase1 = Math.sin(i * 0.12 + simulationTime * 2.0) * 25;
          const wavePhase2 = Math.cos(i * 0.08 - simulationTime * 1.5) * 15;
          const noiseFactor = Math.sin(i * 0.5 + simulationTime * 4.0) * 10;
          
          let barHeight = (35 + wavePhase1 + wavePhase2 + noiseFactor) * dynamicScale * currentLayerMultiplier;
          if (barHeight < 15) barHeight = 15;

          const xStart = centerX + Math.cos(currentAngle) * innerRadius;
          const yStart = centerY + Math.sin(currentAngle) * innerRadius;
          const xEnd = centerX + Math.cos(currentAngle) * (innerRadius + barHeight);
          const yEnd = centerY + Math.sin(currentAngle) * (innerRadius + barHeight);

          const tData = themes[themeKeys[currentThemeIndex]];
          const gradient = ctx.createLinearGradient(xStart, yStart, xEnd, yEnd);
          
          if (isOuterLayer) {
            gradient.addColorStop(0, tData.gradientStart + '33');
            gradient.addColorStop(0.4, tData.gradientMiddle + '88');
            gradient.addColorStop(1, '#ffffff00');
          } else {
            gradient.addColorStop(0, tData.gradientStart);
            gradient.addColorStop(0.5, tData.gradientMiddle);
            gradient.addColorStop(1, tData.gradientEnd + '15');
          }

          ctx.strokeStyle = gradient;
          ctx.lineWidth = isOuterLayer ? 1.5 : 4.5;
          ctx.lineCap = 'round';
          
          ctx.shadowBlur = isOuterLayer ? 0 : 25;
          ctx.shadowColor = tData.accent;

          ctx.beginPath();
          ctx.moveTo(xStart, yStart);
          ctx.lineTo(xEnd, yEnd);
          ctx.stroke();
        }
      }
    }

    function autoTransitionTheme() {
      currentThemeIndex = (currentThemeIndex + 1) % themeKeys.length;
      const key = themeKeys[currentThemeIndex];
      const t = themes[key];

      document.documentElement.style.setProperty('--aura-glow', t.glow);
      document.documentElement.style.setProperty('--aura-glow-bright', t.glowBright);
      document.documentElement.style.setProperty('--accent-color', t.accent);

      const radialGlow = document.getElementById('ambient-radial-glow');
      radialGlow.style.backgroundImage = `radial-gradient(circle at 65% 45%, ${t.glowBright} 0%, transparent 65%)`;

      document.getElementById('bg-giant-text-1').textContent = t.giantText;
      document.getElementById('bg-giant-text-1').style.color = t.accent;
    }

    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      renderProceduralAura();
      autoTransitionTheme();
      setInterval(autoTransitionTheme, 6000);
    });

    window.addEventListener('beforeunload', () => {
      cancelAnimationFrame(animationFrameId);
    });
  </script>
</body>
</html>
