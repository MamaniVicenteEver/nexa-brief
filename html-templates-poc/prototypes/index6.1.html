<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexa-Brief Core Engine — Stage III</title>
  <style>
    :root {
      --void: #050005;
      --cyan: #00e5ff;
      --white: #ffffff;
      --coral: #ff0080;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--void);
      font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .background-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.2) contrast(1.2) saturate(0.4) hue-rotate(280deg);
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      background: radial-gradient(circle at center, rgba(30, 0, 45, 0.2) 0%, #050005 85%);
      pointer-events: none;
    }

    .neon-pulse-glow {
      position: fixed;
      inset: 0;
      z-index: 3;
      box-shadow: inset 0 0 100px rgba(255, 0, 128, 0.15);
      pointer-events: none;
    }

    .nexa-brief-brand {
      position: fixed;
      top: 50px;
      left: 60px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 15px;
      opacity: 0.75;
      pointer-events: none;
      user-select: none;
    }

    .brand-nexa {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.3em;
      color: var(--white);
      text-shadow: 0 0 15px rgba(255, 0, 128, 0.5);
    }

    .brand-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.25);
    }

    .brand-brief {
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      color: var(--coral);
      text-shadow: 0 0 15px rgba(255, 0, 128, 0.3);
    }

    .cinematic-bg-text {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      gap: 14vw;
      padding: 0 40px;
      user-select: none;
    }

    .giant-letter {
      font-size: clamp(8rem, 26vw, 25rem);
      font-weight: 300;
      color: rgba(240, 225, 240, 0.8);
      letter-spacing: -0.05em;
      text-shadow: 0 0 40px rgba(255, 0, 150, 0.15);
    }

    .character-container {
      position: fixed;
      bottom: -2vh;
      left: 50%;
      transform: translateX(-50%);
      height: 92vh;
      z-index: 5;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      pointer-events: none;
    }

    .character-container::before {
      content: '';
      position: absolute;
      bottom: 2vh;
      width: 45vw;
      height: 85vh;
      border-radius: 50% 50% 0 0;
      background: conic-gradient(
        from 0deg,
        transparent 0%,
        rgba(255, 0, 170, 0.6) 25%,
        rgba(255, 208, 0, 0.4) 40%,
        transparent 50%,
        transparent 100%
      );
      z-index: -1;
      filter: blur(60px);
      animation: snakeLightOrbit 7s linear infinite;
    }

    @keyframes snakeLightOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .character-medium {
      height: 100%;
      width: auto;
      object-fit: contain;
      user-select: none;
      filter: drop-shadow(0 15px 45px rgba(0,0,0,0.9)) brightness(0.4) contrast(1.2) sepia(0.2) hue-rotate(285deg) saturate(1.3);
    }

    #visualizer-canvas {
      position: fixed;
      bottom: 8vh;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 50px;
      z-index: 6;
      pointer-events: none;
      opacity: 0.75;
    }

    .visualizer-glow {
      position: fixed;
      bottom: 6vh;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 80px;
      z-index: 5;
      background: radial-gradient(ellipse at center bottom, rgba(255, 0, 128, 0.12) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(8px);
    }

    .hud-phrase-container {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      font-size: clamp(1rem, 2.5vw, 1.8rem);
      font-weight: 300;
      letter-spacing: 0.3em;
      color: rgba(255, 255, 255, 0.9);
      z-index: 8;
      user-select: none;
      animation: textAtmosphericBreath 4s ease-in-out infinite alternate;
    }

    @keyframes textAtmosphericBreath {
      0% {
        opacity: 0.25;
        filter: blur(1px);
        text-shadow: 0 0 10px rgba(255, 0, 128, 0.2);
      }
      100% {
        opacity: 0.95;
        filter: blur(0px);
        text-shadow: 0 0 25px rgba(255, 0, 128, 0.6), 0 0 45px rgba(255, 208, 0, 0.3);
      }
    }
  </style>
</head>
<body>

  <img class="background-scene" src="https://images.unsplash.com/photo-1518655048521-f130df041f66?w=1920&q=80" alt="Cinematic Horizon">

  <div class="vignette-overlay"></div>
  <div class="neon-pulse-glow"></div>

  <div class="nexa-brief-brand">
    <span class="brand-nexa">NEXA</span>
    <span class="brand-divider"></span>
    <span class="brand-brief">BRIEF</span>
  </div>

  <div class="cinematic-bg-text">
    <span class="giant-letter">Y</span>
    <span class="giant-letter" style="opacity: 0.03;">O</span>
    <span class="giant-letter">U</span>
  </div>

  <div class="character-container">
    <img class="character-medium"
      src="https://raw.githubusercontent.com/BlackStar1991/Pictures-for-sharing-/master/Japan/girl.png"
      alt="Isolated Subject">
  </div>

  <div class="visualizer-glow"></div>

  <div class="hud-phrase-container">
    <span>OBSESSED</span>
    <span>WITH</span>
  </div>

  <audio id="audio" src="song.mp3" loop preload="auto" style="display:none;"></audio>

  <script type="module">
    let audioCtx, analyser, dataArray, canvas, ctx, animationFrameId;
    const audio = document.getElementById('audio');

    function initVisualizer() {
      canvas = document.getElementById('visualizer-canvas');
      ctx = canvas.getContext('2d');
      canvas.width = 500;
      canvas.height = 50;

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      analyser.smoothingTimeConstant = 0.88;

      try {
        const source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch (e) {}

      const bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);

      renderSpectrumLoop();
    }

    function getFallbackValue(i, t) {
      return (Math.sin(t * 1.2 + i * 0.4) * 0.3 + 0.35) * 160;
    }

    let startTime = null;

    function renderSpectrumLoop(timestamp) {
      animationFrameId = requestAnimationFrame(renderSpectrumLoop);

      if (!startTime) startTime = timestamp || performance.now();
      const elapsed = ((timestamp || performance.now()) - startTime) / 1000;

      analyser.getByteFrequencyData(dataArray);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const barCount = 32;
      const barWidth = 4;
      const gap = 6;
      const totalWidth = (barCount * barWidth) + ((barCount - 1) * gap);
      let x = (canvas.width - totalWidth) / 2;

      for (let i = 0; i < barCount; i++) {
        const rawVal = dataArray[i] || 0;
        const val = rawVal < 5 ? getFallbackValue(i, elapsed) : rawVal;
        const normalizedValue = val / 255;

        const envelope = 1 - Math.abs((i / (barCount - 1)) * 2 - 1) * 0.4;
        const barHeight = Math.max(3, normalizedValue * canvas.height * 0.9 * envelope);
        const y = (canvas.height - barHeight) / 2;

        const gradient = ctx.createLinearGradient(0, y, 0, y + barHeight);
        gradient.addColorStop(0,   'rgba(255, 0, 140, 0.9)');
        gradient.addColorStop(0.45,'rgba(255, 180, 60, 0.7)');
        gradient.addColorStop(1,   'rgba(200, 0, 80, 0.5)');

        ctx.fillStyle = gradient;
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(255, 0, 128, 0.4)';

        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, barHeight, 2);
        ctx.fill();

        x += barWidth + gap;
      }

      ctx.shadowBlur = 0;
    }

    window.addEventListener('DOMContentLoaded', () => {
      audio.play().catch(() => setTimeout(() => audio.play().catch(() => {}), 300));
      initVisualizer();
    });

    window.addEventListener('beforeunload', () => {
      cancelAnimationFrame(animationFrameId);
      if (audioCtx) audioCtx.close();
    });
  </script>
</body>
</html>
