<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Meditación · Atmósfera Zen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            /* Lado izquierdo blanco (#fff), Lado derecho negro (#000) */
            background: -webkit-linear-gradient(right, #000 50.99%, #fff 51%);
            background: linear-gradient(to left, #000 50.99%, #fff 51%);
            font-family: 'Shippori Mincho B1', 'Yu Mincho', 'Georgia', serif;
            transition: background 0.5s ease;
        }

        body {
            width: 100%;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .meditationBox {
            position: relative;
            width: 100%;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .meditation {
            width: 320px;
            height: 320px;
            position: absolute;
            left: 50%;
            top: 50%;
            margin: -160px 0 0 -160px;
            border-radius: 50%;
            box-shadow: 0px 0px 100px rgba(124, 160, 184, 0.4);
            animation: aura 5s ease-in-out infinite alternate;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: transform 0.3s ease;
        }

        .meditation:hover {
            transform: scale(1.03);
        }

        .meditation svg {
            width: 100%;
            height: 100%;
        }

        @keyframes aura {
            0% {
                box-shadow: 0px 0px 100px rgba(124, 160, 184, 0.45);
            }
            100% {
                box-shadow: 0px 0px 30px rgba(43, 52, 56, 0.25);
            }
        }

        /* Colores del Buda Yin-Yang */
        .st2 {
            fill: #FFFFFF; /* Mitad derecha visible en fondo negro */
        }
        .st3 {
            fill: #E5E5E5;
        }

        /* Panel izquierdo (Fondo Blanco -> Letras Negras) */
        .side-text-left {
            position: absolute;
            left: 8%;
            top: 50%;
            transform: translateY(-50%);
            color: #111111; /* Contraste perfecto sobre blanco */
            z-index: 10;
            writing-mode: vertical-rl;
            text-orientation: upright; /* Fuerza a las letras a no rotar sideways */
            font-size: clamp(1.4rem, 2.5vw, 2.2rem);
            letter-spacing: 0.4em;
            font-weight: 700;
            line-height: 2.2;
            pointer-events: none;
            user-select: none;
            font-family: 'Shippori Mincho B1', serif;
            animation: cascadeFallLeft 4s ease-out forwards;
        }

        /* Panel derecho (Fondo Negro -> Letras Blancas) */
        .side-text-right {
            position: absolute;
            right: 8%;
            top: 50%;
            transform: translateY(-50%);
            color: #ffffff; /* Contraste perfecto sobre negro */
            z-index: 10;
            writing-mode: vertical-rl;
            text-orientation: upright; /* Fuerza a las letras a no rotar sideways */
            font-size: clamp(1.4rem, 2.5vw, 2.2rem);
            letter-spacing: 0.4em;
            font-weight: 700;
            line-height: 2.2;
            pointer-events: none;
            user-select: none;
            font-family: 'Shippori Mincho B1', serif;
            animation: cascadeFallRight 4s ease-out forwards;
        }

        @keyframes cascadeFallLeft {
            0% {
                opacity: 0;
                transform: translateY(-60%) scaleY(0.9);
                filter: blur(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(-50%) scaleY(1);
                filter: blur(0px);
            }
        }

        @keyframes cascadeFallRight {
            0% {
                opacity: 0;
                transform: translateY(-40%) scaleY(0.9);
                filter: blur(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(-50%) scaleY(1);
                filter: blur(0px);
            }
        }

        /* Cápsula de cristal para visibilidad absoluta sobre el corte de la pantalla */
        .bottom-haiku {
            position: absolute;
            bottom: 6vh;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: clamp(0.85rem, 1.2vw, 1.1rem);
            letter-spacing: 0.25em;
            text-align: center;
            font-style: italic;
            z-index: 10;
            white-space: nowrap;
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0.6rem 2.4rem;
            border-radius: 40px;
            font-family: 'Shippori Mincho B1', serif;
            animation: pulseBreath 4s ease-in-out infinite alternate;
        }

        @keyframes pulseBreath {
            0% {
                opacity: 0.8;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            }
            100% {
                opacity: 1;
                box-shadow: 0 10px 40px rgba(124, 160, 184, 0.25);
            }
        }

        /* Botón discreto indicador de reproducción */
        .sound-indicator {
            position: absolute;
            top: 4vh;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Shippori Mincho B1', serif;
            font-size: 0.8rem;
            letter-spacing: 0.3em;
            color: #888888;
            opacity: 0.7;
            text-transform: uppercase;
            z-index: 12;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        @media (max-width: 768px) {
            .side-text-left {
                left: 3%;
                font-size: 1.1rem;
            }
            .side-text-right {
                right: 3%;
                font-size: 1.1rem;
            }
            .meditation {
                width: 260px;
                height: 260px;
                margin: -130px 0 0 -130px;
            }
            .bottom-haiku {
                font-size: 0.75rem;
                letter-spacing: 0.15em;
                padding: 0.5rem 1.5rem;
            }
        }
    </style>

    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700&display=swap" rel="stylesheet">
</head>

    <!-- Reproductor de Audio nativo -->
    <audio id="ambient-audio" loop>
        <source src="https://github.com/BlackStar1991/AudioSharing/blob/master/Meditation/Meditation.mp3?raw=true" type="audio/mpeg">
        <source src="https://github.com/BlackStar1991/AudioSharing/blob/master/Meditation/Meditation.ogg?raw=true" type="audio/ogg">
    </audio>

    <script type="module">
        const audio = document.getElementById('ambient-audio');
        const trigger = document.getElementById('meditation-trigger');
        const statusText = document.getElementById('audio-status');

        let audioCtx;

        function startAudio() {
            // Inicializar el contexto en la primera interacción del usuario para cumplir con las políticas
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (audio.paused) {
                audio.play().then(() => {
                    statusText.innerText = "Respiración Activa";
                    statusText.style.opacity = "0.4";
                }).catch(e => {
                    console.log("Error al reproducir audio:", e);
                });
            } else {
                audio.pause();
                statusText.innerText = "Click para meditar";
                statusText.style.opacity = "0.7";
            }
        }

        // Permitir reproducir/pausar haciendo click en cualquier parte del Buda o la pantalla
        trigger.addEventListener('click', startAudio);
        document.body.addEventListener('click', (e) => {
            if (e.target === document.body) {
                startAudio();
            }
        });
    </script>
