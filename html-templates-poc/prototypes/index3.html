<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crimson Overdrive // Nexa Brief</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Share+Tech+Mono&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #000000;
      font-family: 'Share Tech Mono', monospace;
      -webkit-font-smoothing: antialiased;
    }

    .background-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: radial-gradient(circle at left, #ff0011 0%, #000000 70%);
      opacity: 0.18;
    }

    /* Full-screen canvas for floating ash and jagged debris */
    #ambient-particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .nexa-brief-brand {
      position: fixed;
      top: 40px;
      left: 60px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 15px;
      opacity: 0.75;
    }

    .brand-nexa {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.25rem;
      letter-spacing: 0.25em;
      color: #ff0011;
      text-shadow: 0 0 12px rgba(255, 0, 17, 0.6);
    }

    .brand-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.25);
    }

    .brand-brief {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      letter-spacing: 0.35em;
      color: #ffffff;
    }

    .cinematic-vertical-text {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      padding-right: 8vw;
      pointer-events: none;
      user-select: none;
    }

    /* Adaptable lettering container with custom kinetic oscillation */
    .giant-title-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      will-change: transform;
    }

    .giant-letter {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      color: rgba(255, 0, 17, 0.12);
      letter-spacing: -0.08em;
      line-height: 0.8;
      text-shadow: 0 0 25px rgba(255, 0, 17, 0.05);
      transform: skewX(-5deg);
      transition: all 0.5s ease;
      animation: letterLoopPulse 4s infinite ease-in-out;
      will-change: transform, color;
    }

    /* Sequential pulse delays across letters */
    .giant-letter:nth-child(1) { animation-delay: 0.0s; }
    .giant-letter:nth-child(2) { animation-delay: 0.2s; }
    .giant-letter:nth-child(3) { animation-delay: 0.4s; }
    .giant-letter:nth-child(4) { animation-delay: 0.6s; }
    .giant-letter:nth-child(5) { animation-delay: 0.8s; }
    .giant-letter:nth-child(6) { animation-delay: 1.0s; }
    .giant-letter:nth-child(7) { animation-delay: 1.2s; }
    .giant-letter:nth-child(8) { animation-delay: 1.4s; }

    @keyframes letterLoopPulse {
      0%, 100% {
        color: rgba(255, 0, 17, 0.12);
        text-shadow: 0 0 25px rgba(255, 0, 17, 0.05);
        transform: skewX(-5deg) scale(1);
      }
      30% {
        color: rgba(255, 0, 17, 0.85);
        text-shadow: 0 0 50px rgba(255, 0, 17, 0.7), 0 0 90px rgba(255, 0, 17, 0.45);
        transform: skewX(-5deg) scale(1.06);
      }
      60% {
        color: rgba(255, 0, 17, 0.12);
        text-shadow: 0 0 25px rgba(255, 0, 17, 0.05);
        transform: skewX(-5deg) scale(1);
      }
    }

    .character-container {
      position: fixed;
      bottom: 0;
      left: 6vw;
      height: 94vh;
      width: auto;
      z-index: 4;
      pointer-events: none;
      user-select: none;
      animation: charFloat 5s ease-in-out infinite alternate;
    }

    @keyframes charFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }

    .character-image {
      height: 100%;
      width: auto;
      object-fit: contain;
      filter: contrast(1.3) brightness(0.9) saturate(1.2) drop-shadow(0 0 50px rgba(255, 0, 17, 0.5));
      will-change: transform;
    }

    #visualizer-canvas {
      position: fixed;
      bottom: 5vh;
      right: 5vw;
      width: 450px;
      height: 100px;
      z-index: 5;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Background static stage lighting -->
  <div class="background-stage"></div>

  <!-- Fullscreen cinematic particle layer -->
  <canvas id="ambient-particles"></canvas>

  <div class="nexa-brief-brand">
    <div class="brand-nexa">NEXA</div>
    <div class="brand-divider"></div>
    <div class="brand-brief">BRIEF</div>
  </div>

  <!-- Adaptive cinematic vertical text (Scales automatically in JS) -->
  <div class="cinematic-vertical-text">
    <div class="giant-title-container" id="adaptive-title-container">
      <!-- Se inyecta la palabra mediante JS letra por letra para control de escala -->
    </div>
  </div>

  <!-- Character asset containing Baki Hanma transparent render -->
  <div class="character-container">
    <img class="character-image" src="https://static.wikia.nocookie.net/personajes-de-ficcion-database/images/6/61/New_Grappler_Baki.png/revision/latest?cb=20201130130259&path-prefix=es" alt="Baki Hanma Overdrive">
  </div>

  <!-- Canvas for audio spectrum simulator -->
  <canvas id="visualizer-canvas"></canvas>

  <script type="module">
    let canvas, ctx, animationFrameId;
    let particleCanvas, pCtx;
    
    // Configura aquí la palabra que desees (se adaptará dinámicamente)
    const TARGET_TEXT = "FUERZA"; 

    // Setup de partículas ambientales (Piedras flotantes y cenizas)
    const stones = [];
    const stoneCount = 35;

    function setupAdaptiveTitle() {
      const container = document.getElementById('adaptive-title-container');
      container.innerHTML = '';
      
      const length = TARGET_TEXT.length;
      // Cálculo preciso de escala: a letras más largas, disminuye el tamaño de forma controlada
      const calculatedFontSize = Math.min(18, 90 / length);
      
      [...TARGET_TEXT].forEach(char => {
        const letterNode = document.createElement('h1');
        letterNode.className = 'giant-letter';
        letterNode.style.fontSize = `clamp(4rem, ${calculatedFontSize}vh, 18rem)`;
        letterNode.textContent = char;
        container.appendChild(letterNode);
      });
    }

    function initAmbientParticles() {
      particleCanvas = document.getElementById('ambient-particles');
      pCtx = particleCanvas.getContext('2d');
      
      particleCanvas.width = window.innerWidth;
      particleCanvas.height = window.innerHeight;

      for (let i = 0; i < stoneCount; i++) {
        const size = Math.random() * 8 + 3;
        stones.push({
          x: Math.random() * particleCanvas.width,
          y: Math.random() * particleCanvas.height + particleCanvas.height,
          size: size,
          speedY: -(Math.random() * 0.9 + 0.3),
          speedX: (Math.random() - 0.5) * 0.4,
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.02,
          opacity: Math.random() * 0.6 + 0.15,
          color: Math.random() > 0.5 ? 'rgba(255, 0, 17, ' : 'rgba(35, 35, 35, ',
          points: generateJaggedPoints(size)
        });
      }
    }

    function generateJaggedPoints(size) {
      const points = [];
      const steps = 6;
      for (let i = 0; i < steps; i++) {
        const angle = (i / steps) * Math.PI * 2;
        const offset = (Math.random() * 0.4 + 0.8) * size;
        points.push({
          x: Math.cos(angle) * offset,
          y: Math.sin(angle) * offset
        });
      }
      return points;
    }

    function renderAmbientParticles(elapsed, pulseStrength) {
      pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);

      stones.forEach(stone => {
        // La velocidad física de las piedras se amplifica con la vibración rítmica
        const activeSpeedY = stone.speedY * (1.0 + pulseStrength * 2.5);
        stone.y += activeSpeedY;
        stone.x += stone.speedX;
        stone.rotation += stone.rotationSpeed * (1.0 + pulseStrength * 1.5);

        // Reciclado infinito de piedras al salir del Viewport superior
        if (stone.y < -50) {
          stone.y = particleCanvas.height + 50;
          stone.x = Math.random() * particleCanvas.width;
        }

        pCtx.save();
        pCtx.translate(stone.x, stone.y);
        pCtx.rotate(stone.rotation);
        pCtx.globalAlpha = stone.opacity;
        
        // Estilo de brillo volcánico o roca gris de carbón
        pCtx.fillStyle = stone.color + (0.3 + pulseStrength * 0.7) + ')';
        pCtx.shadowColor = 'rgba(255, 0, 17, 0.4)';
        pCtx.shadowBlur = stone.size * pulseStrength * 4;

        pCtx.beginPath();
        stone.points.forEach((pt, idx) => {
          if (idx === 0) pCtx.moveTo(pt.x, pt.y);
          else pCtx.lineTo(pt.x, pt.y);
        });
        pCtx.closePath();
        pCtx.fill();
        pCtx.restore();
      });
    }

    // Simulated data storage for autonomous continuous mode
    let simulatedData = new Float32Array(32);

    function renderSpectrumLoop(timestamp) {
      animationFrameId = requestAnimationFrame(renderSpectrumLoop);

      if (!startTime) startTime = timestamp || performance.now();
      const elapsed = ((timestamp || performance.now()) - startTime) / 1000;

      // Autorespuesta simétrica procedimental para grabación autónoma
      for (let i = 0; i < simulatedData.length; i++) {
        const base = Math.sin(elapsed * 2.8 + i * 0.4) * 0.5 + 0.5;
        const noise = Math.sin(elapsed * 8.5 - i * 0.8) * 0.3;
        simulatedData[i] = Math.max(0, (base + noise) * 255 * (1 - i / simulatedData.length));
      }

      // Medición del pulso rítmico principal (Bass-drop) para las físicas ambientales
      const pulseStrength = Math.pow(simulatedData[2] / 255, 1.8);

      // Renderizar capa atmosférica de piedras
      renderAmbientParticles(elapsed, pulseStrength);

      // Limpieza y dibujo del ecualizador
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const centerY = canvas.height / 2;

      // Cuadrícula técnica de fondo
      ctx.strokeStyle = 'rgba(255, 0, 17, 0.04)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 20) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }

      // Dibujo de la firma de onda central elástica
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255, 0, 17, 0.85)';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#ff0011';
      ctx.shadowBlur = 12 + pulseStrength * 8;

      const barCount = 36;
      const sliceWidth = canvas.width / (barCount - 1);

      for (let i = 0; i < barCount; i++) {
        const val = simulatedData[i % simulatedData.length] / 255;
        const h = Math.pow(val, 1.3) * (canvas.height * 0.45);
        const x = i * sliceWidth;
        const y = centerY + Math.sin(i * 0.3 + elapsed * 6) * h;
        
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Columnas y cabezales dinámicos simétricos
      for (let i = 0; i < barCount; i++) {
        const val = simulatedData[i % simulatedData.length] / 255;
        const barHeight = Math.max(3, Math.pow(val, 1.2) * (canvas.height * 0.4));
        const x = i * sliceWidth;

        const gradient = ctx.createLinearGradient(x, centerY - barHeight, x, centerY + barHeight);
        gradient.addColorStop(0, '#ff0011');
        gradient.addColorStop(0.5, 'rgba(255, 0, 17, 0.15)');
        gradient.addColorStop(1, '#ff0011');

        ctx.fillStyle = gradient;
        ctx.fillRect(x - 1, centerY - barHeight, 2, barHeight * 2);

        // Cabezales reflectivos blancos de precisión
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x - 2, centerY - barHeight - 4, 4, 2);
        ctx.fillRect(x - 2, centerY + barHeight + 2, 4, 2);
      }
    }

    let startTime = null;

    window.addEventListener('DOMContentLoaded', () => {
      canvas = document.getElementById('visualizer-canvas');
      ctx = canvas.getContext('2d');
      canvas.width = 450;
      canvas.height = 100;

      // Ejecutar auto-escala del título
      setupAdaptiveTitle();
      
      // Inicializar piedras y cenizas flotantes
      initAmbientParticles();

      // Arrancar loop procedural autónomo
      requestAnimationFrame(renderSpectrumLoop);
    });

    // Ajustar partículas si se cambia el tamaño de la ventana
    window.addEventListener('resize', () => {
      if (particleCanvas) {
        particleCanvas.width = window.innerWidth;
        particleCanvas.height = window.innerHeight;
      }
    });

    window.addEventListener('beforeunload', () => {
      cancelAnimationFrame(animationFrameId);
    });
  </script>
</body>
</html>
