<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA // ULTRA INSTINCT PLAYER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0f1115;
      font-family: 'Montserrat', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .background-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #ffffff 0%, #b2b8c2 35%, #3a414b 70%, #0d0f12 100%);
      z-index: 1;
    }

    .backdrop-text-container {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      user-select: none;
      pointer-events: none;
    }

    .aura-title {
      font-size: clamp(10rem, 32vw, 38rem);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.04em;
      text-shadow: 0 25px 60px rgba(0, 0, 0, 0.12);
    }

    #particles-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    .character-master-box {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 4;
      pointer-events: none;
    }

    .goku-wrapper {
      position: relative;
      height: 72vh;
      width: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: gokuLevitate 4s ease-in-out infinite alternate;
    }

    @keyframes gokuLevitate {
      0% { transform: translateY(-20px); }
      100% { transform: translateY(20px); }
    }

    .goku-image {
      height: 100%;
      width: auto;
      object-fit: contain;
      filter: grayscale(1) contrast(1.4) brightness(0.9) drop-shadow(0 30px 45px rgba(0,0,0,0.55));
      mix-blend-mode: luminosity; 
    }

    .hair-glow {
      position: absolute;
      top: 5%;
      width: 180px;
      height: 150px;
      background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(240,245,255,0.8) 40%, transparent 70%);
      filter: blur(30px);
      z-index: -1;
      mix-blend-mode: screen;
      opacity: 0.9;
      animation: pulseEnergy 0.25s ease-in-out infinite alternate;
    }

    @keyframes pulseEnergy {
      0% { transform: scale(0.92); opacity: 0.75; }
      100% { transform: scale(1.08); opacity: 0.95; }
    }

    .lightning-spark {
      position: absolute;
      background: #ffffff;
      width: 3px;
      height: 45px;
      filter: drop-shadow(0 0 8px #ffffff) blur(0.5px);
      opacity: 0;
      transform-origin: bottom center;
    }

    .spark-1 { left: 45%; top: 8%; animation: strike 2.3s infinite linear; animation-delay: 0.2s; }
    .spark-2 { right: 42%; top: 12%; animation: strike 1.8s infinite linear; animation-delay: 0.7s; transform: rotate(15deg); }
    .spark-3 { left: 38%; top: 25%; animation: strike 3s infinite linear; animation-delay: 0s; transform: rotate(-20deg); }
    .spark-4 { right: 35%; top: 30%; animation: strike 2.5s infinite linear; animation-delay: 1.2s; transform: rotate(10deg); }

    @keyframes strike {
      0% { transform: scaleY(0) translateY(0); opacity: 0; }
      5% { opacity: 1; transform: scaleY(1); }
      10% { opacity: 0; transform: scaleY(0.5) translateX(5px); }
      55% { transform: scaleY(0) translateY(-20px); opacity: 0; }
      60% { opacity: 1; transform: scaleY(1.2) rotate(-5deg); }
      65% { opacity: 0; }
      100% { transform: scaleY(0); opacity: 0; }
    }

    .brand-header {
      position: fixed;
      top: 50px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      z-index: 5;
      color: #111111;
    }

    .nexa-logo {
      text-align: right;
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      line-height: 1;
      color: #ffffff;
    }
    .nexa-logo span {
      font-size: 0.55rem;
      letter-spacing: 0.35em;
      font-weight: 400;
      display: block;
      margin-top: 2px;
      color: #b2b8c2;
    }

    .player-footer {
      position: fixed;
      bottom: 40px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 5;
      color: #ffffff;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .track-info-panel {
      line-height: 1.8;
    }
    .track-title {
      font-weight: 900;
      font-size: 1rem;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="background-stage"></div>
  
  <div class="backdrop-text-container">
    <h1 class="aura-title">AURA</h1>
  </div>

  <canvas id="particles-canvas"></canvas>

  <div class="character-master-box">
    <div class="goku-wrapper">
      <div class="hair-glow"></div>
      
      <div class="lightning-spark spark-1"></div>
      <div class="lightning-spark spark-2"></div>
      <div class="lightning-spark spark-3"></div>
      <div class="lightning-spark spark-4"></div>

      <img class="goku-image" src="https://static.wikia.nocookie.net/personajes-de-ficcion-database/images/b/b0/Goku_Ultra_Instinto_3.png/revision/latest/scale-to-width-down/595?cb=20200423225643&path-prefix=es" alt="Goku Ultra Instinct">
    </div>
  </div>

  <div class="brand-header">
    <div class="nexa-logo">
      NEXA
      <span>BRIEF</span>
    </div>
  </div>

  <div class="player-footer">
    <div class="track-info-panel">
      <span id="current-track-name" class="track-title">GOAT</span>
    </div>
  </div>

  <script>
    const trackNameEl = document.getElementById('current-track-name');
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');

    let startTime = performance.now();

    const tracklist = [
      { time: 0, name: "GOAT" },
      { time: 149, name: "GOAT 2.0" },
      { time: 315, name: "LACRIMOSA MOZART FUNK" },
      { time: 465, name: "PLANKTON FUNK" },
      { time: 635, name: "FLAMES (SLOWED)" },
      { time: 808, name: "MOONLIGHT" }
    ];

    let stones = [];
    function initStones() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      stones = [];
      for (let i = 0; i < 28; i++) {
        stones.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 9 + 3,
          speedY: -(Math.random() * 0.5 + 0.1),
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.03,
          pulseOffset: Math.random() * 100
        });
      }
    }

    function drawStones(elapsed) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(33, 38, 46, 0.85)";

      stones.forEach(stone => {
        stone.y += stone.speedY;
        stone.rotation += stone.rotSpeed;

        if (stone.y < -20) {
          stone.y = canvas.height + 20;
          stone.x = Math.random() * canvas.width;
        }

        ctx.save();
        const driftX = Math.sin((elapsed + stone.pulseOffset) * 0.4) * 0.4;
        ctx.translate(stone.x + driftX, stone.y);
        ctx.rotate(stone.rotation);
        
        ctx.beginPath();
        ctx.moveTo(-stone.size, -stone.size * 0.7);
        ctx.lineTo(stone.size * 0.9, -stone.size);
        ctx.lineTo(stone.size, stone.size * 0.5);
        ctx.lineTo(-stone.size * 0.5, stone.size);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });
    }

    function loop(timestamp) {
      requestAnimationFrame(loop);
      const elapsed = (timestamp - startTime) / 1000;

      const currentTrack = [...tracklist].reverse().find(t => elapsed >= t.time);
      if (currentTrack && trackNameEl.textContent !== currentTrack.name) {
        trackNameEl.textContent = currentTrack.name;
      }

      drawStones(elapsed);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initStones();
      requestAnimationFrame(loop);
    });
    window.addEventListener('resize', initStones);
  </script>
</body>
</html>
