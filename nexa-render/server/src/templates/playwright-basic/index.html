<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SABOR+ — anuncio vertical</title>
    <link rel="stylesheet" href="./template.css" />
  </head>
  <body>
    <main class="ad" aria-label="Plantilla de anuncio vertical">
      <div class="ad__safe">
        <div class="ad__brand">SABOR<span>+</span></div>
        <div class="ad__counter"><span></span><b>00:11</b></div>
        <section class="scene scene--hey" aria-hidden="true"><p class="scene__eyebrow">UNA PAUSA DELICIOSA</p><h1>Hey<span>!</span></h1><i class="burst burst--one"></i><i class="burst burst--two"></i></section>
        <section class="scene scene--craving" aria-hidden="true"><p>Tu antojo</p><h2>Hey<span>!</span></h2><small>ACABA DE LLEGAR</small></section>
        <section class="scene scene--delivery" aria-hidden="true"><div class="delivery-copy"><span>Te traigo</span><strong>Hasta</strong><em>AQUÍ</em></div><div class="delivery-line"></div><p>pedí desde tu celular</p></section>
        <section class="scene scene--map" aria-hidden="true">
          <p class="map-title">CERCA DE VOS</p>
          <div class="map-card"><svg class="map-card__map" viewBox="0 0 400 330" role="img" aria-label="Mapa ilustrado"><rect width="400" height="330" rx="28" fill="#f7f1df"/><path d="M-25 70C85 42 91 152 202 125S347 43 440 95M-30 254C55 191 136 260 221 221S345 166 435 215" fill="none" stroke="#d3d7ce" stroke-width="25"/><path d="M70-12C98 80 62 144 150 189s92 87 84 163M315-10c-23 96 42 130 14 207s-79 81-55 146" fill="none" stroke="#d3d7ce" stroke-width="18"/><path d="M-8 112c92 7 90 54 172 28s119-10 244 10M15 290c88-54 150-8 220-60s87-39 164-38" fill="none" stroke="#cde8ce" stroke-width="12"/><path d="M40 47c70 38 87 31 135 3s92-31 160 25M17 199c78-26 107 3 163-11s118-43 192-23" fill="none" stroke="#b9d7f0" stroke-width="10"/><circle cx="205" cy="164" r="40" fill="#ff6b17" opacity=".18"/><path class="map-card__pin" d="M205 101c-27 0-49 22-49 49 0 37 49 91 49 91s49-54 49-91c0-27-22-49-49-49Z" fill="#ff4f18"/><circle cx="205" cy="150" r="16" fill="#fff8ed"/></svg><div class="map-card__label"><b>Tu pedido está aquí</b><span>en camino · 12 min</span></div></div>
        </section>
        <section class="scene scene--food" aria-hidden="true"><div class="food-video"><div class="food-video__glow"></div><i class="food-video__drop food-video__drop--one"></i><i class="food-video__drop food-video__drop--two"></i><div class="food-video__bowl"><div></div><div></div><div></div></div><span class="food-video__rec">● REC</span></div><div class="food-copy"><p>RECIÉN HECHO</p><h2>Tu momento<br><em>favorito.</em></h2><button type="button" data-restart>VER MENÚ <span>↗</span></button></div></section>
      </div>
      <button class="ad__control" type="button" data-toggle aria-label="Pausar o reanudar la vista previa">Pausar</button>
    </main>
    <script src="./template.js"></script>
  </body>
</html>
