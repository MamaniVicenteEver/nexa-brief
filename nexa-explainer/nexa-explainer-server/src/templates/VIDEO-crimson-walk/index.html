<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Crimson Walk · NEXA Explainer</title>
  <style>
    :root{--ink:#fff3ed;--muted:#ffdcd3;--red:#ff3d4f;--bg:#120507}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--bg)}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.34) brightness(.72) saturate(1.42) sepia(.14) hue-rotate(-18deg)}.shade{position:absolute;inset:0;background:linear-gradient(0deg,#120104c2,transparent 48%,#0008),linear-gradient(90deg,#32000470,transparent 55%)}.walk{position:absolute;z-index:1;left:0;right:0;bottom:19%;height:1px;background:var(--red);box-shadow:0 0 18px #ff3d4f;animation:travel 6s linear infinite}@keyframes travel{from{transform:translateX(-30%)}to{transform:translateX(30%)}}.walk:before{content:'•  •  •  •  •  •  •';position:absolute;left:4%;top:-1.7em;color:var(--red);font-size:clamp(19px,2vw,34px);letter-spacing:1.4em}.copy{position:absolute;z-index:2;left:6vw;bottom:25vh;max-width:47vw}.eyebrow{color:var(--red);font:700 11px/1 'IBM Plex Mono',monospace;letter-spacing:.23em}.title{margin:2.5vh 0 2vh;font:700 italic clamp(56px,7.2vw,142px)/.82 'Playfair Display',Georgia,serif;letter-spacing:-.07em;text-shadow:0 5px 24px #000}.support{max-width:28em;color:var(--muted);font-size:clamp(13px,1.1vw,22px);line-height:1.4}.pulse{position:absolute;right:9vw;top:16vh;width:clamp(42px,4vw,78px);aspect-ratio:1;border:1px solid var(--red);border-radius:50%;animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 38px #ff3d4f;transform:scale(1.22)}}
  </style>
</head>
<body><main class="stage" data-template="crimson-walk"><video src="__VIDEO_SRC__" playsinline muted preload="auto"></video><div class="shade"></div><div class="walk"></div><div class="pulse" aria-hidden="true"></div><section class="copy"><div class="eyebrow">NEXA / WALK · PASO 01</div><h1 class="title">CAMINAR<br>JUNTOS</h1><p class="support">Una línea de pasos para sostener el dolor, la respuesta y la decisión de seguir.</p></section></main></body>
</html>
