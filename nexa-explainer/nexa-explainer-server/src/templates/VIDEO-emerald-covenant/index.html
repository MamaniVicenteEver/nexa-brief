<!doctype html>

  <style>
    :root{--ink:#e9ffeb;--muted:#b9d9c1;--green:#76ff91;--bg:#03130c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--bg)}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.6) contrast(1.38) saturate(.72) hue-rotate(58deg)}.grid{position:absolute;inset:0;background:linear-gradient(#76ff9118 1px,transparent 1px),linear-gradient(90deg,#76ff9118 1px,transparent 1px);background-size:8vw 8vh;mask-image:linear-gradient(90deg,#000,transparent 72%);animation:drift 11s linear infinite}@keyframes drift{to{transform:translate(2vw,1vh)}}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#000d,transparent 46%,#000b)}.copy{position:absolute;z-index:2;left:6vw;bottom:15vh;max-width:47vw}.brand{font:700 11px/1 'IBM Plex Mono',monospace;letter-spacing:.25em;color:var(--green)}.title{margin:2.8vh 0 1.8vh;font:800 clamp(54px,7.2vw,140px)/.82 'Space Grotesk',Inter,sans-serif;letter-spacing:-.11em;text-shadow:0 0 26px #76ff9144}.support{max-width:28em;color:var(--muted);font-size:clamp(13px,1.1vw,22px);line-height:1.4}.node{position:absolute;right:13vw;top:24vh;width:clamp(12px,1vw,22px);aspect-ratio:1;border:2px solid var(--green);border-radius:50%;box-shadow:0 0 28px var(--green);animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.8);opacity:.5}}
  </style>
</head>
<body><main class="stage" data-template="emerald-covenant"><video src="__VIDEO_SRC__" playsinline muted preload="auto"></video><div class="grid"></div><div class="shade"></div><div class="node" aria-hidden="true"></div><section class="copy"><div class="brand">NEXA / FIELD · SEÑAL 01</div><h1 class="title">LA TIERRA<br>RESPONDE</h1><p class="support">Una retícula viva para dejar respirar la responsabilidad antes de la decisión.</p></section></main></body>
</html>
