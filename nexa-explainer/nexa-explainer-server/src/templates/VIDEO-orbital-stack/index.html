<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Orbital Stack · NEXA Explainer</title>
  <style>
    :root{--ink:#eef0ff;--muted:#c3c9ef;--blue:#9aa6ff;--violet:#b34eff;--bg:#070817}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--bg)}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.26) brightness(.7) contrast(1.4) saturate(1.3) hue-rotate(168deg)}.shade{position:absolute;inset:0;background:radial-gradient(circle at 35% 45%,transparent 12%,#040514b8 70%),linear-gradient(90deg,#040514a0,transparent 55%,#04051499)}#orbital-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}.copy{position:absolute;z-index:2;right:6vw;bottom:17vh;width:min(34vw,650px);text-align:right}.eyebrow{color:var(--blue);font:700 11px/1 'IBM Plex Mono',monospace;letter-spacing:.24em}.title{margin:2.7vh 0 2vh;font:800 clamp(54px,7vw,136px)/.82 'Space Grotesk',Inter,sans-serif;letter-spacing:-.11em;text-shadow:0 0 28px #7689ff99}.support{color:var(--muted);font-size:clamp(13px,1.1vw,22px);line-height:1.4;margin-left:auto;max-width:28em}.badge{display:inline-block;margin-top:2vh;border:1px solid #9aa6ff99;color:var(--blue);padding:.7vh .8vw;font:700 10px/1 'IBM Plex Mono',monospace;letter-spacing:.12em}
  </style>
</head>
<body><main class="stage" data-template="orbital-stack"><video src="__VIDEO_SRC__" playsinline muted preload="auto"></video><canvas id="orbital-canvas" aria-hidden="true"></canvas><div class="shade"></div><section class="copy"><div class="eyebrow">NEXA / ORBIT · ÓRBITA 01</div><h1 class="title">UNA IDEA<br>EN ÓRBITA</h1><p class="support">Capas de profundidad para conectar pregunta, evidencia, cambio y futuro.</p><span class="badge">THREE.JS / WEBGL · SEEK SAFE</span></section></main>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js';
    const canvas=document.getElementById('orbital-canvas');const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});const scene=new THREE.Scene();const camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,100);camera.position.z=10;const group=new THREE.Group();scene.add(group);
    for(let i=0;i<5;i+=1){const ring=new THREE.Mesh(new THREE.TorusGeometry(1.05+i*.12,.012+i*.002,8,96),new THREE.MeshBasicMaterial({color:i%2?0x9aa6ff:0xb34eff,transparent:true,opacity:.28+i*.04,wireframe:true}));ring.userData.i=i;group.add(ring)}
    function frame(ms){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.left=-w/2;camera.right=w/2;camera.top=h/2;camera.bottom=-h/2;camera.updateProjectionMatrix();group.position.set(-w*.14,0,0);group.scale.setScalar(Math.min(w,h)*.22);group.rotation.x=.42+Math.sin(ms*.0002)*.08;group.rotation.y=ms*.00005;group.children.forEach((r,i)=>{r.rotation.z=ms*.00004*(i+1)+i*.25});renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
  </script>
</body>
</html>
